<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Vaelena Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* VOICE: a DM's leather-bound codex, read at the table.
   IDEA: the parchment character sheets Tracy already prints, turned into pages you tap.
   PICTURE: each entry's framed crest and double-ruled headline name.
   COLOUR and TYPE: parchment, maroon, red rule; Cinzel over EB Garamond; per-character themes swap the palette.
   LAYOUT: one centred column, 640px max, sticky top bar. */
:root{color-scheme:light}
.t-parchment{--bg:#F3E9D2;--card:#FBF5E6;--ink:#2B1D14;--muted:#6B5644;--accent:#7A1F1F;--rule:#9B2226;--line:#C9B28A;--on:#FBF5E6}
.t-embershade{--bg:#1C1717;--card:#2A2222;--ink:#EDE3D1;--muted:#B8A99A;--accent:#E07A45;--rule:#B5532A;--line:#5A3A2C;--on:#1C1717}
.t-dawnwarden{--bg:#2B0A0E;--card:#3C1116;--ink:#F4E7C8;--muted:#D4B98A;--accent:#E0B04A;--rule:#C08A2E;--line:#6E2A22;--on:#2B0A0E}
.t-dawnwarden .crest{background:radial-gradient(circle at 50% 35%,#4A161B,#2B0A0E);box-shadow:0 0 0 1px #C08A2E,0 6px 24px rgba(224,176,74,.18)}
.t-the-raven{--bg:#120D17;--card:#1E1626;--ink:#ECE4F2;--muted:#B6A8C4;--accent:#A985D6;--rule:#6E4A9A;--line:#3A2C4A;--on:#120D17}
.t-the-raven .portrait,.t-the-raven .crest{box-shadow:0 0 0 1px #6E4A9A,0 8px 30px rgba(110,74,154,.35)}
.t-shadowsong{--bg:#0B1215;--card:#13202A;--ink:#E2EEF0;--muted:#9FB8BE;--accent:#4FC1C9;--rule:#2A7F8C;--line:#22414A;--on:#0B1215}
.t-shadowsong .portrait,.t-shadowsong .crest{box-shadow:0 0 0 1px #2A7F8C,0 8px 30px rgba(79,193,201,.22)}
.t-reaver{--bg:#090C0A;--card:#111712;--ink:#E4EEE6;--muted:#A3B5A8;--accent:#39FF6A;--rule:#1FB84A;--line:#21352A;--on:#090C0A}
.t-reaver .portrait,.t-reaver .crest{box-shadow:0 0 0 1px #39FF6A,0 0 26px rgba(57,255,106,.35)}
.t-reaver h1{text-shadow:0 0 18px rgba(57,255,106,.35)}
.t-steelforged{--bg:#20252B;--card:#2B3138;--ink:#E6E9EC;--muted:#A9B2BB;--accent:#9FC1DD;--rule:#7C93A8;--line:#47525E;--on:#20252B}
.t-tidewater{--bg:#E7EEF0;--card:#F6FAFB;--ink:#14262E;--muted:#4C626B;--accent:#1F5A73;--rule:#2C7590;--line:#AFC4CB;--on:#F6FAFB}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "EB Garamond",Georgia,serif;overflow-x:clip}
#app{min-height:100vh;background:var(--bg);color:var(--ink)}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 64px;border-inline:6px double var(--accent);min-height:100vh}
@media(max-width:660px){.wrap{border-inline-width:0;padding:0 16px 64px}}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.cz{font-family:Cinzel,serif;letter-spacing:.06em}
a{color:var(--accent)}
.btn,.chip{font-family:Cinzel,serif;font-size:12px;letter-spacing:.06em;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:999px;min-height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-decoration:none}
.btn.solid{background:var(--accent);color:var(--on)}
.btn.plain{border-color:transparent;padding:0 6px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--rule);outline-offset:2px}
h1{font-family:Cinzel,serif;font-weight:700;color:var(--accent);font-size:clamp(28px,7vw,40px);line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:Cinzel,serif;font-size:14px;letter-spacing:.12em;color:var(--accent);margin:22px 0 8px}
.rule{height:4px;background:var(--rule);margin-top:10px}.rule+.rule2{height:1px;background:var(--rule);margin-top:2px}
.muted{color:var(--muted)}.small{font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--accent);border-radius:10px;padding:0 12px;height:48px;margin-top:16px}
.search input{border:0;background:transparent;font:inherit;font-size:17px;color:var(--ink);flex:1;outline:none}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;min-height:92px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none}
.tile b{font-family:Cinzel,serif;font-size:15px}.tile.off{opacity:.55}
.row{display:flex;align-items:center;gap:6px;min-height:52px;border-bottom:1px solid var(--line)}
.row a.name{flex:1;color:var(--ink);text-decoration:none;display:flex;flex-direction:column;padding:6px 0}
.row a.name b{font-weight:600;font-size:18px}
.dim{opacity:.58}
.chk{flex:0 0 40px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:0;cursor:pointer;padding:0;margin-left:-8px}
.chk span{width:21px;height:21px;border:2px solid var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center}
.chk[aria-checked=true] span{background:var(--accent)}
.chk svg{display:none}.chk[aria-checked=true] svg{display:block}
.lock{flex:0 0 32px;display:flex;justify-content:center;color:var(--muted)}
.crest{width:112px;height:136px;margin:18px auto 10px;border:3px solid var(--accent);outline:1px solid var(--accent);outline-offset:4px;background:var(--card);display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-size:52px;color:var(--accent)}
.center{text-align:center}
.deskonly{display:none}
.side{display:none}
@media(min-width:1000px){
  .desk{display:grid;grid-template-columns:clamp(260px,18vw,340px) minmax(0,1fr);max-width:2200px;margin:0 auto;min-height:100vh}
  .side{display:block;position:sticky;top:0;height:100vh;overflow:auto;padding:22px 18px 40px;border-right:6px double var(--accent);background:var(--card)}
  .desk .wrap{max-width:none;margin:0;border-inline:0;padding:0 clamp(24px,3vw,72px) 80px}
  .brand{display:block;font-family:Cinzel,serif;font-weight:700;font-size:22px;line-height:1.1;color:var(--accent);text-decoration:none;padding-bottom:10px;border-bottom:4px solid var(--rule);box-shadow:0 3px 0 -2px var(--rule)}
  .search.side{display:flex;height:42px;margin:14px 0 6px}
  .sgroup{margin-top:14px}.slabel{font-size:11px;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
  .slink{display:block;padding:6px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:16px}
  .slink:hover{background:var(--bg)}.slink.on{background:var(--accent);color:var(--on)}
  .slink.set{margin-top:20px;border:1px solid var(--accent);color:var(--accent);font-family:Cinzel,serif;font-size:13px;text-align:center}
  .entry{display:grid;grid-template-columns:clamp(300px,30vw,560px) minmax(0,1fr);gap:clamp(28px,3vw,72px);align-items:start}
  .ent-a{padding-bottom:20px}
  .desk .portrait{width:min(100%,clamp(200px,16vw,300px))}
  .desk .fact .k{flex-basis:clamp(104px,9vw,160px)}
  .ent-b{padding-top:18px}.deskonly{display:block;margin-top:0}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .desk .top{padding:14px 0}
}
.portrait{width:min(52vw,200px);aspect-ratio:4/5;margin:18px auto 10px;padding:0;border:3px solid var(--accent);outline:1px solid var(--accent);outline-offset:5px;background:var(--card);overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.fullbody{margin:6px auto 14px;width:min(100%,340px);border:2px solid var(--accent);outline:1px solid var(--accent);outline-offset:4px;background:var(--card)}
.fullbody img{width:100%;height:auto;display:block}
.names{display:flex;flex-direction:column;align-items:center;margin-top:6px}
.names .line{display:flex;align-items:center;gap:2px;font-size:17px}
.tool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.fact{display:flex;align-items:flex-start;gap:4px;border-bottom:1px dashed var(--line)}
.fact:last-child{border-bottom:0}
.fact .k{flex:0 0 104px;color:var(--muted);padding:9px 8px 9px 0;font-size:15px;overflow-wrap:anywhere}
.fact .v{flex:1;padding:9px 0;font-size:16px}
.sec{border-bottom:1px solid var(--line)}
.sechead{display:flex;align-items:center;gap:2px}
.sechead .toggle{flex:1;display:flex;justify-content:space-between;align-items:center;min-height:50px;background:none;border:0;padding:0;cursor:pointer;font-family:Cinzel,serif;font-size:15px;letter-spacing:.08em;color:var(--accent);text-align:left}
.count{font-family:"EB Garamond",serif;font-size:14px;letter-spacing:0;color:var(--muted);margin-inline:8px}
.item{display:flex;align-items:flex-start;gap:4px;padding:2px 0}
.item .txt{flex:1;padding:8px 0}
.item.sub .txt{font-family:Cinzel,serif;font-size:14px;color:var(--accent)}
.item ul{margin:6px 0 0;padding-left:18px}
.bul{color:var(--accent);flex:0 0 18px;padding-top:9px}
.warn{display:inline-block;font-size:13px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 8px;margin-left:6px}
.dets{margin-top:6px;padding:2px 0 2px 8px;border-left:2px solid var(--line);font-size:15px;color:var(--muted)}
.det{display:flex;align-items:flex-start;gap:2px}
.det .chk{flex-basis:36px;width:36px;height:36px}
.det .chk span{width:18px;height:18px}
.detlab{font-size:10px;letter-spacing:.1em}
.det ul{margin:4px 0 0;padding-left:18px}
.pen{background:none;border:1px solid var(--line);border-radius:6px;color:var(--accent);min-width:32px;min-height:32px;cursor:pointer;font-size:15px}
.editbox textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--accent);border-radius:8px;padding:8px}
.secbar{display:flex;gap:8px;padding:4px 0 10px}
.badge{font-family:Cinzel,serif;font-size:11px;letter-spacing:.08em;padding:4px 10px;border-radius:999px;background:var(--accent);color:var(--on)}
.empty{padding:28px 0;text-align:center;font-style:italic;color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin-top:24px;border-top:1px solid var(--line);padding-top:10px}
select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:40px;padding:0 8px}
.seg{display:flex;border:1.5px solid var(--accent);border-radius:999px;overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;background:none;color:var(--accent);font-family:Cinzel,serif;font-size:13px;letter-spacing:.06em;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on)}
.side-tabs{margin-top:12px}.side-tabs a{flex:1;text-align:center;padding:8px 4px;color:var(--accent);text-decoration:none;font-family:Cinzel,serif;font-size:12px;letter-spacing:.06em}.side-tabs a[aria-current=true]{background:var(--accent);color:var(--on)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--accent);color:var(--on);padding:8px 16px;border-radius:999px;font-size:15px;z-index:9}
</style>
</head>

approximately 6'5\". Red hair, green/teal eyes. Wields a greatsword in the field. Formal white-and-red attire befitting a leader and mentor."}]}, {"dm": false, "heading": "Heritage & Bloodline", "id": "accmo5", "items": [{"id": "3oyghl", "kind": "bullet", "sub": [], "text": "**Mother**: Ashalia Sherridan (\"Embershade\") — direct descendant of the Sherridan branch of Vallesari's holy line, one of Vaylena's oldest Flameborn bloodlines"}, {"id": "7sfkno", "kind": "bullet", "sub": [], "text": "**Father**: Einor Kresanthe"}, {"id": "6ehyhy", "kind": "bullet", "sub": [], "text": "Heritages — Sherridan fire lineage"}]}, {"dm": false, "heading": "Background", "id": "nut4b7", "items": [{"id": "s9u9ir", "kind": "bullet", "sub": [], "text": "As a child, her fire ability was unremarkable — a cultural disappointment given the Sherridan name's prestige. Enlisted as close to a common soldier as possible at 16, when the war instituted a draft for elemental-bonded individuals."}, {"id": "a89xhr", "kind": "bullet", "sub": [], "text": "Served reliably on the Northern Front for the war's first ~3.5 years, alongside squadmates **Leo Kristoff** and **Alfred \"Donny\" Donner**."}, {"id": "1ipbazz", "kind": "bullet", "sub": [], "text": "**Lost in the tundra**: Separated from her squad during a massive blizzard on a long-range patrol."}, {"id": "1kpv9dp", "kind": "bullet", "sub": [], "text": "**Return to Galthis**: Walked into the Central Command tent at Fort Galthis, road-weary in a fur cloak with Fen at her side, as the Knight-Commander ruled on what to do with a young Vaxus."}, {"id": "1ijalmt", "kind": "bullet", "sub": [], "text": "**The Flame of the North**: Returned to the front transformed Earned the highest recorded Ferran kill count of any Vaylen soldier. **Fen was killed** by Ferran warrior **Eldaenia Sarlei** during this period"}, {"id": "1rgsogl", "kind": "bullet", "sub": [], "text": "The Northern Front ended when Ferrena withdrew and redirected south, coinciding with the Raven's completion of House Tyran's subjugation."}, {"id": "17rmhkx", "kind": "bullet", "sub": [], "text": "**Building the Wardens**: While still fighting the Northern Front, Anaria recruited her first two followers: **Frederic \"Fred\" Donner** (younger brother of the late Alfred \"Donny\" Donner, recruited for his swordsmanship and genuine desire to help others) and **Allison Vint** (an unbonded tracker from Salenbrook, hired initially by her local hunters' lodge). For most of the remaining front, the two served alongside her within regular Central Command ranks; only in the war's final two years on that front did she get the three of them formed into their own standalone unit — simply called **the Wardens** at the time."}, {"id": "xuriwm", "kind": "bullet", "sub": [], "text": "After the Northern Front closed, she brought her team to Central to recoup, train, and plan"}, {"id": "b1k3im", "kind": "bullet", "sub": [], "text": "**The capture of Keep Al'geth**: With her core team assembled (Fred, Allison, Cibilla, Dovah), Anaria led a tense infiltration that routed House Vortan from Keep Al'geth, securing Vaylena's first real foothold on the western front at the hard-won river delta. It was at this point she formally adopted the **Dawnwarden** title."}]}, {"dm": false, "heading": "Personality", "id": "gg6e41", "items": [{"id": "hclvfx", "kind": "bullet", "sub": [], "text": "Presents as calm, collected, and mentor-like"}, {"id": "18u2hyn", "kind": "bullet", "sub": [], "text": "**A deliberate, self-aware public image** — a conscious separation between the legend and the woman."}, {"id": "1fu1hr6", "kind": "bullet", "sub": [], "text": "Actively resists the Circle's influence where she can, working to bar it from operating freely"}]}, {"dm": false, "heading": "Relationships", "id": "1hcbjia", "items": [{"id": "1yz8e63", "kind": "bullet", "sub": [], "text": "**Ashalia Sherridan** — mother"}, {"id": "6y6424", "kind": "bullet", "sub": [], "text": "**Einor Kresanthe** — father"}, {"id": "5wjkpq", "kind": "bullet", "sub": [], "text": "**Vaxus Vulcano**"}, {"id": "cb107b", "kind": "bullet", "sub": [], "text": "**Eldaenia Sarlei** — killed her wolf companion Fen"}, {"id": "1mglhla", "kind": "bullet", "sub": [], "text": "**Frederic \"Fred\" Donner** — first Warden recruit; younger brother of the late Alfred \"Donny\" Donner."}, {"id": "1fnrq0x", "kind": "bullet", "sub": [], "text": "**Allison Vint** — second Warden recruit"}, {"id": "1ic253m", "kind": "bullet", "sub": [], "text": "**Cibilla Mothbourn** — the Wardens' main healer"}, {"id": "m382c3", "kind": "bullet", "sub": [], "text": "**Dovah Ikelos** — the Wardens' spellcaster"}]}, {"dm": false, "heading": "Current Status", "id": "4vwkdt", "items": [{"id": "1vqmv1f", "kind": "bullet", "sub": [], "text": "Headquartered at Keep Al'geth as the Dawnwarden, having recently invited Central Command to migrate operations there."}, {"id": "ye83bo", "kind": "bullet", "sub": [], "text": "Serves in a mentor/advisor role, relying on her Wardens for field operations, and coordinates with Knight-Commander Thane Khavren as an equal power rather than as part of Central Command's own structure."}, {"id": "wbzrv3", "kind": "bullet", "sub": [], "text": "The Church of the Mother finds her activities troubling and regards her as a genuine potential threat, but — uncertain how to act against Vaylena's most celebrated war hero"}, {"id": "6y7dyp", "kind": "bullet", "sub": [], "text": "An only child; sole head of House Sherridan following her mother's death."}]}], "theme": "Dawnwarden"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Ashalia Sherridan", "id": "ashalia-sherridan", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Embershade"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "rnqbvw", "label": "Current Residence/Affiliation", "text": "Hunter from Salenbrook"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Briar Vint", "id": "briar-vint", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Calyx Van Saun", "id": "calyx-van-saun", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "qbibkv", "label": "Current Residence/Affiliation", "text": "The Wardens"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Cibilla Mothbourn", "id": "cibilla-mothbourn", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Colter Montaine", "id": "colter-montaine", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Daeon Graeven Ardynet", "id": "daeon-graeven-ardynet", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "7zf2vg", "label": "Current Residence/Affiliation", "text": "Head of a hunters' lodge in Salenbrook"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Derren Hestre", "id": "derren-hestre", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "r60ggd", "label": "Species/Heritage", "text": "Ferran defector"}, {"id": "1u52zig", "label": "Current Residence/Affiliation", "text": "The Wardens"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Dovah Ikelos", "id": "dovah-ikelos", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Einor Kresanthe", "id": "einor-kresanthe", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Ferran", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Eldaenia Sarlei", "id": "eldaenia-sarlei", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Elise Veloce", "id": "elise-veloce", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Companion", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Fenthri \"Fen\"", "id": "fenthri-fen", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1e4fio3", "label": "Current Residence/Affiliation", "text": "The Wardens"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Frederic \"Fred\" Donner", "id": "frederic-fred-donner", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Jack Sycabel", "id": "jack-sycabel", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Kentucky Luger", "id": "kentucky-luger", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "6j3a4o", "label": "Age (year 847)", "text": "19"}, {"id": "1kx7zaz", "label": "Species/Heritage", "text": "Human — Stormcaller (Electric) bond."}, {"id": "hb2gus", "label": "Nation/Culture of Origin", "text": "Vaylena *(location of the Watts estate: open)*"}, {"id": "ii2i12", "label": "Current Residence/Affiliation", "text": "Vaylen Central Command"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Killian Watts", "id": "killian-watts", "names": [], "pc": true, "portrait": null, "sections": [{"dm": false, "heading": "Appearance", "id": "1shraoq", "items": [{"id": "1hbofro", "kind": "bullet", "sub": [], "text": "Tall at 5'11\", with an athletic, muscular build."}, {"id": "ffcy73", "kind": "bullet", "sub": [], "text": "Short white hair, likely natural, or possibly minorly stress-bleached from his use of his ability."}, {"id": "1v50rg2", "kind": "bullet", "sub": [], "text": "Blue eyes."}]}, {"dm": false, "heading": "Heritage & Bloodline", "id": "1k2n3le", "items": [{"id": "3n1zz0", "kind": "bullet", "sub": [], "text": "**Mother**: Millicent Watts, killed in the Night of Metal and Blood."}, {"id": "ogx7dp", "kind": "bullet", "sub": [], "text": "**Father**: Not known to him."}, {"id": "10gumav", "kind": "bullet", "sub": [], "text": "**Adoptive parents**: Reghen Nightlake and Livinna Watts (Millicent's sister), who head the Watts house."}, {"id": "1qr2tku", "kind": "bullet", "sub": [], "text": "**Elemental bond**: Stormcaller (Electric)."}, {"id": "1dubeix", "kind": "bullet", "sub": [], "text": "Cousin, by the Nightlake/Watts marriage, to **Tae'linna Graeven Nightlake**, with whom he grew up as if siblings."}]}, {"dm": false, "heading": "Background", "id": "oljxpo", "items": [{"id": "1xtemdy", "kind": "para", "sub": [], "text": "**Early life with Millicent**"}, {"id": "142gkrv", "kind": "bullet", "sub": [], "text": "He never knew his father, who left before Killian was even named."}, {"id": "1cshe0k", "kind": "para", "sub": [], "text": "**Orphaned and adopted**"}, {"id": "1xs2n71", "kind": "bullet", "sub": [], "text": "Orphaned after Millicent's death, he was adopted by Reghen and Livinna Watts out of kindness. He grew up at the Watts estate."}, {"id": "4yrl4n", "kind": "bullet", "sub": [], "text": "Most of the Watts family treat him as the black sheep, because of his father \"running off.\" He is not terribly close with them, so he spends a very large amount of time at the Nightlake Estate."}, {"id": "6wz4fp", "kind": "bullet", "sub": [], "text": "He is somewhat close with Sorel Nightlake, and mostly with Tae'linna, and with Soren while he was alive."}, {"id": "1c2o5nr", "kind": "bullet", "sub": [], "text": "Livinna made sure he had tutors to teach him to use his Stormcaller bond before he was enrolled in the military. One of his tutors was Reghen, who taught him martial arts, so he was already familiar with combat to some degree."}, {"id": "7apzqh", "kind": "para", "sub": [], "text": "**Boot camp**"}, {"id": "u95xry", "kind": "bullet", "sub": [], "text": "Killian volunteered for the military, roughly a year ago, at about 18 *(derived)*. Boot camp was the same as for other recruits. There he formed friendships with **Wynn Gunn** and **Vaxus**."}]}, {"dm": false, "heading": "Relationships", "id": "8rpg5r", "items": [{"id": "1v611ya", "kind": "bullet", "sub": [], "text": "**Millicent Watts (mother, deceased)**"}, {"id": "cuthbp", "kind": "bullet", "sub": [], "text": "**Reghen Nightlake (adoptive father)**: One of his tutors, who taught him martial arts. They are not particularly close."}, {"id": "1h9mkpz", "kind": "bullet", "sub": [], "text": "**Livinna Watts (adoptive mother, aunt)** She is warm to him and sees much of her sister in him."}, {"id": "1515xql", "kind": "bullet", "sub": [], "text": "**Tae'linna Graeven Nightlake**: Cousin, and the person he is mostly close with. They grew up as if siblings."}, {"id": "e62cyp", "kind": "bullet", "sub": [], "text": "**Sorel Nightlake**"}, {"id": "1jkpyg3", "kind": "bullet", "sub": [], "text": "**Soren Graeven Nightlake (deceased)**: Close while he was alive."}, {"id": "1o6i5ab", "kind": "bullet", "sub": [], "text": "**The rest of the Watts family**: They treat him as the black sheep. He is not close with them."}, {"id": "1ygf2np", "kind": "bullet", "sub": [], "text": "**Wynn Gunn and Vaxus**: Friends from boot camp."}]}, {"dm": false, "heading": "Skills & Abilities", "id": "1x7j7dh", "items": [{"id": "11lmdji", "kind": "bullet", "sub": [], "text": "**Class**: Monk"}, {"id": "14swt2c", "kind": "bullet", "sub": [], "text": "**Training**: Martial arts tutoring; Stormcaller bond tutoring arranged by Livinna; then standard boot-camp training."}, {"id": "15g9e8b", "kind": "bullet", "sub": [], "text": "**Bond**: Stormcaller (Electric)."}]}], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Koquet Thanatos", "id": "koquet-thanatos", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1ioir7g", "label": "Species/Heritage", "text": "Human"}, {"id": "1pflde7", "label": "Nation/Culture of Origin", "text": "Vaylena"}, {"id": "18s28xz", "label": "Current Residence/Affiliation", "text": "Central, Valyon"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Krystal Van Saun", "id": "krystal-van-saun", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "fpkgrp", "label": "Current Residence/Affiliation", "text": "Vaylen Central Command soldier"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Leo Kristoff", "id": "leo-kristoff", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Leslie Montaine", "id": "leslie-montaine", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1rnt5iu", "label": "Current Residence/Affiliation", "text": "Healer of the Clerist Corps at Fort Galthis"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Lillian Eigress", "id": "lillian-eigress", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Livinna Watts", "id": "livinna-watts", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Ferran", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Makaen Sarlei", "id": "makaen-sarlei", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Millicent Watts", "id": "millicent-watts", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": true, "culture": "Ancient", "dmOnly": false, "facts": [{"id": "1vlupzf", "label": "Aliases / Other Names Used", "text": "The Raven"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Morrigan Toreshk", "id": "morrigan-toreshk", "names": [{"id": "r4ohdw", "label": "Also known as", "value": "The Raven"}], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Skills & Abilities", "id": "8mpxg5", "items": [{"id": "182l06b", "kind": "bullet", "sub": [], "text": "Decades of covert political and shadow-operation expertise across Ferrena."}]}, {"dm": false, "heading": "Current Status", "id": "1rux8r6", "items": [{"id": "15ptbt9", "kind": "bullet", "sub": [], "text": "Operating within the Circle as The Raven, wielding immense hidden influence across Ferrena's seven Houses."}]}], "theme": "The Raven"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Nonna", "id": "nonna", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Queen Vanya Graeven", "id": "queen-vanya-graeven", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": true, "culture": "Ferran", "dmOnly": false, "facts": [{"id": "1rmqya0", "label": "Aliases / Other Names Used", "text": "**Reaver**"}, {"id": "hv0ad4", "label": "Species/Heritage", "text": "Ferran"}, {"id": "1e90obf", "label": "Nation/Culture of Origin", "text": "Ferrena"}, {"id": "ajj857", "label": "Current Residence/Affiliation", "text": "Ferrena"}], "fullBody": {"alt": "Reaver in her current attire", "h": 1227, "src": "img/2hw4v8-full.jpg", "w": 600}, "fullName": null, "gallery": [], "headline": "Reaver", "id": "reaver", "names": [], "pc": false, "portrait": {"alt": "Reaver, head and shoulders", "h": 600, "src": "img/2hw4v8-head.jpg", "w": 480}, "sections": [{"dm": false, "heading": "Appearance", "id": "1hlisgz", "items": []}], "theme": "Reaver"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Reghen Nightlake", "id": "reghen-nightlake", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Remmington \"Remy\" Gunn Montaine", "id": "remmington-remy-gunn-montaine", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Ferran", "dmOnly": false, "facts": [{"id": "18hhoou", "label": "Cognomen", "text": "Riven"}, {"id": "1qucunh", "label": "Age", "text": "22"}, {"id": "fu2f5e", "label": "Species/Heritage", "text": "Ferran"}, {"id": "cjfzp1", "label": "Nation/Culture of Origin", "text": "Ferrena"}, {"id": "17xqixx", "label": "Current Residence/Affiliation", "text": "Formerly embedded within the Coven"}], "fullBody": {"alt": "Riven, full body, twin blades drawn", "h": 1030, "src": "img/1lckubu-full.jpg", "w": 600}, "fullName": null, "gallery": [], "headline": "Riven", "id": "riven", "names": [], "pc": false, "portrait": {"alt": "Riven, head and shoulders", "h": 600, "src": "img/1lckubu-head.jpg", "w": 480}, "sections": [{"dm": false, "heading": "Heritage & Bloodline", "id": "iuor51", "items": []}, {"dm": false, "heading": "Background", "id": "1bqb4c3", "items": [{"id": "1xphmtn", "kind": "bullet", "sub": [], "text": "Was an accomplished member of the **Steel Watch** (the precursor organization to the Coven) at the time of House Tyran's subjugation."}, {"id": "gcw2pf", "kind": "bullet", "sub": [], "text": "Formed a Krasisbound pair with **Umbra**, her childhood friend and a fellow Ferran warrior."}, {"id": "1aiyuev", "kind": "bullet", "sub": [], "text": "Recently broke ties with the Coven alongside Umbra"}]}, {"dm": false, "heading": "Personality", "id": "13y72fl", "items": [{"id": "1dctnfu", "kind": "bullet", "sub": [], "text": "Resistant and defiant at her core, channeling her family's destruction into a decade(s)-long campaign of quiet insurgency rather than open despair or submission."}]}, {"dm": false, "heading": "Relationships", "id": "ahldia", "items": [{"id": "r5sy1n", "kind": "bullet", "sub": [], "text": "**Umbra**"}, {"id": "mwo079", "kind": "bullet", "sub": [], "text": "**The Raven**"}]}, {"dm": false, "heading": "Skills & Abilities", "id": "1iq4hzq", "items": [{"id": "16db7l1", "kind": "bullet", "sub": [], "text": "Accomplished Ferran warrior"}]}, {"dm": false, "heading": "Current Status", "id": "im0hch", "items": [{"id": "1l0ijx9", "kind": "bullet", "sub": [], "text": "Recently broke from the Coven alongside Umbra"}]}], "theme": "Shadowsong"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Sorel Nightlake", "id": "sorel-nightlake", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "jb0zu9", "label": "Current Residence/Affiliation", "text": "Apprentice of Blademaster Ashalia Sherridan"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Taelan Valdis", "id": "taelan-valdis", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1e2ki59", "label": "Nicknames", "text": "Lin,\nLinna,\nT,\nTay"}, {"id": "1nzcz0h", "label": "Age (current timeline)", "text": "21"}, {"id": "1bgluc4", "label": "Species/Heritage", "text": "Human — Tidewatcher"}, {"id": "13b6xqv", "label": "Nation/Culture of Origin", "text": "Vaylena"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Tae'linna Graeven Nightlake", "id": "taelinna-graeven-nightlake", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Appearance", "id": "1dkj70v", "items": [{"id": "m83wr1", "kind": "bullet", "sub": [], "text": "Bright green eyes. Slim build, approximately 5'6\". Shoulder-length light brunette hair that fades to blonde"}, {"id": "3x14kr", "kind": "bullet", "sub": [], "text": "Speaks with an Irish accent of varying intensity."}]}, {"dm": false, "heading": "Heritage & Bloodline", "id": "mc241f", "items": [{"id": "2al4kv", "kind": "bullet", "sub": [], "text": "Born a natural **Tidewatcher (Water)**"}]}, {"dm": false, "heading": "Background", "id": "xllnd9", "items": [{"id": "659zm7", "kind": "bullet", "sub": [], "text": "As a young girl, bright, outdoorsy, and gifted"}, {"id": "1xhpkfe", "kind": "bullet", "sub": [], "text": "Personally mentored across several disciplines by the very people who would go on to found modern Valyon's institutions: fencing under **Corey Tyran Veloce** and **Elise Veloce**, archery under **Krys Van Saun**, and her Tidewatcher bond under her aunt, **Chloe Graeven Ardynet** (who had become close friends with Tae'linna's mother, Tae'lor)."}, {"id": "scj65y", "kind": "bullet", "sub": [], "text": "**The Night of Metal and Blood** (roughly a month later): during a gathering of important figures at the Nightlake estate, Tae'linna heard the voices and wandered into the estate's gardens Soren was struck fatally by a stray piece of shrapnel in the chaos and died in Tae'linna's arms."}, {"id": "1nssxf2", "kind": "bullet", "sub": [], "text": "The trauma reshaped her personality: she became harsher, more reckless, quick to anger, and difficult to manage."}, {"id": "12d4ydr", "kind": "bullet", "sub": [], "text": "Channeled her anger into relentless training — archery, fencing, and arcane studies — entering University early and pursuing all three with near-zealous intensity, while her Tidewatcher bond, the one ability tied most directly to her trauma, went comparatively untrained."}, {"id": "123tw0h", "kind": "bullet", "sub": [], "text": "Became fixated on joining the war effort directly, seeking vengeance; those around her worked to keep her grounded in Central — first by age (below the war's 16-year draft threshold), then through University."}, {"id": "1wnyyw6", "kind": "bullet", "sub": [], "text": "Held a Central Command rank from age 16, though not on active duty at first — her time went to training and education on an officer path. Her shortcomings are an amalgamation of her temper, her record, and her neglected Tidewatcher training."}, {"id": "15xg7g4", "kind": "bullet", "sub": [], "text": "Struggled to get into the Crownsguard with a rough record Her friend **Tivoli Saunders**, whom she met at University, recommended her to **Colter Montaine**, who recruited her into **the Gunslingers**, a team then operating exclusively within Central. She proved too difficult even for the even-tempered Colter to manage."}, {"id": "7cnllz", "kind": "bullet", "sub": [], "text": "Joined the Crownsguard a little over a year after Tivoli, scouted by Daeon, its Captain (later refocused into the Crownseekers), who promised to keep her in line."}]}, {"dm": false, "heading": "Personality", "id": "1umxzmb", "items": [{"id": "2w0zhu", "kind": "bullet", "sub": [], "text": "Harsh, reckless, and quick to anger since her trauma — a stark contrast to the bright, gentle child she once was."}, {"id": "wrdsl3", "kind": "bullet", "sub": [], "text": "Fiercely dedicated to mastering every skill she still trusts (blade, bow, arcane study), as a kind of proof of control she can no longer find in her own bond, voice, or mind."}]}, {"dm": false, "heading": "Relationships", "id": "1pb9l54", "items": [{"id": "9zqms6", "kind": "bullet", "sub": [], "text": "**Soren Graeven Nightlake (deceased)** — older brother; died in her arms during the Night of Metal and Blood."}, {"id": "hmm8cw", "kind": "bullet", "sub": [], "text": "**Tae'lor Graeven (deceased)** — mother"}, {"id": "1su7wwm", "kind": "bullet", "sub": [], "text": "**Sorel Nightlake** — father."}, {"id": "c3rk47", "kind": "bullet", "sub": [], "text": "**Daeon Graeven Ardynet** — cousin, effectively a brother"}, {"id": "1km07oy", "kind": "bullet", "sub": [], "text": "**Chloe Graeven Ardynet (deceased)** — aunt and Tidewatcher mentor"}, {"id": "8hqt6w", "kind": "bullet", "sub": [], "text": "**Corey Tyran Veloce, Elise Veloce, Krys Van Saun** — childhood mentors in swordsmanship and archery."}, {"id": "a52vhj", "kind": "bullet", "sub": [], "text": "**Killian Watts** — close cousin (by the Nightlake/Watts marriage)"}, {"id": "1gjec4q", "kind": "bullet", "sub": [], "text": "**Colter Mon sened on the way. Donny gave Vaxus his jacket, already knowing his own condition was too far gone. He died of hypothermia on the way. Leo and Vaxus reached Galthis alone."}, {"id": "qb7cj4", "kind": "para", "sub": [], "text": "**Fort Galthis**"}, {"id": "bp6oor", "kind": "bullet", "sub": [], "text": "Leo gave him to the healers of the Clerist Corps. A healer named **Lillian Eigress** took charge of him. About a month passed in her care while he recovered his strength and his bearings."}, {"id": "1fj1vpd", "kind": "bullet", "sub": [], "text": "Over the next year Leo became his mentor, teaching him basic military regimen and trying to instill discipline. Vaxus asked Leo for stories from the front whenever he saw him."}, {"id": "6hy7zd", "kind": "para", "sub": [], "text": "**The capital**"}, {"id": "jzk94k", "kind": "bullet", "sub": [], "text": "After about a year, conditions on the front had shifted enough to send him back to the capital. Leo placed him in an orphanage, and then Leo was posted to the capital himself."}, {"id": "pu04xi", "kind": "bullet", "sub": [], "text": "Leo found him not fitting in at the orphanage, which was Church-funded and pushed Church teaching. He took Vaxus into his own care in the Central Command headquarters barracks, and used his spare time to train him as a soldier."}, {"id": "yakf6w", "kind": "bullet", "sub": [], "text": "Vaxus enlisted at 16 and went to boot camp."}, {"id": "xol88k", "kind": "bullet", "sub": [], "text": "Leo was the final instructor assigned to teach the new team to function together. Leo was killed months before the current timeline defending the party from a Ferran attacker, later identified as **Eldaenia Sarlei**."}]}, {"dm": false, "heading": "Relationships", "id": "1d4d9nk", "items": [{"id": "1bg42ev", "kind": "bullet", "sub": [], "text": "**Leo Kristoff (deceased)**: Rescuer, mentor and the nearest thing to a father."}, {"id": "178krmq", "kind": "bullet", "sub": [], "text": "**Alfred \"Donny\" Donner (deceased)**: Gave his life and his coat."}, {"id": "a39uu7", "kind": "bullet", "sub": [], "text": "**Lillian Eigress**: Clerist Corps healer who cared for him at Galthis."}, {"id": "1ritx9x", "kind": "bullet", "sub": [], "text": "**Thane Khavren**: Knight-Commander. First met at the tent in Galthis."}, {"id": "1p1r8g4", "kind": "bullet", "sub": [], "text": "**Anaria Sherridan**: First seen at Galthis."}, {"id": "1olo212", "kind": "bullet", "sub": [], "text": "**Fen**: Anaria's wolf companion; friendly to him at Galthis."}, {"id": "1my2nn2", "kind": "bullet", "sub": [], "text": "**Taelan Valdis**: Brief encounter."}, {"id": "i86acq", "kind": "bullet", "sub": [], "text": "**Volkira**: A Spirit tied to his Flame Bond"}, {"id": "d5ubb5", "kind": "bullet", "sub": [], "text": "**Killian Watts**: Team Member"}, {"id": "1r1oj6j", "kind": "bullet", "sub": [], "text": "**Wynn Chester Gunn**"}]}, {"dm": false, "heading": "Skills & Abilities", "id": "1cs09ig", "items": [{"id": "1p4kb6f", "kind": "bullet", "sub": [], "text": "Fire (Flameborn) bond."}, {"id": "j5uqod", "kind": "bullet", "sub": [], "text": "Basic soldier's training from Leo"}]}], "theme": "Parchment"}, {"circle": false, "culture": "Companion", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Volkira", "id": "volkira", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Walker Montaine", "id": "walker-montaine", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1ns3wr6", "label": "Age (year 847)", "text": "20"}, {"id": "1d5curh", "label": "Species/Heritage", "text": "Human — Windrider (Air) bond, from his mother"}, {"id": "9frgq6", "label": "Nation/Culture of Origin", "text": "Vaylena — the Crick, a forested-foothi /* Masking: in anything players receive, a name they haven't learned is swapped for the name they know.

    ${e.dmOnly?'':`<label class="chip">THEME <select data-act="theme" data-id="${e.id}" aria-label="Page theme">${THEMES.map(t=>`<option ${t===sh(e)?'selected':''}>${t}</option>`).join('')}</select></label>`}</div>`:''}
  <div class="rule"></div><div class="rule2"></div>
  ${e.facts.length?`<h2>◆ QUICK FACTS</h2><div class="card">${facts.length?facts.map(f=>{const sp=dm()?splitFact(f.text,f.label):{short:f.text,detail:''};return `<div class="fact ${dm()&&!R(f.id)?'dim':''}">${chk(f.id,f.label)}<span class="k">${esc(f.label).replace(/\//g,'/<wbr>')}</span><span class="v">${dm()&&editMode?editable(f.id,f.text,f.orig):md(sp.short)+warn(sp.short)+(dm()?detailRow(f.id,sp,null,f.label):'')}</span></div>`}).join(''):'<p class="empty" style="padding:8px 0">Nothing revealed yet.</p>'}</div>`:''}
  </div><div class="ent-b"><h2 class="deskonly">◆ ENTRY</h2>${(()=>{const fb=fullBodyBlock(e); const i=secs.findIndex(s=>/^appearance/i.test(s.heading)); return secs.map((s,k)=>section(e,s)+(k===i?fb:'')).join('')+(i<0?fb:'')})()}${mentionsBlock(e)}
  ${dm()?`<p class="note">Source: ${esc(e.doc)} · synced ${esc(META.builtAt)}</p>`:''}</div></div>`;
}
/* Mentioned in: every line elsewhere in the Codex that names this character (players only see lines they've been shown). */
function terms(e){
  const t=[e.headline, e.fullName, ...(e.headline.match(/"([^"]{3,})"/)||[]).slice(1), e.headline.replace(/\s*"[^"]*"\s*/,' ').trim()];
  if(dm()) e.names.forEach(n=>t.push(n.value.replace(/\s*[(“"].*$/,'').trim()));
  return [...new Set(t.filter(x=>x&&x.length>=3))];
}
function mentions(e){
  const ts=terms(e); if(!ts.length) return [];
  const re=new RegExp('\\b('+ts.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b');
  const out=[];
  for(const x of CUR.entries){ if(x.id===e.id||!entryVisible(x)) continue;
    for(const f of x.facts) if(re.test(f.text)) out.push({x,where:f.label,text:f.text,dmOnly:false,f});
    for(const s of x.sections) for(const i of s.items) if(re.test(i.text+' '+i.sub.join(' '))) out.push({x,where:s.heading,text:i.text,dmOnly:s.dm,s,i});
  }
  if(!dm()) return out;
  /* DM view: show each mention exactly as players would get it, or mark it hidden. */
  buildMask();
  const pubCopy={}; const P=x=>pubCopy[x.id]!==undefined?pubCopy[x.id]:(pubCopy[x.id]=project(x));
  const pre=new RegExp(re.source);
  for(const m of out){
    const p=P(m.x); let seen=null;
    if(p&&!m.dmOnly){
      if(m.f){ const pf=p.facts.find(q=>q.id===K(m.f.id)); if(pf) seen=pf.text }
      else { const ps=p.sections.find(q=>q.id===K(m.s.id)); const pi=ps&&ps.items.find(q=>q.id===K(m.i.id)); if(pi) seen=pi.text+' '+pi.sub.join(' ') }
    }
    m.players=seen&&pre.test(seen)?seen:null;
  }
  return out;
}
function mentionsBlock(e){
  const ms=mentions(e); if(!ms.length) return '';
  const cut=t=>{const p=t.replace(/\*\*/g,''); return p.length>170?p.slice(0,167)+'…':p};
  return `<div class="sec"><div class="sechead"><button class="toggle" data-act="open" data-id="${esc(e.id)}/mentions" aria-expanded="${!!open[e.id+'/mentions']}">MENTIONED IN<span><span class="count">${ms.length}</span>${open[e.id+'/mentions']?'−':'+'}</span></button></div>
  ${open[e.id+'/mentions']?ms.slice(0,40).map(m=>dm()?`<div class="item ${m.players?'':'dim'}"><div class="txt"><a href="#c-${m.x.id}"><strong>${esc(m.x.headline)}</strong></a> <span class="muted small">· ${esc(m.where)}</span> <span class="warn">${m.dmOnly?'DM notes · never shown':m.players?'players see this':'hidden from players'}</span><br>${md(cut(m.players||m.text))}</div></div>`:`<div class="item"><div class="txt"><a href="#c-${m.x.id}"><strong>${esc(m.x.headline)}</strong></a> <span class="muted small">· ${esc(m.where)}</span><br>${md(cut(m.text))}</div></div>`).join(''):''}
  ${dm()&&open[e.id+'/mentions']?`<p class="small muted">Players only see the mentions marked “players see this,” shown as they read them. ${ms.filter(m=>m.players).length} of ${ms.length} are visible to players.</p>`:''}</div>`;
}
function detailRow(id,sp,sub,label){
  const ps=pieces(id,sp,sub); if(!ps.length) return '';
  return `<div class="dets"><span class="cz detlab">DETAILS</span>${ps.map(p=>`<div class="det ${R(p.id)?'':'dim'}">${chk(p.id,label+' detail')}<div>${p.sub?'<span aria-hidden="true">– </span>':''}${md(p.text)}${warn(p.text)}</div></div>`).join('')}</div>`;
}
function section(e,s){
  const items=s.items.filter(i=>dm()||R(i.id));
  const isOpen=open[s.id]??false;
  const shown=s.items.filter(i=>R(i.id)).length;
  return `<div class="sec ${dm()&&!s.dm&&!R(s.id)?'dim':''}"><div class="sechead">${s.dm?lock():chk(s.id,s.heading+' section')}
   <button class="toggle" data-act="open" data-id="${esc(s.id)}" aria-expanded="${isOpen}">${esc(s.heading.toUpperCase())}<span><span class="count">${dm()&&!s.dm?`${shown}/${s.items.length}`:s.dm&&dm()?'DM notes':''}</span>${isOpen?'−':'+'}</span></button></div>
   ${isOpen?`${dm()&&!s.dm?`<div class="secbar"><button class="btn" data-act="all" data-id="${esc(s.id)}">REVEAL ALL</button><button class="btn" data-act="none" data-id="${esc(s.id)}">HIDE ALL</button></div>`:''}
   ${items.length?items.map(i=>`<div class="item ${i.kind==='subhead'?'sub':''} ${dm()&&!s.dm&&!R(i.id)?'dim':''}">${s.dm?'':chk(i.id,'this line')}${i.kind==='bullet'?'<span class="bul" aria-hidden="true">◆</span>':''}<div class="txt">${dm()&&editMode?editable(i.id,i.text,i.orig,i.added):dm()&&!s.dm?(()=>{const sp=splitItem(i.text,s.heading);return md(sp.short)+warn(sp.short)+detailRow(i.id,sp,i.sub,'line')})():md(i.text)+warn(i.text+' '+i.sub.join(' '))+(i.sub.length?`<ul>${i.sub.map(x=>`<li>${md(x)}</li>`).join('')}</ul>`:'')}</div></div>`).join(''):'<p class="empty" style="padding:8px 0">Nothing revealed yet.</p>'}${dm()&&editMode?`<p><button class="btn" data-act="add-line" data-id="${esc(s.id)}">+ ADD LINE</button></p>`:''}`:''}</div>`;
}
function viewSettings(){
  if(!canDM) return `${top('#home')}<p class="empty">Settings are for the DM.</p>`;
  const ch=META?META.changes:[];
  return `${top('#home')}<div class="cz small muted" style="margin-top:18px">${LOCK} DM ONLY</div><h1>DM Settings</h1><div class="rule"></div><div class="rule2"></div>
  <h2>◆ VIEWING AS</h2><div class="seg"><button data-act="mode" data-id="dm" aria-pressed="${mode==='dm'}">DUNGEON MASTER</button><button data-act="mode" data-id="player" aria-pressed="${mode==='player'}">PLAYER</button></div>
  <p class="muted small">${mode==='dm'?'Everything shows. Unrevealed items are dimmed; tap a checkbox to reveal it.':'You see exactly what players see. Switch back to reveal more.'}</p>
  <h2>◆ CHANGES TO REVIEW</h2>${ch.length?ch.map(c=>`<div class="item">${c.type==='removed'?'<span class="lock"></span>':chk(c.id,c.where)}<div class="txt"><span class="badge">${c.type.toUpperCase()}</span> ${esc(c.where)}</div></div>`).join(''):`<p class="muted">No changes since the last sync. New lore arrives hidden; revealed lore always shows its latest version.</p>`}
  <h2>◆ PAGE THEMES</h2>${(LORE||[]).filter(e=>!e.dmOnly&&sh(e)!=='Parchment').map(e=>`<div class="row"><a class="name" href="#c-${e.id}"><b>${esc(e.headline)}</b></a><span class="muted">${sh(e)}</span></div>`).join('')||'<p class="muted">Every page uses Parchment.</p>'}
  <p class="muted small">Change a page's theme from its own DM toolbar.</p>
  <h2>◆ SYNC</h2><p class="small">Last synced ${esc(META?META.builtAt:'never')}. To pull in edited lore, ask Claude in the Shattered Realms project to “sync the Codex.”</p>
  <h2>◆ PLAYER EDITION</h2><p class="small">A standalone page of everything you've revealed, for players without a Claude account. It holds only revealed lore, with revealed portraits built in. Share the file in Discord or a group chat, or host it on a link. Export again after each session to update it.</p>
  <p><button class="btn solid" data-act="export">⇩ EXPORT PLAYER EDITION</button></p>
  <h2>◆ WHAT PLAYERS RECEIVE</h2><p class="small">The full lore is stored where only you can read it. Players are sent a copy of the pieces you’ve checked, and nothing else, updated each time you reveal or hide something.</p>`;
}

function render(){
  setView();
  const ready=canDM?!!LORE:!!PUB;
  if(!ready){ app.className='t-parchment'; app.innerHTML=`<div class="wrap"><p class="empty">${esc(loadErr||status)}</p></div>`; return }
  hiddenNames();
  const h=location.hash.slice(1)||'home';
  let html, th='Parchment';
  if(h==='characters') html=viewList();
  else if(h==='houses') html=viewHouses();
  else if(h==='dm-settings') html=viewSettings();
  else if(h.startsWith('c-')){ const x=h.slice(2); const e=byId[x]||CUR.entries.find(q=>pubId(q)===x)||(LX&&canDM?(()=>{const r=LX.find(q=>pubId(q)===x||q.id===x); return r&&byId[r.id]?byId[r.id]:(r&&byId[pubId(r)])})():null); html=viewEntry(e); if(e&&entryVisible(e)) th=sh(e) }
  else html=viewHome();
  app.className='t-'+th.toLowerCase().replace(/\s+/g,'-');
  document.body.style.background=getComputedStyle(app).getPropertyValue('--bg');
  const y=scrollY, f=document.activeElement&&document.activeElement.id, draft=document.getElementById('ed');
  const dv=draft&&draft.value;
  const curId=h.startsWith('c-')?h.slice(2):null;
  const onHouse=h==='houses'||(curId&&byId[curId]&&isHouse(byId[curId]));
  app.innerHTML=wide()?`<div class="desk"><aside class="side">${sidebar(curId,onHouse)}</aside><main class="wrap">${html}</main></div>`:`<div class="wrap">${html}</div>`;
  scrollTo(0,y);
  const ed=document.getElementById('ed'); if(ed&&dv!=null){ ed.value=dv; if(f==='ed') ed.focus() }
  if(f==='sq'){const i=document.getElementById('sq'); i.focus(); i.setSelectionRange(i.value.length,i.value.length)}
  if(f==='q'){const i=document.getElementById('q'); i.focus(); i.setSelectionRange(i.value.length,i.value.length)}
}

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
const PUB_V=15;
let chain=Promise.resolve();
const queue=fn=>{chain=chain.then(fn).catch(()=>toast('Couldn’t save that change. Check your connection and try again.')); return chain};
async function save(){
  if(!db) return; if(saving){pending=true;return} saving=true;
  try{ await db.doc('reveal/state').set({ids:[...rev]}) }catch(err){ toast('Couldn’t save that change. Try again.') }
  saving=false; if(pending){pending=false; save()}
}
/* Player Edition: this same page, with the player copy baked in and no Claude connection. */
async function exportPlayer(btn){
  const dl=await claude.use('downloads');
  if(!dl){ toast('Exporting isn’t available in this view.'); return }
  btn.disabled=true; btn.textContent='BUILDING…';
  try{
    buildMask(); const entries=JSON.parse(JSON.stringify((LX||[]).map(project).filter(Boolean)));
    for(const e of entries) for(const im of [e.portrait,e.fullBody,...(e.gallery||[])].filter(Boolean)){
      const blob=await (await fetch(im.src)).blob();
      im.src=await new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(blob)});
    }
    const stamp=new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
    const page=await (await fetch('./index.html')).text();
    const data=JSON.stringify({entries,exportedAt:stamp}).replace(/</g,'\\u003c');
    const i=page.indexOf('<script>');
    const out=page.slice(0,i)+`<script>window.CODEX_STATIC=${data}<\/script>\n`+page.slice(i);
    await dl.save({filename:'vaelena-codex-players.html',data:out});
    toast(`Exported ${entries.length} revealed ${entries.length===1?'entry':'entries'}`);
  }catch(err){ toast('The export didn’t finish. Try again.') }
  btn.disabled=false; btn.textContent='⇩ EXPORT PLAYER EDITION';
}
function saveEdits(){ if(!db) return; const snap=JSON.parse(JSON.stringify(EDITS)); queue(()=>db.doc('edits/main').set(snap)) }
async function saveSettings(){ if(!db) return; try{ await db.doc('settings/main').set({themes,pins}) }catch(err){ toast('Couldn’t save settings.') } }
let dirty=new Set(), pubTimer=null;
function publish(ids){ ids.forEach(i=>dirty.add(i)); clearTimeout(pubTimer); pubTimer=setTimeout(flushPub,700) }
function flushPub(){
  if(!db||!LORE) return; const ids=[...dirty]; dirty.clear();
  queue(async()=>{
    for(const id of ids){ buildMask(); const e=(LX||[]).find(x=>x.id===id); if(!e) continue; const p=project(e);
      const pid=pubId(e); if(pid!==id) await db.doc('pub/'+id).delete(); if(p) await db.doc('pub/'+pid).set(JSON.parse(JSON.stringify(p))); else await db.doc('pub/'+pid).delete(); }
    await db.doc('pub-meta/index').set({builtAt:META.builtAt,v:PUB_V});
  });
}
const entryOf=id=>id.split('/')[0];
function setRev(ids,on){ ids.forEach(id=>on?rev.add(id):rev.delete(id)); render(); save(); publish(ids.some(i=>i.includes('/name/'))?(LX||[]).map(e=>e.id):[...new Set(ids.map(entryOf))]) }

app.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]'); if(!b||b.tagName==='SELECT') return;
  const {act,id}=b.dataset;
  if(act==='toggle') setRev([id],!R(id));
  else if(act==='export'){ exportPlayer(b) }
  else if(act==='editmode'){ editMode=!editMode; editing=null; render() }
  else if(act==='edit'){ editing=id; render(); const t=document.getElementById('ed'); if(t){t.focus(); t.setSelectionRange(t.value.length,t.value.length)} }
  else if(act==='cancel-edit'){ editing=null; render() }
  else if(act==='save-edit'){ const v=document.getElementById('ed').value.trim(); const T=EDITS.text||(EDITS.text={});
    const addedSec=Object.keys(EDITS.added||{}).find(k=>EDITS.added[k].some(a=>a.id===id));
    if(addedSec){ if(!v){ EDITS.added[addedSec]=EDITS.added[addedSec].filter(a=>a.id!==id); delete T[id] } else T[id]={t:v,base:''} }
    else { const o=origOf(id); if(!v||v===o) delete T[id]; else T[id]={t:v,base:o} }
    editing=null; render(); saveEdits(); publish([entryOf(id)]) }
  else if(act==='revert'){ delete (EDITS.text||{})[id]; editing=null; render(); saveEdits(); publish([entryOf(id)]) }
  else if(act==='add-line'){ const nid=id+'/x-'+Date.now().toString(36); (EDITS.added||(EDITS.added={}))[id]=[...(EDITS.added[id]||[]),{id:nid,text:''}]; open[id]=true; editing=nid; render(); saveEdits(); const t=document.getElementById('ed'); if(t) t.focus() }
  else if(act==='del-line'){ for(const k of Object.keys(EDITS.added||{})) EDITS.added[k]=EDITS.added[k].filter(a=>a.id!==id); delete (EDITS.text||{})[id]; editing=null; render(); saveEdits(); publish([entryOf(id)]) }
  else if(act==='group'){ closedGroups=closedGroups.includes(id)?closedGroups.filter(x=>x!==id):[...closedGroups,id]; try{localStorage.setItem('codex-closed',JSON.stringify(closedGroups))}catch(e){} render() }
  else if(act==='open'){ open[id]=!(open[id]??false); render() }
  else if(act==='all'||act==='none'){ const s=LX.flatMap(e=>e.sections).find(x=>x.id===id); setRev([s.id,...s.items.flatMap(i=>[i.id,...detailIds(i.id,splitItem(i.text,s.heading),i.sub)])],act==='all') }
  else if(act==='mode'){ mode=id; try{localStorage.setItem('codex-mode',mode)}catch(e){} render() }
  else if(act==='pin'){ pins=pins.includes(id)?pins.filter(x=>x!==id):[...pins,id]; render(); saveSettings() }
});
app.addEventListener('change',ev=>{ const s=ev.target.closest('select[data-act=theme]'); if(s){ themes[s.dataset.id]=s.value; render(); saveSettings(); publish([s.dataset.id]) } });
app.addEventListener('input',ev=>{ if(ev.target.id==='q'){ q=ev.target.value; render() } else if(ev.target.id==='sq'){ sq=ev.target.value; render() } });
matchMedia('(min-width:1000px)').addEventListener('change',()=>render());
addEventListener('hashchange',()=>{ scrollTo(0,0); render(); scrollTo(0,0) });

async function importSeed(){
  let seed=null;
  try{ const r=await fetch('./seed.json'); if(r.ok) seed=await r.json() }catch(e){}
  if(!seed) return false;
  if(META&&META.builtAt>=seed.builtAt) return false;
  status='Importing your lore into protected storage…'; render();
  for(const e of seed.entries) await db.doc('lore/'+e.id).set(e);
  const keep=new Set(seed.entries.map(e=>e.id));
  if(LORE) for(const e of LORE) if(!keep.has(e.id)) await db.doc('lore/'+e.id).delete();
  META={builtAt:seed.builtAt,changes:seed.changes,defaultThemes:seed.defaultThemes};
  await db.doc('lore-meta/index').set(META);
  toast(`Imported ${seed.entries.length} entries`);
  return true;
}
function startDM(){
  const timer=setTimeout(()=>{ if(!LORE){ status='Still loading your lore… If this persists, reload the page.'; render() } },10000);
  let pubMeta=null, gotPub=false, refreshed=false;
  const maybeRefresh=()=>{ if(refreshed||!LORE||!META||!gotPub) return; if(!pubMeta||pubMeta.builtAt!==META.builtAt||pubMeta.v!==PUB_V){ refreshed=true; publish(LORE.map(e=>e.id)) } };
  db.doc('pub-meta/index').onSnapshot(s=>{ if(s.metadata&&s.metadata.fromCache) return; pubMeta=s.exists?s.data():null; gotPub=true; maybeRefresh() });
  db.doc('lore-meta/index').get().then(async s=>{
    META=s.exists?s.data():null;
    try{ await importSeed() }catch(err){ toast('The import didn’t finish. Reload to try again.') }
    if(!META){ clearTimeout(timer); loadErr='No lore has been synced yet. Ask Claude in the Shattered Realms project to “sync the Codex.”'; render(); return }
    db.collection('lore').onSnapshot(qs=>{ clearTimeout(timer); LORE=qs.docs.map(d=>d.data()); if(!Object.keys(open).length) LORE.forEach(e=>{ if(e.sections[0]) open[e.sections[0].id]=true }); render(); maybeRefresh() },
      ()=>{ clearTimeout(timer); loadErr='Your lore couldn’t be loaded. Reload to try again.'; render() });
    db.doc('lore-meta/index').onSnapshot(s=>{ if(s.exists){ META=s.data(); render(); maybeRefresh() } });
  });
  db.doc('reveal/state').onSnapshot(s=>{ const v=s.exists?s.data():null; if(v&&Array.isArray(v.ids)&&!saving&&!pending) rev=new Set(v.ids); render() });
  db.doc('edits/main').onSnapshot(s=>{ if(editing) return; const v=s.exists?s.data():null; EDITS=v?JSON.parse(JSON.stringify(v)):{text:{},added:{}}; if(!EDITS.text) EDITS.text={}; if(!EDITS.added) EDITS.added={}; render() });
  db.doc('settings/main').onSnapshot(s=>{ const v=s.exists?s.data():null; if(v){ themes={...(v.themes||{})}; pins=[...(v.pins||[])] } render() });
}
function startPlayer(){
  const timer=setTimeout(()=>{ if(!PUB){ status='Still opening the Codex… If this persists, reload the page.'; render() } },10000);
  db.collection('pub').onSnapshot(qs=>{ clearTimeout(timer); PUB=qs.docs.map(d=>d.data()); render() },
    ()=>{ clearTimeout(timer); loadErr='The Codex couldn’t be loaded. Reload to try again.'; render() });
}
(async()=>{
  if(window.CODEX_STATIC){ canDM=false; mode='player'; PUB=window.CODEX_STATIC.entries; render(); return }
  const user=await claude.use('user');
  canDM=!!user&&(!!(await user.canEdit())||!!(await user.isOwner()));
  if(!canDM) mode='player';
  db=await claude.use('db');
  if(!db){ loadErr='The Codex needs you to be signed in to claude.ai to open.'; render(); return }
  if(canDM) startDM(); else startPlayer();
})();
}
