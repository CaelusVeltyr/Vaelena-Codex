 null, "sections": [{"dm": false, "heading": "Overview", "id": "nbyinh", "items": [{"id": "1id6ylk", "kind": "bullet", "sub": [], "text": "The common name for those bonded to Earth."}]}, {"dm": false, "heading": "Known Bearers", "id": "s8w8x2", "items": [{"id": "1dldpcf", "kind": "bullet", "sub": [], "text": "**Kenton Sellis** — spear user of Team Everbright."}, {"id": "13vi6sf", "kind": "bullet", "sub": [], "text": "**Tivoli Saunders**"}, {"id": "11cycli", "kind": "bullet", "sub": [], "text": "**Treanna Saunders**"}]}], "theme": "Stonebreaker"}, {"circle": false, "culture": "Elemental", "dmOnly": false, "facts": [{"id": "2mi75s", "label": "Element", "text": "Electricity"}, {"id": "11xk0", "label": "Primarch", "text": "Loval"}, {"id": "df6w91", "label": "Season", "text": "The passage of seasons"}, {"id": "12d7lmb", "label": "Church Ministry", "text": "The Ministry of Invigoration"}], "fullBody": null, "fullName": null, "gallery": [], "group": "The Five Lineages", "headline": "Stormcallers", "houseGroup": null, "id": "stormcallers", "kind": "system", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "19lbele", "items": [{"id": "kyc54z", "kind": "bullet", "sub": [], "text": "The common name for those bonded to Electricity."}, {"id": "1ukecj5", "kind": "bullet", "sub": [], "text": "Lo'vallenar is uniquely tied to seasonal transition rather than a fixed season: electricity as a force of change rather than a state of being."}]}, {"dm": false, "heading": "Known Bearers", "id": "4ih3f7", "items": [{"id": "1ualo7u", "kind": "bullet", "sub": [], "text": "**Thane Khavren**"}, {"id": "mcg3ok", "kind": "bullet", "sub": [], "text": "**Theo Khavren**"}, {"id": "c2fnsk", "kind": "bullet", "sub": [], "text": "**Killian Watts**"}]}], "theme": "Stormcaller"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "jb0zu9", "label": "Current Residence/Affiliation", "text": "Apprentice of Blademaster Ashalia Sherridan"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Taelan Valdis", "id": "taelan-valdis", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Shadowsong"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1e2ki59", "label": "Nicknames", "text": "Lin,\nLinna,\nT,\nTay"}, {"id": "1nzcz0h", "label": "Age (current timeline)", "text": "21"}, {"id": "1bgluc4", "label": "Species/Heritage", "text": "Human — Tidewatcher"}, {"id": "13b6xqv", "label": "Nation/Culture of Origin", "text": "Vaylena"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Tae'linna Graeven Nightlake", "id": "taelinna-graeven-nightlake", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Appearance", "id": "1dkj70v", "items": [{"id": "m83wr1", "kind": "bullet", "sub": [], "text": "Bright green eyes. Slim build, approximately 5'6\". Shoulder-length light brunette hair that fades to blonde"}, {"id": "3x14kr", "kind": "bullet", "sub": [], "text": "Speaks with an Irish accent of varying intensity."}]}, {"dm": false, "heading": "Heritage & Bloodline", "id": "mc241f", "items": [{"id": "2al4kv", "kind": "bullet", "sub": [], "text": "Born a natural **Tidewatcher (Water)**"}]}, {"dm": false, "heading": "Background", "id": "xllnd9", "items": [{"id": "659zm7", "kind": "bullet", "sub": [], "text": "As a young girl, bright, outdoorsy, and gifted"}, {"id": "1xhpkfe", "kind": "bullet", "sub": [], "text": "Personally mentored across several disciplines by the very people who would go on to found modern Valyon's institutions: fencing under **Corey Tyran Veloce** and **Elise Veloce**, archery under **Krys Van Saun**, and her Tidewatcher bond under her aunt, **Chloe Graeven Ardynet** (who had become close friends with Tae'linna's mother, Tae'lor)."}, {"id": "scj65y", "kind": "bullet", "sub": [], "text": "**The Night of Metal and Blood** (roughly a month later): during a gathering of important figures at the Nightlake estate, Tae'linna heard the voices and wandered into the estate's gardens Soren was struck fatally by a stray piece of shrapnel in the chaos and died in Tae'linna's arms."}, {"id": "1nssxf2", "kind": "bullet", "sub": [], "text": "The trauma reshaped her personality: she became harsher, more reckless, quick to anger, and difficult to manage."}, {"id": "12d4ydr", "kind": "bullet", "sub": [], "text": "Channeled her anger into relentless training — archery, fencing, and arcane studies — entering University early and pursuing all three with near-zealous intensity, while her Tidewatcher bond, the one ability tied most directly to her trauma, went comparatively untrained."}, {"id": "123tw0h", "kind": "bullet", "sub": [], "text": "Became fixated on joining the war effort directly, seeking vengeance; those around her worked to keep her grounded in Central — first by age (below the war's 16-year draft threshold), then through University."}, {"id": "1wnyyw6", "kind": "bullet", "sub": [], "text": "Held a Central Command rank from age 16, though not on active duty at first — her time went to training and education on an officer path. Her shortcomings are an amalgamation of her temper, her record, and her neglected Tidewatcher training."}, {"id": "15xg7g4", "kind": "bullet", "sub": [], "text": "Struggled to get into the Crownsguard with a rough record Her friend **Tivoli Saunders**, whom she met at University, recommended her to **Colter Montaine**, who recruited her into **the Gunslingers**, a team then operating exclusively within Central. She proved too difficult even for the even-tempered Colter to manage."}, {"id": "7cnllz", "kind": "bullet", "sub": [], "text": "Joined the Crownsguard a little over a year after Tivoli, scouted by Daeon, its Captain (later refocused into the Crownseekers), who promised to keep her in line."}]}, {"dm": false, "heading": "Personality", "id": "1umxzmb", "items": [{"id": "2w0zhu", "kind": "bullet", "sub": [], "text": "Harsh, reckless, and quick to anger since her trauma — a stark contrast to the bright, gentle child she once was."}, {"id": "wrdsl3", "kind": "bullet", "sub": [], "text": "Fiercely dedicated to mastering every skill she still trusts (blade, bow, arcane study), as a kind of proof of control she can no longer find in her own bond, voice, or mind."}]}, {"dm": false, "heading": "Relationships", "id": "1pb9l54", "items": [{"id": "9zqms6", "kind": "bullet", "sub": [], "text": "**Soren Graeven Nightlake (deceased)** — older brother; died in her arms during the Night of Metal and Blood."}, {"id": "hmm8cw", "kind": "bullet", "sub": [], "text": "**Tae'lor Graeven (deceased)** — mother"}, {"id": "1su7wwm", "kind": "bullet", "sub": [], "text": "**Sorel Nightlake** — father."}, {"id": "c3rk47", "kind": "bullet", "sub": [], "text": "**Daeon Graeven Ardynet** — cousin, effectively a brother"}, {"id": "1km07oy", "kind": "bullet", "sub": [], "text": "**Chloe Graeven Ardynet (deceased)** — aunt and Tidewatcher mentor"}, {"id": "8hqt6w", "kind": "bullet", "sub": [], "text": "**Corey Tyran Veloce, Elise Veloce, Krys Van Saun** — childhood mentors in swordsmanship and archery."}, {"id": "a52vhj", "kind": "bullet", "sub": [], "text": "**Killian Watts** — close cousin (by the Nightlake/Watts marriage)"}, {"id": "1gjec4q", "kind": "bullet", "sub": [], "text": "**Colter Montaine** — former team leader (the Gunslingers)"}, {"id": "1n1ofu2", "kind": "bullet", "sub": [], "text": "**Tivoli Saunders** — best friend"}, {"id": "1qidqbx", "kind": "bullet", "sub": [], "text": "**Thane Khavren** — Knight-Commander"}]}, {"dm": false, "heading": "Skills & Abilities", "id": "lyl0cw", "items": [{"id": "1e7k8vh", "kind": "bullet", "sub": [], "text": "Skilled swordswoman (fencing) and archer."}, {"id": "1f4e8gr", "kind": "bullet", "sub": [], "text": "Arcane studies"}, {"id": "rbwilp", "kind": "bullet", "sub": [], "text": "Natural Tidewatcher (Water) bond"}]}], "theme": "Tidewatcher"}, {"circle": true, "culture": "Ancient", "dmOnly": false, "facts": [{"id": "13r7yma", "label": "Aliases / Other Names Used", "text": "The Lightbringer (Circle moniker)"}, {"id": "geq2e5", "label": "Current Residence/Affiliation", "text": "Formal founder and guiding hand of the Circle"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Tal'auren Aetor", "id": "talauren-aetor", "names": [{"id": "1rs40y3", "label": "Also known as", "value": "The Lightbringer"}], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Relationships", "id": "fok3l6", "items": [{"id": "13iplns", "kind": "bullet", "sub": [], "text": "**Morrigan Toreshk (The Raven)**"}]}, {"dm": false, "heading": "Current Status", "id": "1dihm5l", "items": [{"id": "3i9xal", "kind": "bullet", "sub": [], "text": "Formal founder and guiding hand of the Circle"}]}], "theme": "Eclipse"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "dhe58u", "label": "Age (current timeline, year 847)", "text": "Early 50s"}, {"id": "1oau69x", "label": "Species/Heritage", "text": "Human — Stormcaller (Electricity) bond"}, {"id": "6vftl2", "label": "Nation/Culture of Origin", "text": "Vaylena — Westallum district"}, {"id": "o2uu68", "label": "Current Residence/Affiliation", "text": "Central, Valyon — Knight-Commander of Vaylen Central Command"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Thane Khavren", "id": "thane-khavren", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Heritage & Bloodline", "id": "1jaf6i8", "items": [{"id": "1g4nx2s", "kind": "bullet", "sub": [], "text": "**Elemental bond**: Stormcaller (Electricity) — already bonded and trained by the time he enrolled at Central University."}]}, {"dm": false, "heading": "Background", "id": "yl97ke", "items": [{"id": "tix4z6", "kind": "bullet", "sub": [], "text": "Worked on a farm in Westallum in his younger years. Present at a bar in Westallum the night Chloe played a heartfelt acoustic set following her separation from Corey and Toran's death."}, {"id": "jdqsuv", "kind": "bullet", "sub": [], "text": "Found Chloe stranded roadside in the rain after the set, having run out of gas; took her in and brought her back to his home. The quiet drive — rain on the windshield, her grieving, drunken sobs — remained a permanent memory for him."}, {"id": "10o9079", "kind": "bullet", "sub": [], "text": "Took on an older-brother role in Chloe's life, helping her find stability, including securing her a job on the farm where he worked."}, {"id": "ffsk1v", "kind": "bullet", "sub": [], "text": "Alongside Chloe, sought out her uncle Ardynet Graeven as a path into Central, aided by a chance friendship with Walker and Leslie Montaine."}, {"id": "1fcmkam", "kind": "bullet", "sub": [], "text": "Enrolled at Central University for the Gifted alongside Chloe, the Montaine twins, and Glenn Holbrook, forming **Team Montaine** under Walker's leadership, wielding a greataxe."}, {"id": "agqv7g", "kind": "bullet", "sub": [], "text": "Grew close to Krys Van Saun after Team Montaine and Team Veloce began competing against each other in their second year; recognized in her a similar quiet hurt to what he'd once seen in Chloe, and a romance began forming between them."}, {"id": "jggmbe", "kind": "bullet", "sub": [], "text": "**The High Water confrontation**: During the 24th Division's second-year expedition, Thane privately confronted Corey over his continued emotional distance from Chloe, unhappy watching her carry unrequited feelings. The confrontation escalated into a fight; mid-fight, a structural collapse began, and Corey shoved Thane clear, taking the full brunt of the collapse himself and shattering his arm. Thane noticed Corey's lie to instructor Forge covering for what had actually happened, but didn't challenge it — carrying quiet guilt over the incident."}, {"id": "1w0dylt", "kind": "bullet", "sub": [], "text": "Regularly visited Corey during his year of recovery, alongside Chloe; the three grew into a tight, genuinely brotherly trio of friends."}, {"id": "1f91pqy", "kind": "bullet", "sub": [], "text": "Married Krys Van Saun; the two had four children together: Calyx, Theo, Zephyrus, and Amerys."}, {"id": "tnu7mq", "kind": "bullet", "sub": [], "text": "**The Frostlake Expedition**: Remained behind on leave during the fateful expedition 9 years before the current timeline, as Krys was pregnant with Amerys at the time — a circumstance that meant neither he nor Krys were present for the massacre that claimed Chloe and the rest of the expedition, and which set Corey on his path to disappearance."}, {"id": "1rntsu1", "kind": "bullet", "sub": [], "text": "**Ascension to Knight-Commander**: Succeeded Corey as Knight-Commander of Vaylen Central Command, a transition directly related to the true events surrounding Corey's departure and disappearance (full detail pending further development)."}, {"id": "60pboe", "kind": "bullet", "sub": [], "text": "As Knight-Commander he heads the Crownsguard, and the Crownseekers it became; the Crownseekers still serve under him, as does any unit he formally commissions. The Dawnwarden is a unique exception."}, {"id": "lqdcza", "kind": "bullet", "sub": [], "text": "Struck a munitions deal with Remy Montaine that formally folded Colter Montaine's Gunslingers into Central Command."}, {"id": "12mt78h", "kind": "bullet", "sub": [], "text": "About five years ago, was in the Central Command tent at Fort Galthis when the question of what to do with a young Vaxus came before him — their first meeting — and when Anaria Sherridan walked in alive."}]}, {"dm": false, "heading": "Personality", "id": "1hny21y", "items": [{"id": "qns106", "kind": "bullet", "sub": [], "text": "Steady, protective, and instinctively kind — the kind of person who stops to help a stranger in the rain without hesitation."}, {"id": "1iua8uf", "kind": "bullet", "sub": [], "text": "Willing to confront friends honestly when he sees them hurting others, even at real personal risk, as shown in his confrontation with Corey."}, {"id": "196643h", "kind": "bullet", "sub": [], "text": "Carries guilt well but doesn't let it curdle into resentment — rebuilt a genuine brotherhood with Corey despite the confrontation that led to his injury."}]}, {"dm": false, "heading": "Relationships", "id": "zhx2bp", "items": [{"id": "egkpph", "kind": "bullet", "sub": [], "text": "**Krys Van Saun** — wife; grew close during their University years, eventually married with four children."}, {"id": "1njnt9t", "kind": "bullet", "sub": [], "text": "**Chloe Graeven Ardynet (deceased)** — found her at her lowest point and became a lifelong close friend, effectively an older brother to her."}, {"id": "qnzb3u", "kind": "bullet", "sub": [], "text": "**Corey Tyran Veloce** — one of his closest friends, regarded as a brother, despite (and partly because of) the confrontation between them that led to Corey's injury. Succeeded him as Knight-Commander."}, {"id": "1nl4zjj", "kind": "bullet", "sub": [], "text": "**Calyx, Theo, Zephyrus, and Amerys** — his four children with Krys."}, {"id": "dhk6gj", "kind": "bullet", "sub": [], "text": "**Walker and Leslie Montaine, Glenn Holbrook** — former Team Montaine members; Walker and Leslie killed in the Frostlake massacre."}]}, {"dm": false, "heading": "Skills & Abilities", "id": "28i2vj", "items": [{"id": "1iz63c3", "kind": "bullet", "sub": [], "text": "Stormcaller (Electricity) bond; wields a greataxe in combat."}, {"id": "1cq3iv0", "kind": "bullet", "sub": [], "text": "Military/tactical leadership, having risen to Knight-Commander of Vaylen Central Command."}]}, {"dm": false, "heading": "Current Status", "id": "1pc45iw", "items": [{"id": "k9zcn", "kind": "bullet", "sub": [], "text": "Serving as Knight-Commander of Vaylen Central Command, having held the position since Corey vacated it roughly 9 years ago."}, {"id": "4po06l", "kind": "bullet", "sub": [], "text": "Married to Krys Van Saun"}]}], "theme": "Stormcaller"}, {"at": {"map": "world", "x": 1597, "y": 1174}, "circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "group": "Cities & Towns", "headline": "The Ardohne Interchange", "houseGroup": null, "id": "the-ardohne-interchange", "kind": "place", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"at": {"map": "world", "x": 1966, "y": 1303}, "circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "group": "Wilds & Regions", "headline": "The Bramblewood", "houseGroup": null, "id": "the-bramblewood", "kind": "place", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"at": {"map": "central", "x": 1258, "y": 1351}, "circle": false, "culture": "Valyon", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "group": "Landmarks of Central", "headline": "The Central Rail Yard", "houseGroup": null, "id": "the-central-rail-yard", "kind": "place", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"at": {"map": "central", "x": 1481, "y": 1375}, "circle": false, "culture": "Valyon", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "group": "Landmarks of Central", "headline": "The Central Spire", "houseGroup": null, "id": "the-central-spire", "kind": "place", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": true, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1htb16m", "label": "Current Residence/Affiliation", "text": "Core member of the Circle"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "The Champion", "id": "the-champion", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "11n85v7", "items": [{"id": "1hg2r91", "kind": "bullet", "sub": [], "text": "One of the Circle's core members, named alongside the Raven and the Lightbringer."}, {"id": "xc6qes", "kind": "bullet", "sub": [], "text": "Always seen hooded. Outside the Circle, no one knows the Champion's face or name."}, {"id": "1uctcf0", "kind": "bullet", "sub": [], "text": "Said to carry the power of an ancient crown."}]}], "theme": "Eclipse"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1qemjap", "label": "Type", "text": "Religion"}, {"id": "heluvu", "label": "Structure", "text": "Seven Ministries"}, {"id": "x9s6jg", "label": "Scripture", "text": "The Tome of the Mother's Radiance"}], "fullBody": null, "fullName": null, "gallery": [], "group": "Institutions & Faith", "headline": "The Church of the Mother", "houseGroup": null, "id": "the-church-of-the-mother", "kind": "faction", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "hn7mcl", "items": [{"id": "13kp67m", "kind": "bullet", "sub": [], "text": "The dominant religious institution of Vaylena."}, {"id": "l8buxz", "kind": "bullet", "sub": [], "text": "Teaches that the holy lineages descend from the Mother."}, {"id": "3c3x9y", "kind": "bullet", "sub": [], "text": "Teaches the Stormwall as \"a great act of nature created to protect the lands from darkness.\""}, {"id": "rsc5i9", "kind": "bullet", "sub": [], "text": "Teaches that Lightbearer ability, like elemental bonds, comes only from the Mother's bloodline descendants."}, {"id": "14bs3ee", "kind": "bullet", "sub": [], "text": "Tried to ostracize Ashalia Sherridan for her dark-burning fire."}]}, {"dm": false, "heading": "The Seven Ministries", "id": "5kcn5l", "items": [{"id": "1nrp0q4", "kind": "bullet", "sub": [], "text": "**The Ministry of the Mother's Radiance**"}, {"id": "1ltipiz", "kind": "bullet", "sub": [], "text": "**The Ministry of Abundance**"}, {"id": "16suldf", "kind": "bullet", "sub": [], "text": "**The Ministry of Invigoration**"}, {"id": "xpdfuk", "kind": "bullet", "sub": [], "text": "**The Ministry of Solidarity**"}, {"id": "1p2a60s", "kind": "bullet", "sub": [], "text": "**The Ministry of Mercy**"}, {"id": "1iiyvoa", "kind": "bullet", "sub": [], "text": "**The Ministry of War**"}, {"id": "kusjj2", "kind": "bullet", "sub": [], "text": "**The Ministry of Inquisition**"}]}, {"dm": false, "heading": "The Inquisition", "id": "1duxlla", "items": [{"id": "v5657e", "kind": "bullet", "sub": [], "text": "Headed by the **Grand Inquisitor**"}]}], "theme": "Radiance"}, {"circle": false, "culture": "Shadow", "dmOnly": false, "facts": [{"id": "inxldu", "label": "Type", "text": "Shadow organization"}, {"id": "1o8daja", "label": "Also known as", "text": "The Circle of the Sun"}, {"id": "18xflft", "label": "Founder", "text": "The Lightbringer"}], "fullBody": null, "fullName": null, "gallery": [], "group": "Shadow Organizations", "headline": "The Circle", "houseGroup": null, "id": "the-circle", "kind": "faction", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "1e31lvs", "items": [{"id": "1ewgsqt", "kind": "bullet", "sub": [], "text": "Subjugated House Tyran in conspiracy with House Sarlei."}]}, {"dm": false, "heading": "Members", "id": "13d5va2", "items": [{"id": "15avpde", "kind": "bullet", "sub": [], "text": "**The Lightbringer**; formal founder of the Circle, and secretly the Church's Grand Inquisitor."}, {"id": "z1zr4t", "kind": "bullet", "sub": [], "text": "**The Raven**; architect of House Tyran's subjugation."}, {"id": "191ir2c", "kind": "bullet", "sub": [], "text": "**The Reaver** — Reaver; leader of the Coven, and a lesser member serving under the Raven."}]}], "theme": "Eclipse"}, {"at": {"map": "world", "x": 1180, "y": 1820}, "circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "group": "Wilds & Regions", "headline": "The Cosera Sea", "houseGroup": null, "id": "the-cosera-sea", "kind": "place", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Ferran", "dmOnly": false, "facts": [{"id": "11r9cmh", "label": "Type", "text": "Covert organization"}, {"id": "17p4ozk", "label": "Leader", "text": "Reaver"}, {"id": "inexhu", "label": "Predecessor", "text": "The Steel Watch"}], "fullBody": null, "fullName": null, "gallery": [], "group": "Organizations & Faith", "headline": "The Coven", "houseGroup": null, "id": "the-coven", "kind": "faction", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "16taudp", "items": [{"id": "1p68r9i", "kind": "bullet", "sub": [], "text": "A recreation of the **Steel Watch**, which was typically headed and served in by the women of House Tyran and counted observation among its objectives. The Coven is no longer exclusive to House Tyran."}, {"id": "ddx973", "kind": "bullet", "sub": [], "text": "Its leader, Reaver, is a lesser member of the Circle and serves under the Raven."}]}], "theme": "Reaver"}, {"at": {"map": "world", "x": 1990, "y": 1010}, "circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "group": "Wilds & Regions", "headline": "The Graelen Mountains", "houseGroup": null, "id": "the-graelen-mountains", "kind": "place", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "dd38tv", "label": "Bond", "text": "Water (Tidewatcher)"}, {"id": "be7864", "label": "Holy Lineage", "text": "Taurien"}, {"id": "1vuq0o0", "label": "Head", "text": "Tae'linna Graeven Nightlake"}, {"id": "qtyu7y", "label": "Branches", "text": "Ardynet, Nightlake"}], "fullBody": null, "fullName": null, "gallery": [], "group": null, "headline": "The Graeven Family", "houseGroup": "Holy Lineage", "id": "the-graeven-family", "kind": "house", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "psszzw", "items": [{"id": "s53ge4", "kind": "para", "sub": [], "text": "The Graeven family descends directly from **Queen Vanya Graeven**, Valyon's last crown-bearer (Champion of Water, bearer of the Crown of Taurien), who disappeared roughly 80 years before the current campaign timeline."}, {"id": "176i6r5", "kind": "para", "sub": [], "text": "The family divides into two parts covered here: the **Ardynet branch** and **Nightlake branch**, both direct blood descendants of Vanya."}]}, {"dm": false, "heading": "Full Lineage", "id": "1ejjrmq", "items": [{"id": "1g5a9bb", "kind": "bullet", "sub": [], "text": "**Queen Vanya Graeven** × unnamed consort"}]}, {"dm": false, "heading": "Members — Ardynet Branch", "id": "1wj1i2f", "items": [{"id": "1v9ur9e", "kind": "subhead", "sub": [], "text": "Daeon Graeven Ardynet (current era)"}, {"id": "1vza144", "kind": "bullet", "sub": [], "text": "Son of Chloe Graeven Ardynet and Corey Tyran Veloce ."}]}, {"dm": false, "heading": "Members — Nightlake Branch", "id": "1papmzd", "items": [{"id": "1yox0jr", "kind": "subhead", "sub": [], "text": "Tae'linna Graeven Nightlake (current era)"}, {"id": "t00yhi", "kind": "bullet", "sub": [], "text": "Daughter of **Tae'lor Graeven** and **Sorel Nightlake**."}, {"id": "1pli2e", "kind": "bullet", "sub": [], "text": "Currently the **sole surviving Graeven-Nightlake** and recognized **Head of the Graeven lineage** overall"}, {"id": "ercq1u", "kind": "subhead", "sub": [], "text": "Soren Graeven Nightlake (deceased)"}, {"id": "1t773d8", "kind": "subhead", "sub": [], "text": "Tae'lor Graeven (deceased)"}]}, {"dm": false, "heading": "Current Status", "id": "31wfhh", "items": [{"id": "2mihd4", "kind": "bullet", "sub": [], "text": "**Tae'linna Graeven Nightlake** holds recognized headship of the entire Graeven lineage, and is the current, still-unaware Vessel of Til'auriel's Deathlessness."}, {"id": "1h291na", "kind": "bullet", "sub": [], "text": "**Daeon Graeven Ardynet** leads the Crownseekers, formally tasked with locating the Elemental Crowns"}]}], "theme": "Tidewatcher"}, {"circle": false, "culture": "Ferran", "dmOnly": false, "facts": [{"id": "vu0dw6", "label": "Type", "text": "Pairbond tradition"}], "fullBody": null, "fullName": null, "gallery": [], "group": "Ferran Gifts", "headline": "The Krasis", "houseGroup": null, "id": "the-krasis", "kind": "system", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "6qui7g", "items": [{"id": "1vmtfhr", "kind": "bullet", "sub": [], "text": "Ferran combatants traditionally fight in formally bonded pairs."}, {"id": "1rd69k0", "kind": "bullet", "sub": [], "text": "Combat strength is measured not only in individual skill, but in the trust and synchrony built between two dedicated partners. A pair trains, fights and is often assigned together for the length of the bond."}, {"id": "1k1me46", "kind": "bullet", "sub": [], "text": "Losing one's Krasid carries real personal and social weight beyond losing a combat partner."}]}, {"dm": false, "heading": "Terms", "id": "6nue5y", "items": [{"id": "1684212", "kind": "bullet", "sub": [], "text": "**Krasis** — the bonded pair itself; two fighters operating as one unit."}, {"id": "1ahza5q", "kind": "bullet", "sub": [], "text": "**Krasisbound** — the state or tradition of being formally paired."}, {"id": "1bhwi7j", "kind": "bullet", "sub": [], "text": "**Krasid** — one member of a bonded pair."}, {"id": "bfgi32", "kind": "bullet", "sub": [], "text": "**Akrasid** — a former Krasid whose bond ended through death, betrayal or severance."}, {"id": "bnh8l7", "kind": "bullet", "sub": [], "text": "**Cognomen** — a name a Ferran may choose on becoming Krasisbound, used for quick identification in combat; often a declaration of identity, intent or history."}]}, {"dm": false, "heading": "Known Pairs", "id": "6vpz6e", "items": [{"id": "rboehr", "kind": "bullet", "sub": [], "text": "**Riven and Umbra**"}]}], "theme": "Steelforged"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1s5lj3x", "label": "Head", "text": "Colter Montaine"}, {"id": "pimdzn", "label": "Holdings", "text": "Montaine Firearms; landholdings in Westallum"}], "fullBody": null, "fullName": null, "gallery": [], "group": null, "headline": "The Montaine Family", "houseGroup": "Family of Central", "id": "the-montaine-family", "kind": "house", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "m9vpwn", "items": [{"id": "irrjcs", "kind": "para", "sub": [], "text": "House Montaine is a wealthy Central business family, owners of Montaine Firearms — an emerging rival to Veloce Industries — and landowners in Westallum district. Walker and Leslie Montaine, the family's twin heirs, died in the Frostlake Expedition massacre roughly 9 years before the current timeline. The family name and business have since continued through their adoptive successors."}]}, {"dm": false, "heading": "Lineage", "id": "ef40x5", "items": [{"id": "l3z1sb", "kind": "bullet", "sub": ["**Walker Montaine** (deceased — Night of Metal and Blood's precipitating event, the Frostlake massacre) × **Remmington \"Remy\" Gunn**", "No biological children together.", "**Leslie Montaine** (deceased, same event) × unnamed father (did not stay with Leslie)", "**Colter Montaine** — son."], "text": "**[Montaine patriarch, unnamed]** — father of Walker and Leslie; formerly head of Montaine Firearms."}, {"id": "5vxdt7", "kind": "bullet", "sub": ["Remy's biological son, from an earlier relationship with **Kentucky Luger**: **Wynn Chester Gunn** (current party member, age 20; see his character sheet)."], "text": "**Remmington \"Remy\" Gunn (Montaine)** — took the Montaine name and raised Colter as her own following Walker and Leslie's deaths."}]}, {"dm": false, "heading": "Members", "id": "1n8vs8v", "items": [{"id": "wijdmb", "kind": "subhead", "sub": [], "text": "Colter Montaine (age 22)"}, {"id": "1u9x4n4", "kind": "bullet", "sub": [], "text": "Son of Leslie Montaine and an unnamed father who did not stay in her life."}, {"id": "16zy2lc", "kind": "bullet", "sub": [], "text": "Currently head of House Montaine, with Remy serving as his advisor"}, {"id": "l4qqrk", "kind": "subhead", "sub": [], "text": "Remmington \"Remy\" Gunn (Montaine)"}, {"id": "kugzfr", "kind": "bullet", "sub": [], "text": "Married Walker Montaine."}]}, {"dm": false, "heading": "Current Status", "id": "n50xm6", "items": [{"id": "75lrrq", "kind": "bullet", "sub": [], "text": "House Montaine is currently led by Colter (age 22), advised by Remy, running both the family firearms business and active Headhunter field duty for Central Command."}, {"id": "hi99gy", "kind": "bullet", "sub": [], "text": "Montaine Firearms continues as an emerging rival to Veloce Industries."}]}], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "4mrkxm", "label": "Type", "text": "Governing council of Valyon"}, {"id": "g9f5f3", "label": "Leader", "text": "Grand Councilor Elise Veloce Le'Senthe"}, {"id": "1067dwf", "label": "Seat", "text": "Central, Valyon"}], "fullBody": null, "fullName": null, "gallery": [], "group": "Government & Military", "headline": "The New Regency Council", "houseGroup": null, "id": "the-new-regency-council", "kind": "faction", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "8nxrjk", "items": [{"id": "17gunib", "kind": "bullet", "sub": [], "text": "The third civic branch, and direct successor to the regency council that had ruled since Queen Vanya Graeven's disappearance, until Team Van Saun and Team Montaine exposed its corruption and brought it down."}, {"id": "oijw6n", "kind": "bullet", "sub": [], "text": "Reformed with entirely new members and directives, and a far stricter, more public electoral process."}, {"id": "yhkp4y", "kind": "bullet", "sub": [], "text": "Sets policy for the city and plans its path forward alongside Central Command and the OCI."}, {"id": "15jr12m", "kind": "bullet", "sub": [], "text": "Holds a standing mandate to watch for any legitimate avenue that could restore a ruling monarch to Valyon's throne."}, {"id": "l8575j", "kind": "bullet", "sub": [], "text": "Headed by the **Grand Councilor**, who oversees and arbitrates the council members and serves as its voice to the people."}]}, {"dm": false, "heading": "Members", "id": "1gax7ea", "items": [{"id": "1pyiypc", "kind": "bullet", "sub": [], "text": "**Elise Veloce** — Grand Councilor."}]}], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1udncoa", "label": "Seat", "text": "The Nightlake estate, Central"}], "fullBody": null, "fullName": null, "gallery": [], "group": null, "headline": "The Nightlake Family", "houseGroup": "Family of Central", "id": "the-nightlake-family", "kind": "house", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "jwateb", "items": [{"id": "d54wp5", "kind": "bullet", "sub": [], "text": "A wealthy Central business house."}, {"id": "1xe6g5l", "kind": "bullet", "sub": [], "text": "**Sorel Nightlake** married **Tae'lor Graeven**, joining the Nightlake name to the Graeven lineage"}]}, {"dm": false, "heading": "Members", "id": "1g1y9b7", "items": [{"id": "19lp6f9", "kind": "bullet", "sub": [], "text": "**Sorel Nightlake** — Tae'linna's father."}, {"id": "19bdq5b", "kind": "bullet", "sub": [], "text": "**Soren Graeven Nightlake (deceased)** — elder son."}, {"id": "1y3qz5l", "kind": "bullet", "sub": [], "text": "**Tae'linna Graeven Nightlake** — daughter; Head of the Graeven lineage."}, {"id": "1x2t9mp", "kind": "bullet", "sub": [], "text": "**Reghen Nightlake** — Sorel's brother; heads the Watts house with Livinna."}]}], "theme": "Tidewatcher"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "clgt1s", "label": "Type", "text": "Civic branch; municipal administration and intelligence"}, {"id": "1ibo615", "label": "Leader", "text": "Director Krystal Van Saun"}, {"id": "x49ai3", "label": "Headquarters", "text": "Central, Valyon"}], "fullBody": null, "fullName": null, "gallery": [], "group": "Government & Military", "headline": "The Office of Central Intelligence", "houseGroup": null, "id": "the-office-of-central-intelligence", "kind": "faction", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "x3jeua", "items": [{"id": "1brld6i", "kind": "bullet", "sub": [], "text": "The second of the three civic branches founded after the old regency council collapsed."}, {"id": "c1oxxm", "kind": "bullet", "sub": [], "text": "Handles public information gathering, dissemination and archiving, and serves as Valyon's municipal branch: the city's actual paperwork and administrative management."}, {"id": "huw7i0", "kind": "bullet", "sub": [], "text": "Under Director Van Saun, its focus is detecting and removing corruption, or at least monitoring it."}, {"id": "tucoc0", "kind": "bullet", "sub": [], "text": "Central Intelligence agents bring draftees to the capital for boot camp."}]}, {"dm": false, "heading": "Members", "id": "18tyx9k", "items": [{"id": "s3z3xb", "kind": "bullet", "sub": [], "text": "**Krystal Van Saun** — founding Director."}, {"id": "1eoat8i", "kind": "bullet", "sub": [], "text": "**Calyx Van Saun** — \"Curator of War,\" head of the branch that gathers information on foreign threats."}]}], "theme": "Parchment"}, {"circle": false, "culture": "Ferran", "dmOnly": false, "facts": [{"id": "4zeld4", "label": "Type", "text": "Faith"}, {"id": "1u3t9g3", "label": "Founder", "text": "Khalen-Tor, the Walker of the Paths"}], "fullBody": null, "fullName": null, "gallery": [], "group": "Organizations & Faith", "headline": "The Patheans", "houseGroup": null, "id": "the-patheans", "kind": "faction", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "8phsx6", "items": [{"id": "gwe83r", "kind": "bullet", "sub": [], "text": "Most Ferrans are Patheans, followers of **the Path**, the teachings of who they believe to be an ancient Ferran named Khalen-Tor."}, {"id": "1p4z89f", "kind": "bullet", "sub": [], "text": "They call him the Walker of the Paths, and believe he could see anyone's path and fate when he met them."}, {"id": "132orhy", "kind": "bullet", "sub": [], "text": "They hold that every person has a path they walk through life, and that one's path is sacred."}, {"id": "1jy130t", "kind": "bullet", "sub": [], "text": "Ferrans generally regard the Church of the Mother as nonsense"}]}], "theme": "Parchment"}, {"at": {"map": "central", "x": 1583, "y": 1364}, "circle": false, "culture": "Valyon", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "group": "Landmarks of Central", "headline": "The Regency Council Hall", "houseGroup": null, "id": "the-regency-council-hall", "kind": "place", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Ferran", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "group": "Wilds & Regions", "headline": "The River Drolta", "houseGroup": null, "id": "the-river-drolta", "kind": "place", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Beyond", "dmOnly": false, "facts": [{"id": "1gvtdef", "label": "Type", "text": "Veil-touched trait"}], "fullBody": null, "fullName": null, "gallery": [], "group": "Other Powers", "headline": "The Shadowtouched", "houseGroup": null, "id": "the-shadowtouched", "kind": "system", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "g2qhdb", "items": [{"id": "1rldu6z", "kind": "bullet", "sub": [], "text": "Individuals touched by leakage from the Veil"}, {"id": "s2k447", "kind": "bullet", "sub": [], "text": "Ashalia Sherridan's fire burns dark from ambient Veil exposure in her youth, an early known example. It changes only her fire's appearance, not its nature. She named herself \"Embershade,\" reclaiming the trait."}, {"id": "1j4mj8c", "kind": "bullet", "sub": [], "text": "Cibilla Mothbourn's morbid, shadow-inflected healing comes from Veil exposure in her youth, in the area later walled off as the Veil district."}]}], "theme": "Shadowsong"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "13im1zf", "label": "Bond", "text": "Fire (Flameborn)"}, {"id": "i8rgok", "label": "Holy Lineage", "text": "Vallesari, through Sherrand"}, {"id": "wr8jag", "label": "Head", "text": "Anaria Kresanthe Sherridan"}], "fullBody": null, "fullName": null, "gallery": [], "group": null, "headline": "The Sherridan Family", "houseGroup": "Holy Lineage", "id": "the-sherridan-family", "kind": "house", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "xtr9tg", "items": [{"id": "10d2eh9", "kind": "bullet", "sub": [], "text": "Descended from **Sherrand**, younger daughter of Vallesand and Kira Selvin; one of Vaylena's oldest Flameborn bloodlines."}, {"id": "1v7qkyg", "kind": "bullet", "sub": [], "text": "Long regarded as the lesser of the two Vallesari branches, behind House Veloce, until the most recent generation."}]}, {"dm": false, "heading": "Members", "id": "1ulwhum", "items": [{"id": "1k32qps", "kind": "bullet", "sub": [], "text": "**Sherrand** — ancestor of the Sherridan line."}, {"id": "1fi4a7s", "kind": "bullet", "sub": [], "text": "**Ashalia Sherridan** — \"Embershade\"; Blademaster; Anaria's mother."}, {"id": "vewbeg", "kind": "bullet", "sub": [], "text": "**Anaria Kresanthe Sherridan** — the Dawnwarden; head of the house."}]}], "theme": "Dawnwarden"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "fo3qdc", "label": "Bond", "text": "Air (Windrider)"}], "fullBody": null, "fullName": null, "gallery": [], "group": null, "headline": "The Van Saun Family", "houseGroup": "Family of Central", "id": "the-van-saun-family", "kind": "house", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "35l8ct", "items": []}, {"dm": false, "heading": "Members", "id": "1i58n8x", "items": [{"id": "ecdj7y", "kind": "bullet", "sub": [], "text": "**Krystal Van Saun** — founding Director of the Office of Central Intelligence."}, {"id": "1rr727l", "kind": "bullet", "sub": [], "text": "**Calyx Van Saun** — eldest; \"Curator of War\" in the Office of Central Intelligence."}, {"id": "17smuoc", "kind": "bullet", "sub": [], "text": "**Zephyrus Van Saun** — third child; a soldier in Vaylen Central Command."}, {"id": "cos7vt", "kind": "bullet", "sub": [], "text": "**Amerys Van Saun** — youngest."}]}], "theme": "Windrider"}, {"at": {"map": "valyon", "x": 2030, "y": 988}, "circle": false, "culture": "Valyon", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "group": "Districts", "headline": "The Veil", "houseGroup": null, "id": "the-veil", "kind": "place", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1hn5rpn", "label": "Bond", "text": "Fire (Flameborn)"}, {"id": "1pxk9is", "label": "Holy Lineage", "text": "Vallesari, through Vellas"}, {"id": "14gs6bn", "label": "Seat", "text": "Veloce Estates, Central"}, {"id": "fjz04u", "label": "Holdings", "text": "Veloce Industries"}], "fullBody": null, "fullName": null, "gallery": [], "group": null, "headline": "The Veloce Family", "houseGroup": "Holy Lineage", "id": "the-veloce-family", "kind": "house", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "qt7mgk", "items": [{"id": "ylbp1j", "kind": "bullet", "sub": [], "text": "Descended from **Vellas**, elder son of Vallesand and Kira Selvin"}, {"id": "6se413", "kind": "bullet", "sub": [], "text": "Until the most recent generation, regarded as the stronger and more prestigious of the two branches, a status kept in part by a longstanding practice of marrying only fellow Flameborn spouses."}, {"id": "e9al1i", "kind": "bullet", "sub": [], "text": "**Andrei Veloce**, born without a bond to a family of inventors, married heiress **Lorelei Veloce** and took the Veloce name himself, an unusual departure from Vaylen naming tradition."}, {"id": "18wgg6r", "kind": "bullet", "sub": [], "text": "Veloce Industries remains a supplier to Central Command, though much of its focus and prestige now goes to custom, one-off projects rather than mass production."}, {"id": "pzu7cf", "kind": "bullet", "sub": [], "text": "After Toran's death, Andrei adopted **Corey Tyran** into the house and married Corey's mother, Alicia."}]}, {"dm": false, "heading": "Members", "id": "19sjk2m", "items": [{"id": "e8nywa", "kind": "bullet", "sub": [], "text": "**Vellas** — ancestor of the Veloce line."}, {"id": "1fk0lwz", "kind": "bullet", "sub": [], "text": "**Lorelei Veloce (deceased)**; died of natural causes roughly a year before Toran."}, {"id": "1mxsgf", "kind": "bullet", "sub": [], "text": "**Andrei Veloce** — married into the house; built Veloce Industries; preceded Elise on the New Regency Council."}, {"id": "lyck9g", "kind": "bullet", "sub": [], "text": "**Elise Veloce** — elder daughter; Grand Councilor of the New Regency Council, now Grand Councilor Elise Veloce Le'Senthe."}, {"id": "5csp97", "kind": "bullet", "sub": [], "text": "**Toran Veloce (deceased)** — younger son; gave his Flameborn bond to Corey as he died."}, {"id": "173iv05", "kind": "bullet", "sub": [], "text": "**Corey Tyran Veloce** — adopted son; founding Knight-Commander of Vaylen Central Command."}, {"id": "mcezcr", "kind": "bullet", "sub": [], "text": "**Alisa Tyran Veloce** — Corey's daughter; a Headhunter, deployed behind Ferran lines."}]}], "theme": "Flameborn"}, {"circle": false, "culture": "Beyond", "dmOnly": false, "facts": [{"id": "t7wscx", "label": "Type", "text": "Inherited role"}], "fullBody": null, "fullName": null, "gallery": [], "group": "Other Powers", "headline": "The Vessel and the Guardian", "houseGroup": null, "id": "the-vessel-and-the-guardian", "kind": "system", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "xl9i9x", "items": []}], "theme": "Tidewater"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1h5afss", "label": "Type", "text": "Independent military order"}, {"id": "1axdzlx", "label": "Leader", "text": "Anaria Kresanthe Sherridan, the Dawnwarden"}, {"id": "1zay0v", "label": "Headquarters", "text": "Keep Al'geth"}, {"id": "58n4zo", "label": "Standing", "text": "Officially recognized by Central Command, but operates independently"}], "fullBody": null, "fullName": null, "gallery": [], "group": "Government & Military", "headline": "The Wardens", "houseGroup": null, "id": "the-wardens", "kind": "faction", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "33kecu", "items": [{"id": "1gxqai8", "kind": "bullet", "sub": [], "text": "Grew out of Anaria's years on the Northern Front. For most of that campaign her first two recruits served alongside her in regular Central Command ranks; only in the front's final two years did the three become a standalone unit, simply called the Wardens."}, {"id": "1ngdo41", "kind": "bullet", "sub": [], "text": "After the Northern Front closed, Anaria brought her team to Central to recover, train and plan, and the core grew to five."}, {"id": "78w1a6", "kind": "bullet", "sub": [], "text": "With the core assembled, the Wardens infiltrated Keep Al'geth through a Pre-Sundering tunnel system and routed House Vortan. Anaria took the Dawnwarden title at this point and began coordinating with the Knight-Commander as an equal power."}, {"id": "10f2j9g", "kind": "bullet", "sub": [], "text": "Allison and Fred have begun taking their own pupils, laying the groundwork for a formal order of Knights."}, {"id": "1q42jkq", "kind": "bullet", "sub": [], "text": "Anaria actively works to bar the Circle from operating freely wherever she can."}]}, {"dm": false, "heading": "Members", "id": "sv9al8", "items": [{"id": "10m2lcm", "kind": "bullet", "sub": [], "text": "**Anaria Kresanthe Sherridan** — the Dawnwarden; founder and leader."}, {"id": "1axk5yo", "kind": "bullet", "sub": [], "text": "**Frederic \"Fred\" Donner** — first recruit; younger brother of the late Alfred \"Donny\" Donner."}, {"id": "17vaexj", "kind": "bullet", "sub": [], "text": "**Allison Vint** — second recruit; an unbonded tracker from Salenbrook."}, {"id": "sw61f0", "kind": "bullet", "sub": [], "text": "**Cibilla Mothbourn** — the Wardens' main healer."}, {"id": "1luda2p", "kind": "bullet", "sub": [], "text": "**Dovah Ikelos** — the Wardens' spellcaster"}]}], "theme": "Dawnwarden"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "gfp9ut", "label": "Head", "text": "Reghen Nightlake and Livinna Watts"}, {"id": "15ks6w6", "label": "Seat", "text": "The Watts estate *(location open)*"}], "fullBody": null, "fullName": null, "gallery": [], "group": null, "headline": "The Watts Family", "houseGroup": "Family of Central", "id": "the-watts-family", "kind": "house", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "4fzebj", "items": []}, {"dm": false, "heading": "Members", "id": "1d0nmrr", "items": [{"id": "1wqlggh", "kind": "bullet", "sub": [], "text": "**Livinna Watts** — co-head of the house"}, {"id": "g2zuek", "kind": "bullet", "sub": [], "text": "**Millicent Watts (deceased)** — Livinna's sister; Killian's mother."}, {"id": "p1jtug", "kind": "bullet", "sub": [], "text": "**Killian Watts** — Millicent's son."}]}], "theme": "Stormcaller"}, {"circle": false, "culture": "Ancient", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Thyrenn Tremholt", "id": "thyrenn-tremholt", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Radiance"}, {"circle": false, "culture": "Elemental", "dmOnly": false, "facts": [{"id": "4t5ryu", "label": "Element", "text": "Water"}, {"id": "efps82", "label": "Primarch", "text": "Taurien"}, {"id": "6ylgzv", "label": "Season", "text": "Winter"}, {"id": "uy2rm5", "label": "Church Ministry", "text": "The Ministry of Mercy"}], "fullBody": null, "fullName": null, "gallery": [], "group": "The Five Lineages", "headline": "Tidewatchers", "houseGroup": null, "id": "tidewatchers", "kind": "system", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "k3lqjo", "items": [{"id": "56i2s6", "kind": "bullet", "sub": [], "text": "The common name for those bonded to Water."}, {"id": "1yydsiu", "kind": "bullet", "sub": [], "text": "**Queen Vanya Graeven**, Valyon's last crown-bearer, held the Crown of Taurien."}]}, {"dm": false, "heading": "Known Bearers", "id": "167okap", "items": [{"id": "1rhil0k", "kind": "bullet", "sub": [], "text": "**Chloe Graeven Ardynet**"}, {"id": "1mm1zte", "kind": "bullet", "sub": [], "text": "**Daeon Graeven Ardynet**"}, {"id": "q5x1wz", "kind": "bullet", "sub": [], "text": "**Tae'linna Graeven Nightlake**"}]}], "theme": "Tidewatcher"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "139o1ko", "label": "Vanguard Registry", "text": "TS-219 (second generation, Vanguard Legacy program)"}, {"id": "u1fshz", "label": "Age (current timeline, year 847)", "text": "22"}, {"id": "9edjaq", "label": "Species/Heritage", "text": "Human — Stonebreaker (Earth) bond, inherited through her mother's bond lineage"}, {"id": "f1dagl", "label": "Nation/Culture of Origin", "text": "Vaylena — Valyon"}, {"id": "1lk35ph", "label": "Current Residence/Affiliation", "text": "Vaylen Central Command — gunswoman and inventor in the Crownseekers under Captain Daeon Graeven Ardynet; quartermaster of the unit as a side title"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Tivoli Saunders", "id": "tivoli-saunders", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Appearance", "id": "1jk9mt1", "items": [{"id": "1tqp3x2", "kind": "bullet", "sub": [], "text": "Wears prosthetic arms of her own design. Her right arm was lost below the shoulder; her left arm was lost above the wrist (she kept her left forearm, not the hand)."}, {"id": "1nynvdl", "kind": "bullet", "sub": ["**Utility set:** looks like ordinary arms, with access hatches for hand tools.", "**Combat set:** openly mechanical, with no built-in weapons. Sensors tie firearms and weapons to sub-processors, and power-assist motors sit in the joints.", "**Formal set:** opulent and mostly skin-like, with fine jewelry incorporated and engraving along the joints."], "text": "Owns a comical collection of interchangeable arm sets, some with tools and some with weapons, some sleek and some brutal. Three are in regular use, all built by her:"}]}, {"dm": false, "heading": "Heritage & Bloodline", "id": "15j0dr9", "items": [{"id": "cmi7dl", "kind": "bullet", "sub": [], "text": "**Mother**: Treanna Saunders (T-219), a Stonebreaker and Vanguard graduate a couple of years after Corey Tyran Veloce's cohort."}, {"id": "gpzbjo", "kind": "bullet", "sub": [], "text": "**Father**: Unnamed and deceased."}, {"id": "ga469j", "kind": "bullet", "sub": [], "text": "**Elemental bond**: Stonebreaker (Earth). Her surname and registry number follow bond lineage."}, {"id": "sp3dz8", "kind": "bullet", "sub": [], "text": "**Vanguard Legacy**"}, {"id": "38g2gq", "kind": "bullet", "sub": [], "text": "Regarded across the University as a generational prodigy."}]}, {"dm": false, "heading": "Background", "id": "1xbzwqb", "items": [{"id": "u1g9uw", "kind": "bullet", "sub": [], "text": "**Early life**: Naturally gifted with her bond and headed for a promising future. Her mother Treanna served in a quartermaster-style role while active, and later retired from it."}, {"id": "1yvz9c", "kind": "bullet", "sub": [], "text": "**Night of Metal and Blood (age 13)**: Her family's house collapsed in the fighting. Her father was crushed pushing her to safety. Her arms were crushed beyond healable function and amputated, and she survived."}, {"id": "16m2ixx", "kind": "bullet", "sub": [], "text": "**First prosthetics**: A lifelike set from a generic company. She found her bond hard to use with them, and her hands shake whenever she tries. The sets were not designed to be removed, so she retrofitted them. That work is the root of her engineering, and little of the original hardware survives."}, {"id": "1q2y1o", "kind": "bullet", "sub": [], "text": "**The block is psychological**: The collapse tore apart her psyche. It left her with a vast intellect, a morbid sense of humor and occasional harsh personality flips. Earth is a very physical bond, and feeling \"not whole\" makes it hard for her to form internally what she wants it to do."}, {"id": "1gaa36", "kind": "bullet", "sub": [], "text": "**Education**: Self-taught or University-learned. Master of invention and artificery Lionel Kilven (L-006), a first-generation Vanguard graduate and instructor, is very fond of her. He calls her his best student in 30 years."}, {"id": "1ys2njy", "kind": "bullet", "sub": [], "text": "**Early career (Montaine)**: Colter Montaine, a fellow student, hired her at 18 for Montaine company work through his mother Remy. He then recruited her into his early Gunslingers, who policed the capital for general criminals. Her gunsmithing and sharpshooting experience comes from this period. At this stage she was Montaine-paid, not Central Command."}, {"id": "2c5gk", "kind": "bullet", "sub": [], "text": "**Meeting Tae'linna**: Tivoli met Tae'linna at University. Tae'linna was struggling to get into the Crownsguard with a rough record, and Knight-Commander Thane had rejected her. Tivoli recommended her to Colter. Tae'linna joined as an official Central Command posting, a contracted agent on Montaine papers."}, {"id": "85k7lr", "kind": "bullet", "sub": [], "text": "**Gunslingers folded into Central**: A munitions deal between Remy Montaine and Thane Khavren formally brought the Gunslingers into Central Command."}, {"id": "8i9278", "kind": "bullet", "sub": [], "text": "**Crownsguard (age 19)**: Scouted for excellent service. Daeon was already captain, if new to the post. Tae'linna joined a little over a year later."}, {"id": "pcq9xd", "kind": "bullet", "sub": [], "text": "**Crownseekers**: When Central Command relocated to Keep Al'geth, the Crownsguard was dissolved and refocused under Daeon to find the Elemental Crowns. Tivoli picked up the quartermaster title at the shift. It is a side title, and her main work remains gunswoman and inventor."}, {"id": "nzd3uj", "kind": "bullet", "sub": [], "text": "**Side work**: Her designs are used privately at various companies (unnamed), and she consults occasionally."}]}, {"dm": false, "heading": "Personality", "id": "1vtt6fl", "items": [{"id": "hdf4nl", "kind": "bullet", "sub": [], "text": "**Everyday**: A partier and a borderline-perverse flirt with anyone interesting. Her humor is morbid and her drinking varies. All of it is coping armor over an exceptional intellect."}, {"id": "72vv8s", "kind": "bullet", "sub": [], "text": "**The flips**: Rare, and set off by anger over sensitive subjects: her father, and Ferrans to degrees. They show as uncomfortable invasions of personal space, vivid verbalization of violence, and an uncomfortable comfort with hurting people."}, {"id": "79imx0", "kind": "bullet", "sub": [], "text": "**Self-control**: Depends on how well she can logic herself out of a mood, which she is generally very good at."}, {"id": "1dhn69n", "kind": "bullet", "sub": [], "text": "Her officers know about the flips. They have hardly been an issue so far, and her eccentricities are overlooked."}]}, {"dm": false, "heading": "Relationships", "id": "18jxile", "items": [{"id": "up3uem", "kind": "bullet", "sub": [], "text": "**Treanna Saunders (mother)**: Alive, and acting Central Quartermaster in Valyon while Central Command is relocated."}, {"id": "1hmmjc7", "kind": "bullet", "sub": [], "text": "**Father (deceased, unnamed)**"}, {"id": "1nbeeq", "kind": "bullet", "sub": [], "text": "**Tae'linna Graeven Nightlake**: Best friend. They get up to mischief together, and Tivoli is the wilder, more chaotic anchor."}, {"id": "agubjp", "kind": "bullet", "sub": [], "text": "**Daeon Graeven Ardynet**: Captain and commanding officer."}, {"id": "1b62ar4", "kind": "bullet", "sub": [], "text": "**Colter Montaine**: Hired and recruited her. **Remy Montaine:** Brokered her work and the munitions deal."}, {"id": "pxkgwn", "kind": "bullet", "sub": [], "text": "**Thane Khavren**: Knight-Commander, and the ultimate authority over her unit."}, {"id": "1j2wv69", "kind": "bullet", "sub": [], "text": "**Master Lionel Kilven (L-006)**: Mentor."}]}, {"dm": false, "heading": "Skills & Abilities", "id": "1oeukie", "items": [{"id": "gz1aqx", "kind": "bullet", "sub": [], "text": "Master-level invention and artificery."}, {"id": "2s8e3t", "kind": "bullet", "sub": [], "text": "Gunsmithing and sharpshooting."}, {"id": "1up5aam", "kind": "bullet", "sub": [], "text": "Prosthetic engineering, including the swap-mount system retrofitted from her first prosthetics."}, {"id": "r3b76p", "kind": "bullet", "sub": [], "text": "Stonebreaker (Earth) bond: usable but weak"}]}, {"dm": false, "heading": "Current Status", "id": "1g6kahd", "items": [{"id": "52w4lx", "kind": "bullet", "sub": [], "text": "Gunswoman and inventor in the Crownseekers, with the quartermaster side title, under Captain Daeon. The Crownseekers answer to Thane like any unit he formally commissions."}, {"id": "1v23tm", "kind": "bullet", "sub": [], "text": "Consults privately on the side."}]}], "theme": "Stonebreaker"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "17cxmj0", "label": "Species/Heritage", "text": "Human — Flameborn (Vellas branch of Vallesari's holy line)"}, {"id": "1sh1eif", "label": "Current Residence/Affiliation", "text": "House Veloce (deceased)"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Toran Veloce", "id": "toran-veloce", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Flameborn"}, {"circle": false, "culture": "Ferran", "dmOnly": false, "facts": [{"id": "1d0r87a", "label": "Cognomen", "text": "Umbra"}, {"id": "1qleiru", "label": "Species/Heritage", "text": "Ferran"}, {"id": "15dew8t", "label": "Current Residence/Affiliation", "text": "Riven's Krasid; recently broke from the Coven"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Umbra", "id": "umbra", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Steelforged"}, {"circle": false, "culture": "Ancient", "dmOnly": false, "facts": [{"id": "v057l1", "label": "Age", "text": "Pre-Sundering individual"}, {"id": "2yb3qy", "label": "Species/Heritage", "text": "Originally wholly mortal human; ascended to a fledgling god through the forced subjugation of all five Primarchs"}, {"id": "i26ll9", "label": "Nation/Culture of Origin", "text": "Drolta"}, {"id": "813yod", "label": "Current Residence/Affiliation", "text": "Bound within **the Garden**, a sealed pocket of the Inbetween"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Valira", "id": "valira", "names": [{"id": "lzhu57", "label": "Also known as", "value": "The Mother"}], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Background", "id": "1n8aoiz", "items": [{"id": "1e05oid", "kind": "bullet", "sub": [], "text": "A brilliant, inquisitive young woman, wholly mortal, who studied Divination at **Illoren**, rising remarkably quickly to Archmage of Divination — despite this gift, she never foresaw the city's own fall."}, {"id": "z5davf", "kind": "bullet", "sub": [], "text": "Cast beyond the Material Plane into the Inbetween, into her own sealed pocket known as **the Garden** — which has since become the energy source fueling all elemental bonds in the world."}, {"id": "12bkhmp", "kind": "bullet", "sub": [], "text": "**Created the Stormwall** during her ascension, walling off the region now called Vaelena from the greater world (Atrea) while she worked out the finer details of controlling her power. The wall has outlived her active presence and still stands, maintained by no one."}]}, {"dm": false, "heading": "Skills & Abilities", "id": "1t48e0e", "items": [{"id": "1gd5qxd", "kind": "bullet", "sub": [], "text": "Formerly mortal-level Divination magic of exceptional skill."}, {"id": "dimki2", "kind": "bullet", "sub": [], "text": "Following her ascension: command over all five elements"}, {"id": "1djt2au", "kind": "bullet", "sub": [], "text": "Bearer of the Dawn Crown"}]}, {"dm": false, "heading": "Current Status", "id": "hpv7cp", "items": [{"id": "2axhg4", "kind": "bullet", "sub": [], "text": "Bound within the Garden, unable to directly influence the material plane."}, {"id": "1teey0q", "kind": "bullet", "sub": [], "text": "Worshipped across Vaylena as \"the Mother,\" under an identity entirely fabricated by the very man who helped end her reign."}]}], "theme": "Radiance"}, {"at": {"map": "world", "x": 1767, "y": 1291}, "circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "group": "Cities & Towns", "headline": "Valyon", "houseGroup": null, "id": "valyon", "kind": "place", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Ferran", "dmOnly": false, "facts": [{"id": "1qqpr6b", "label": "Species/Heritage", "text": "Ferran"}, {"id": "1tuflb2", "label": "Current Residence/Affiliation", "text": "Valyon — Ferran agent working with the Office of Central Intelligence"}], "fullBody": {"alt": "Vanessa Dai'lannis leaning on a motorcycle, rifle in hand", "h": 900, "src": "img/vn3hxb-full.jpg", "w": 900}, "fullName": null, "gallery": [], "headline": "Vanessa Dai'lannis", "id": "vanessa-dailannis", "names": [], "pc": false, "portrait": {"alt": "Vanessa Dai'lannis, head and shoulders", "h": 600, "src": "img/vn3hxb-head.jpg", "w": 480}, "sections": [{"dm": false, "heading": "Overview", "id": "k4io7n", "items": [{"id": "r5jda9", "kind": "bullet", "sub": [], "text": "An openly known Ferran agent working with the OCI in Valyon, one of the Ferrans who openly claim no loyalty to Ferrena."}, {"id": "1amxqx5", "kind": "bullet", "sub": [], "text": "Has been active in Valyon, off and on, for around two years."}, {"id": "o4zeg6", "kind": "bullet", "sub": [], "text": "Introduced to the party by Jack Sycabel, a high-ranking OCI agent and Handler."}]}, {"dm": false, "heading": "Skills & Abilities", "id": "ypjv4t", "items": [{"id": "ygo2jk", "kind": "bullet", "sub": [], "text": "An exceptional marksman."}, {"id": "erwt4z", "kind": "bullet", "sub": [], "text": "A hyper-lethal knife fighter."}]}, {"dm": false, "heading": "In The Oci", "id": "1myv1d5", "items": [{"id": "1wgri8s", "kind": "bullet", "sub": [], "text": "Works with Jack Sycabel, an OCI Handler."}]}], "theme": "Reaver"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "73nd6n", "label": "Age (year 847)", "text": "About 17"}, {"id": "1y4za4c", "label": "Species/Heritage", "text": "Unconfirmed"}, {"id": "105uf9r", "label": "Nation/Culture of Origin", "text": "Unknown to him. Raised in Vaylena from about age 12."}, {"id": "j3p0cn", "label": "Current Residence/Affiliation", "text": "Enlisted soldier of Vaylen Central Command."}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Vaxus Vulcano", "id": "vaxus-vulcano", "names": [], "pc": true, "portrait": null, "sections": [{"dm": false, "heading": "Appearance", "id": "1jwp4tj", "items": [{"id": "1nptc5v", "kind": "bullet", "sub": [], "text": "Wears a winter coat given to him by Alfred \"Donny\" Donner, who died of hypothermia on the way to Fort Galthis."}]}, {"dm": false, "heading": "Heritage & Bloodline", "id": "f76zyj", "items": [{"id": "7b1a7p", "kind": "bullet", "sub": [], "text": "**Elemental bond**: Fire (Flameborn)."}]}, {"dm": false, "heading": "Background", "id": "18nbnol", "items": [{"id": "17rhp4j", "kind": "bullet", "sub": [], "text": "He remembers his name, and everything from the moment he woke in a wrecked wagon on the frozen River Drolta."}, {"id": "17cu9wn", "kind": "para", "sub": [], "text": "**Leo and Donny**"}, {"id": "15zufu6", "kind": "bullet", "sub": [], "text": "Two Vaylen soldiers, Leo Kristoff and Alfred \"Donny\" Donner, were scouting from across the river and saw the crash. They fought the soldiers off alongside him, and decided to take the boy back to Fort Galthis for help."}, {"id": "dgokfj", "kind": "bullet", "sub": [], "text": "The blizzard worsened on the way. Donny gave Vaxus his jacket, already knowing his own condition was too far gone. He died of hypothermia on the way. Leo and Vaxus reached Galthis alone."}, {"id": "qb7cj4", "kind": "para", "sub": [], "text": "**Fort Galthis**"}, {"id": "bp6oor", "kind": "bullet", "sub": [], "text": "Leo gave him to the healers of the Clerist Corps. A healer named **Lillian Eigress** took charge of him. About a month passed in her care while he recovered his strength and his bearings."}, {"id": "1fj1vpd", "kind": "bullet", "sub": [], "text": "Over the next year Leo became his mentor, teaching him basic military regimen and trying to instill discipline. Vaxus asked Leo for stories from the front whenever he saw him."}, {"id": "6hy7zd", "kind": "para", "sub": [], "text": "**The capital**"}, {"id": "jzk94k", "kind": "bullet", "sub": [], "text": "After about a year, conditions on the front had shifted enough to send him back to the capital. Leo placed him in an orphanage, and then Leo was posted to the capital himself."}, {"id": "pu04xi", "kind": "bullet", "sub": [], "text": "Leo found him not fitting in at the orphanage, which was Church-funded and pushed Church teaching. He took Vaxus into his own care in the Central Command headquarters barracks, and used his spare time to train him as a soldier."}, {"id": "yakf6w", "kind": "bullet", "sub": [], "text": "Vaxus enlisted at 16 and went to boot camp."}, {"id": "xol88k", "kind": "bullet", "sub": [], "text": "Leo was the final instructor assigned to teach the new team to function together. Leo was killed months before the current timeline defending the party from a Ferran attacker, later identified as **Eldaenia Sarlei**."}]}, {"dm": false, "heading": "Relationships", "id": "1d4d9nk", "items": [{"id": "1bg42ev", "kind": "bullet", "sub": [], "text": "**Leo Kristoff (deceased)**: Rescuer, mentor and the nearest thing to a father."}, {"id": "178krmq", "kind": "bullet", "sub": [], "text": "**Alfred \"Donny\" Donner (deceased)**: Gave his life and his coat."}, {"id": "a39uu7", "kind": "bullet", "sub": [], "text": "**Lillian Eigress**: Clerist Corps healer who cared for him at Galthis."}, {"id": "1ritx9x", "kind": "bullet", "sub": [], "text": "**Thane Khavren**: Knight-Commander. First met at the tent in Galthis."}, {"id": "1p1r8g4", "kind": "bullet", "sub": [], "text": "**Anaria Sherridan**: First seen at Galthis."}, {"id": "1olo212", "kind": "bullet", "sub": [], "text": "**Fen**: Anaria's wolf companion; friendly to him at Galthis."}, {"id": "1my2nn2", "kind": "bullet", "sub": [], "text": "**Taelan Valdis**: Brief encounter."}, {"id": "i86acq", "kind": "bullet", "sub": [], "text": "**Volkira**: A Spirit tied to his Flame Bond"}, {"id": "d5ubb5", "kind": "bullet", "sub": [], "text": "**Killian Watts**: Team Member"}, {"id": "1r1oj6j", "kind": "bullet", "sub": [], "text": "**Wynn Chester Gunn**"}]}, {"dm": false, "heading": "Skills & Abilities", "id": "1cs09ig", "items": [{"id": "1p4kb6f", "kind": "bullet", "sub": [], "text": "Fire (Flameborn) bond."}, {"id": "j5uqod", "kind": "bullet", "sub": [], "text": "Basic soldier's training from Leo"}]}], "theme": "Flameborn"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1biu25h", "label": "Type", "text": "Semi-militant institution and officer corps"}, {"id": "t7ycgs", "label": "Leader", "text": "Knight-Commander Thane Khavren"}, {"id": "z8dw6", "label": "Headquarters", "text": "Central, Valyon; head operations moving to Keep Al'geth"}], "fullBody": null, "fullName": null, "gallery": [], "group": "Government & Military", "headline": "Vaylen Central Command", "houseGroup": null, "id": "vaylen-central-command", "kind": "faction", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "17xrhbt", "items": [{"id": "cmt9pc", "kind": "bullet", "sub": [], "text": "The first of the three civic branches founded in the roughly five-year power vacuum after the old regency council collapsed."}, {"id": "5z6zbx", "kind": "bullet", "sub": [], "text": "Built from Central University's **Vanguard Initiative**, whose members became a formal officer corps; admission was opened to common people alongside University graduates."}, {"id": "1lvx08v", "kind": "bullet", "sub": [], "text": "At the start of the war, a draft was instituted for element-bound people aged 16 and up. Draftees are brought to the capital for boot camp: about 6 to 9 months of combat training, fitness conditioning and elemental bond training."}, {"id": "eaersk", "kind": "bullet", "sub": [], "text": "Any unit the Knight-Commander formally commissions serves under him."}, {"id": "1xyuysl", "kind": "bullet", "sub": [], "text": "Anaria Sherridan has invited Central Command to move its head operations to Keep Al'geth, to ease information and supply chains."}]}, {"dm": false, "heading": "Units", "id": "ggj6wt", "items": [{"id": "iy9zi", "kind": "bullet", "sub": [], "text": "**The Vanguard** — first-generation members are registered with a prefix letter matching t async function save(){
  if(!db) return; if(saving){pending=true;return} saving=true;
  try{ await db.doc('reveal/state').set({ids:[...rev]}) }catch(err){ toast('Couldn’t save that change. Try again.') }
  saving=false; if(pending){pending=false; save()}
}
/* Player Edition: this same page, with the player copy baked in and no Claude connection. */
async function exportPlayer(btn){
  const dl=await claude.use('downloads');
  if(!dl){ toast('Exporting isn’t available in this view.'); return }
  btn.disabled=true; btn.textContent='BUILDING…';
  try{
    buildMask(); const entries=JSON.parse(JSON.stringify((LX||[]).map(project).filter(Boolean)));
    for(const e of entries) for(const im of [e.portrait,e.fullBody,...(e.gallery||[])].filter(Boolean)){
      const blob=await (await fetch(im.src)).blob();
      im.src=await new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(blob)});
    }
    const stamp=new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
    const page=await (await fetch('./index.html')).text();
    const data=JSON.stringify({entries,exportedAt:stamp}).replace(/</g,'\\u003c');
    const i=page.indexOf('<script>');
    const out=page.slice(0,i)+`<script>window.CODEX_STATIC=${data}<\/script>\n`+page.slice(i);
    await dl.save({filename:'vaelena-codex-players.html',data:out});
    toast(`Exported ${entries.length} revealed ${entries.length===1?'entry':'entries'}`);
  }catch(err){ toast('The export didn’t finish. Try again.') }
  btn.disabled=false; btn.textContent='⇩ EXPORT PLAYER EDITION';
}
function saveEdits(){ if(!db) return; const snap=JSON.parse(JSON.stringify(EDITS)); queue(()=>db.doc('edits/main').set(snap)) }
async function saveSettings(){ if(!db) return; try{ await db.doc('settings/main').set({themes,pins}) }catch(err){ toast('Couldn’t save settings.') } }
let dirty=new Set(), pubTimer=null;
function publish(ids){ ids.forEach(i=>{ dirty.add(i); const e=(LX||[]).find(x=>x.id===i); if(!e) return; if(e.aliasOf) dirty.add(e.aliasOf); aliasesOf(e).forEach(a=>dirty.add(a.id)) }); clearTimeout(pubTimer); pubTimer=setTimeout(flushPub,700) }
function flushPub(){
  if(!db||!LORE) return; const ids=[...dirty]; dirty.clear();
  queue(async()=>{
    for(const id of ids){ buildMask(); const e=(LX||[]).find(x=>x.id===id); if(!e) continue; const p=project(e);
      const pid=pubId(e); if(pid!==id) await db.doc('pub/'+id).delete(); if(p) await db.doc('pub/'+pid).set(JSON.parse(JSON.stringify(p))); else await db.doc('pub/'+pid).delete(); }
    await db.doc('pub-meta/index').set({builtAt:META.builtAt,v:PUB_V});
  });
}
const entryOf=id=>id.split('/')[0];
function setRev(ids,on){ ids.forEach(id=>on?rev.add(id):rev.delete(id)); render(); save(); publish(ids.some(i=>i.includes('/name/'))?(LX||[]).map(e=>e.id):[...new Set(ids.map(entryOf))]) }

app.addEventListener('click',ev=>{
  const mm=ev.target.closest('[data-focus]'); if(mm){ AV.focus=mm.dataset.focus }
  const b=ev.target.closest('[data-act]'); if(!b||b.tagName==='SELECT') return;
  const {act,id}=b.dataset;
  if(act==='toggle') setRev([id],!R(id));
  else if(act==='export'){ exportPlayer(b) }
  else if(act==='editmode'){ editMode=!editMode; editing=null; render() }
  else if(act==='edit'){ editing=id; render(); const t=document.getElementById('ed'); if(t){t.focus(); t.setSelectionRange(t.value.length,t.value.length)} }
  else if(act==='cancel-edit'){ editing=null; render() }
  else if(act==='save-edit'){ const v=document.getElementById('ed').value.trim(); const T=EDITS.text||(EDITS.text={});
    const addedSec=Object.keys(EDITS.added||{}).find(k=>EDITS.added[k].some(a=>a.id===id));
    if(addedSec){ if(!v){ EDITS.added[addedSec]=EDITS.added[addedSec].filter(a=>a.id!==id); delete T[id] } else T[id]={t:v,base:''} }
    else { const o=origOf(id); if(!v||v===o) delete T[id]; else T[id]={t:v,base:o} }
    editing=null; render(); saveEdits(); publish([entryOf(id)]) }
  else if(act==='revert'){ delete (EDITS.text||{})[id]; editing=null; render(); saveEdits(); publish([entryOf(id)]) }
  else if(act==='add-line'){ const nid=id+'/x-'+Date.now().toString(36); (EDITS.added||(EDITS.added={}))[id]=[...(EDITS.added[id]||[]),{id:nid,text:''}]; open[id]=true; editing=nid; render(); saveEdits(); const t=document.getElementById('ed'); if(t) t.focus() }
  else if(act==='del-line'){ for(const k of Object.keys(EDITS.added||{})) EDITS.added[k]=EDITS.added[k].filter(a=>a.id!==id); delete (EDITS.text||{})[id]; editing=null; render(); saveEdits(); publish([entryOf(id)]) }
  else if(act==='group'){ closedGroups=closedGroups.includes(id)?closedGroups.filter(x=>x!==id):[...closedGroups,id]; try{localStorage.setItem('codex-closed',JSON.stringify(closedGroups))}catch(e){} render() }
  else if(act==='open'){ open[id]=!(open[id]??false); render() }
  else if(act==='all'||act==='none'){ const s=LX.flatMap(e=>e.sections).find(x=>x.id===id); setRev([s.id,...s.items.flatMap(i=>[i.id,...detailIds(i.id,splitItem(i.text,s.heading),i.sub)])],act==='all') }
  else if(act==='mode'){ mode=id; try{localStorage.setItem('codex-mode',mode)}catch(e){} render() }
  else if(act==='map-names'){ AV.names=!AV.names; render() }
  else if(act==='pin'){ pins=pins.includes(id)?pins.filter(x=>x!==id):[...pins,id]; render(); saveSettings() }
});
app.addEventListener('change',ev=>{ const s=ev.target.closest('select[data-act=theme]'); if(s){ themes[s.dataset.id]=s.value; render(); saveSettings(); publish([s.dataset.id]) } });
app.addEventListener('input',ev=>{ if(ev.target.id==='q'){ q=ev.target.value; render() } else if(ev.target.id==='sq'){ sq=ev.target.value; render() } });
matchMedia('(min-width:1000px)').addEventListener('change',()=>render());
/* Each list page remembers where it was scrolled, so backing out of an entry lands where you left off. Entries and the Atlas open at the top. */
const SCROLL={}; let lastHash=location.hash.slice(1)||'home';
try{Object.assign(SCROLL,JSON.parse(sessionStorage.getItem('codex-scroll')||'{}'))}catch(e){}
const keepsPlace=h=>!h.startsWith('c-')&&!h.startsWith('atlas');
addEventListener('hashchange',()=>{
  const side=document.querySelector('.side');
  SCROLL[lastHash]=scrollY; if(side) SCROLL['side:'+lastHash]=side.scrollTop;
  try{sessionStorage.setItem('codex-scroll',JSON.stringify(SCROLL))}catch(e){}
  const h=location.hash.slice(1)||'home'; lastHash=h;
  const sideY=side?side.scrollTop:0;
  scrollTo(0,0); render();
  const y=keepsPlace(h)?(SCROLL[h]||0):0;
  scrollTo(0,y); requestAnimationFrame(()=>scrollTo(0,y));
  const ns=document.querySelector('.side'); if(ns) ns.scrollTop=sideY;
});

async function importSeed(){
  let seed=null;
  try{ const r=await fetch('./seed.json'); if(r.ok) seed=await r.json() }catch(e){}
  if(!seed) return false;
  if(META&&META.builtAt>=seed.builtAt) return false;
  status='Importing your lore into protected storage…'; render();
  for(const e of seed.entries) await db.doc('lore/'+e.id).set(e);
  const keep=new Set(seed.entries.map(e=>e.id));
  if(LORE) for(const e of LORE) if(!keep.has(e.id)) await db.doc('lore/'+e.id).delete();
  META={builtAt:seed.builtAt,changes:seed.changes,defaultThemes:seed.defaultThemes};
  await db.doc('lore-meta/index').set(META);
  toast(`Imported ${seed.entries.length} entries`);
  return true;
}
function startDM(){
  const timer=setTimeout(()=>{ if(!LORE){ status='Still loading your lore… If this persists, reload the page.'; render() } },10000);
  let pubMeta=null, gotPub=false, refreshed=false;
  const maybeRefresh=()=>{ if(refreshed||!LORE||!META||!gotPub) return; if(!pubMeta||pubMeta.builtAt!==META.builtAt||pubMeta.v!==PUB_V){ refreshed=true; publish(LORE.map(e=>e.id)) } };
  db.doc('pub-meta/index').onSnapshot(s=>{ if(s.metadata&&s.metadata.fromCache) return; pubMeta=s.exists?s.data():null; gotPub=true; maybeRefresh() });
  db.doc('lore-meta/index').get().then(async s=>{
    META=s.exists?s.data():null;
    try{ await importSeed() }catch(err){ toast('The import didn’t finish. Reload to try again.') }
    if(!META){ clearTimeout(timer); loadErr='No lore has been synced yet. Ask Claude in the Shattered Realms project to “sync the Codex.”'; render(); return }
    db.collection('lore').onSnapshot(qs=>{ clearTimeout(timer); LORE=qs.docs.map(d=>d.data()); if(!Object.keys(open).length) LORE.forEach(e=>{ if(e.sections[0]) open[e.sections[0].id]=true }); render(); maybeRefresh() },
      ()=>{ clearTimeout(timer); loadErr='Your lore couldn’t be loaded. Reload to try again.'; render() });
    db.doc('lore-meta/index').onSnapshot(s=>{ if(s.exists){ META=s.data(); render(); maybeRefresh() } });
  });
  db.doc('reveal/state').onSnapshot(s=>{ const v=s.exists?s.data():null; if(v&&Array.isArray(v.ids)&&!saving&&!pending) rev=new Set(v.ids); render() });
  db.doc('edits/main').onSnapshot(s=>{ if(editing) return; const v=s.exists?s.data():null; EDITS=v?JSON.parse(JSON.stringify(v)):{text:{},added:{}}; if(!EDITS.text) EDITS.text={}; if(!EDITS.added) EDITS.added={}; render() });
  db.doc('settings/main').onSnapshot(s=>{ const v=s.exists?s.data():null; if(v){ themes={...(v.themes||{})}; pins=[...(v.pins||[])] } render() });
}
function startPlayer(){
  const timer=setTimeout(()=>{ if(!PUB){ status='Still opening the Codex… If this persists, reload the page.'; render() } },10000);
  db.collection('pub').onSnapshot(qs=>{ clearTimeout(timer); PUB=qs.docs.map(d=>d.data()); render() },
    ()=>{ clearTimeout(timer); loadErr='The Codex couldn’t be loaded. Reload to try again.'; render() });
}
(async()=>{
  if(window.CODEX_STATIC){ canDM=false; mode='player'; PUB=window.CODEX_STATIC.entries; render(); return }
  const user=await claude.use('user');
  canDM=!!user&&(!!(await user.canEdit())||!!(await user.isOwner()));
  if(!canDM) mode='player';
  db=await claude.use('db');
  if(!db){ loadErr='The Codex needs you to be signed in to claude.ai to open.'; render(); return }
  if(canDM) startDM(); else startPlayer();
})();
}
