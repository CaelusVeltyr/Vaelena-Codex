 "Fella Telsan", "id": "fella-telsan", "names": [], "pc": false, "portrait": {"alt": "Fella Telsan, head and shoulders", "h": 600, "src": "img/18frb2w-head.jpg", "w": 480}, "sections": [{"dm": false, "heading": "Overview", "id": "97f0x6", "items": [{"id": "6v9c8z", "kind": "bullet", "sub": [], "text": "A student at Central University for the Gifted and a member of Team Everbright, one of the three dominant teams of the 24th Division, alongside Team Veloce and Team Montaine."}, {"id": "1cf72lg", "kind": "bullet", "sub": [], "text": "A skilled longsword fighter."}, {"id": "14d3ksd", "kind": "bullet", "sub": [], "text": "Often seen with her teammate Macky Sarlo."}]}], "theme": "Cirtenos Silver"}, {"circle": false, "culture": "Companion", "dmOnly": false, "facts": [{"id": "1xjz1yb", "label": "Species/Heritage", "text": "Wolf"}, {"id": "1ipwi1a", "label": "Current Residence/Affiliation", "text": "Anaria's companion (deceased)"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Fenthri \"Fen\"", "id": "fenthri-fen", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Steelforged"}, {"circle": false, "culture": "Elemental", "dmOnly": false, "facts": [{"id": "9op4pf", "label": "Element", "text": "Fire"}, {"id": "12fabgt", "label": "Primarch", "text": "Vallesari"}, {"id": "izoqj0", "label": "Season", "text": "Summer"}, {"id": "nrlytc", "label": "Church Ministry", "text": "The Ministry of War"}], "fullBody": null, "fullName": null, "gallery": [], "group": "The Five Lineages", "headline": "Flameborn", "houseGroup": null, "id": "flameborn", "kind": "system", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "1tc2lvh", "items": [{"id": "1vood94", "kind": "bullet", "sub": [], "text": "The common name for those bonded to Fire."}, {"id": "bj74rn", "kind": "bullet", "sub": [], "text": "Vallesari's holy line runs through her son Vallesand and his twins, splitting roughly 900 years ago into the **Veloce** and **Sherridan** families, two of Vaylena's oldest Flameborn bloodlines."}]}, {"dm": false, "heading": "Known Bearers", "id": "1htprkm", "items": [{"id": "10fys4w", "kind": "bullet", "sub": [], "text": "**Anaria Kresanthe Sherridan**"}, {"id": "1hpmga7", "kind": "bullet", "sub": [], "text": "**Ashalia Sherridan** — her fire burns dark, an early example of the Shadowtouched."}, {"id": "gzurek", "kind": "bullet", "sub": [], "text": "**Elise Veloce** — Flameborn instructor at Central University."}, {"id": "19zw6u", "kind": "bullet", "sub": [], "text": "**Toran Veloce** — gave his bond to Corey as he died."}, {"id": "h1sju5", "kind": "bullet", "sub": [], "text": "**Corey Tyran Veloce** — received Toran's bond."}, {"id": "76os7n", "kind": "bullet", "sub": [], "text": "**Alisa Tyran Veloce** — inherited her father's bond."}, {"id": "qxdcyz", "kind": "bullet", "sub": [], "text": "**Vaxus Vulcano** — Fire bond."}]}], "theme": "Flameborn"}, {"at": {"map": "world", "x": 1798, "y": 744}, "circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "group": "Forts & Outposts", "headline": "Fort Galthis", "houseGroup": null, "id": "fort-galthis", "kind": "place", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"at": {"map": "world", "x": 1308, "y": 1112}, "circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "group": "Forts & Outposts", "headline": "Fort Halyn", "houseGroup": null, "id": "fort-halyn", "kind": "place", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1e4fio3", "label": "Current Residence/Affiliation", "text": "The Wardens — first recruit; younger brother of Alfred \"Donny\" Donner"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Frederic \"Fred\" Donner", "id": "frederic-fred-donner", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Tidewatcher"}, {"circle": false, "culture": "Ferran", "dmOnly": false, "facts": [{"id": "10b2fwg", "label": "Metal", "text": "Silver"}, {"id": "s4bx9c", "label": "Historical Role", "text": "Commerce, trade, banking, fine craftsmanship"}], "fullBody": null, "fullName": null, "gallery": [], "group": null, "headline": "House Cirtenos", "houseGroup": "Great House", "id": "house-cirtenos", "kind": "house", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Cirtenos Silver"}, {"circle": false, "culture": "Ferran", "dmOnly": false, "facts": [{"id": "122md2a", "label": "Metal", "text": "Tin"}, {"id": "u803re", "label": "Historical Role", "text": "Craftsmanship and invention"}], "fullBody": null, "fullName": null, "gallery": [], "group": null, "headline": "House Farlos", "houseGroup": "Great House", "id": "house-farlos", "kind": "house", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Farlos Tin"}, {"circle": false, "culture": "Ferran", "dmOnly": false, "facts": [{"id": "7xhrhu", "label": "Metal", "text": "Brass"}, {"id": "nudxoa", "label": "Historical Role", "text": "Craftsmanship and invention"}], "fullBody": null, "fullName": null, "gallery": [], "group": null, "headline": "House Jurn", "houseGroup": "Great House", "id": "house-jurn", "kind": "house", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Jurn Brass"}, {"circle": false, "culture": "Ferran", "dmOnly": false, "facts": [{"id": "10669xm", "label": "Metal", "text": "Copper"}, {"id": "14xorhu", "label": "Historical Role", "text": "Craftsmanship and invention"}], "fullBody": null, "fullName": null, "gallery": [], "group": null, "headline": "House Nersi", "houseGroup": "Great House", "id": "house-nersi", "kind": "house", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Nersi Copper"}, {"circle": false, "culture": "Ferran", "dmOnly": false, "facts": [{"id": "13rn8b5", "label": "Metal", "text": "Iron"}, {"id": "nui9hp", "label": "Historical Role", "text": "Warriors"}, {"id": "147wll0", "label": "Head", "text": "Makaen Sarlei"}, {"id": "k60l4k", "label": "Status", "text": "In favor with the Raven, following its conspiracy against House Tyran"}], "fullBody": null, "fullName": null, "gallery": [], "group": null, "headline": "House Sarlei", "houseGroup": "Great House", "id": "house-sarlei", "kind": "house", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "93gmxs", "items": [{"id": "47ojvp", "kind": "para", "sub": [], "text": "House Sarlei is a Ferran house of iron affinity, historically rivals of House Tyran. In the current era, under Makaen Sarlei's leadership, the House has been pushed toward greater violence and brutality, positioning itself as The Raven's preferred instrument of force within the Circle's operations."}]}, {"dm": false, "heading": "Lineage", "id": "11dxkr0", "items": [{"id": "1alb5sn", "kind": "bullet", "sub": ["**Eldaenia Sarlei** — daughter."], "text": "**Makaen Sarlei** — current Houselord."}]}, {"dm": false, "heading": "Members", "id": "4fn1du", "items": [{"id": "1rb0fzy", "kind": "subhead", "sub": [], "text": "Makaen Sarlei (Houselord)"}, {"id": "18l8frn", "kind": "bullet", "sub": [], "text": "As Houselord, actively pushes House Sarlei to remain violent and brutal, and personally desires the House to become The Raven's main instrument of force within the Circle."}, {"id": "18s9n21", "kind": "subhead", "sub": [], "text": "Eldaenia Sarlei (daughter)"}, {"id": "18a26me", "kind": "bullet", "sub": [], "text": "Daughter of Makaen Sarlei and an unnamed partner."}]}], "theme": "Sarlei Iron"}, {"circle": false, "culture": "Ferran", "dmOnly": false, "facts": [{"id": "o2lbfl", "label": "Metal", "text": "Steel"}, {"id": "1l62i2l", "label": "Historical Role", "text": "Warriors"}, {"id": "jf8tlr", "label": "Seat", "text": "Celathren"}, {"id": "1jhm2ck", "label": "Status", "text": "Subjugated by the Raven, in conspiracy with House Sarlei"}], "fullBody": null, "fullName": null, "gallery": [], "group": null, "headline": "House Tyran", "houseGroup": "Great House", "id": "house-tyran", "kind": "house", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "lduwhc", "items": [{"id": "pk4on", "kind": "bullet", "sub": [], "text": "One of Ferrena's two warrior houses, historically rivals of House Sarlei."}, {"id": "yvoo5d", "kind": "bullet", "sub": [], "text": "Ruled from Celathren, until a conspiracy between House Sarlei and the Circle (the Raven) subjugated the house."}, {"id": "135au37", "kind": "bullet", "sub": [], "text": "**The Celathren Bladebreakers** are the house's household guard, and the **Tyrani Bladebreaker** combat style is its own."}, {"id": "rt2x6b", "kind": "bullet", "sub": [], "text": "**The Steel Watch** was typically headed and served in by the women of House Tyran. One of its objectives was observation. It has since been recreated as the Coven and is no longer exclusive to House Tyran."}]}, {"dm": false, "heading": "Members", "id": "16hp9te", "items": []}, {"dm": false, "heading": "Minor Houses", "id": "1u1irdq", "items": [{"id": "13ogbls", "kind": "bullet", "sub": [], "text": "**Kresanthe** Makes weapons for the Bladebreakers and keeps the traditions and metals of older, vanished houses, including how to forge titanium, used for ceremonial daggers for Houselords and other important figures."}, {"id": "ifung", "kind": "bullet", "sub": [], "text": "**Taldain** — historically in service to the Steel Watch."}, {"id": "1weo1wi", "kind": "bullet", "sub": [], "text": "**Toldesh**"}, {"id": "s60p6u", "kind": "bullet", "sub": [], "text": "**Telsan** — funneled women into the Steel Watch, as House Tyran did, and served House Tyran as covert information-gatherers."}]}], "theme": "Steelforged"}, {"circle": false, "culture": "Ferran", "dmOnly": false, "facts": [{"id": "1b8g16f", "label": "Metal", "text": "Gold"}, {"id": "12la9jn", "label": "Historical Role", "text": "Commerce, trade, banking"}, {"id": "1mspf9y", "label": "Head", "text": "Houselady Balosi Vortan"}, {"id": "xnmi8l", "label": "Seat", "text": "Formerly Keep Al'geth; now Nexanthis, with House Jurn"}], "fullBody": null, "fullName": null, "gallery": [], "group": null, "headline": "House Vortan", "houseGroup": "Great House", "id": "house-vortan", "kind": "house", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "3hzt8e", "items": [{"id": "16wjtc8", "kind": "bullet", "sub": [], "text": "Governed from **Keep Al'geth**, the ancient fortress at the mouth of the River Drolta, which House Vortan kept as a personal residence with minimal personnel."}, {"id": "1nehyge", "kind": "bullet", "sub": [], "text": "Anaria Sherridan's Wardens infiltrated the keep through a Pre-Sundering tunnel system and routed House Vortan in a swift unseating."}, {"id": "18tlr5y", "kind": "bullet", "sub": [], "text": "**Balosi Vortan** relocated to Nexanthis with House Jurn."}]}, {"dm": false, "heading": "Members", "id": "vbp34c", "items": [{"id": "1pa145m", "kind": "bullet", "sub": [], "text": "**Balosi Vortan** — Houselady."}]}], "theme": "Vortan Gold"}, {"at": {"map": "world", "x": 2077, "y": 1181}, "circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "group": "Cities & Towns", "headline": "Hunter's Crick", "houseGroup": null, "id": "hunters-crick", "kind": "place", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "headline": "Jack Sycabel", "id": "jack-sycabel", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Embershade"}, {"at": {"map": "world", "x": 1213, "y": 973}, "circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "group": "Forts & Outposts", "headline": "Keep Al'geth", "houseGroup": null, "id": "keep-algeth", "kind": "place", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "mzif1p", "label": "Species/Heritage", "text": "Human"}, {"id": "sctb1k", "label": "Current Residence/Affiliation", "text": "Father of Wynn Chester Gunn"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Kentucky Luger", "id": "kentucky-luger", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Jurn Brass"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "6j3a4o", "label": "Age (year 847)", "text": "19"}, {"id": "1kx7zaz", "label": "Species/Heritage", "text": "Human — Stormcaller (Electric) bond."}, {"id": "hb2gus", "label": "Nation/Culture of Origin", "text": "Vaylena *(location of the Watts estate: open)*"}, {"id": "ii2i12", "label": "Current Residence/Affiliation", "text": "Vaylen Central Command"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Killian Watts", "id": "killian-watts", "names": [], "pc": true, "portrait": null, "sections": [{"dm": false, "heading": "Appearance", "id": "1shraoq", "items": [{"id": "1hbofro", "kind": "bullet", "sub": [], "text": "Tall at 5'11\", with an athletic, muscular build."}, {"id": "ffcy73", "kind": "bullet", "sub": [], "text": "Short white hair, likely natural, or possibly minorly stress-bleached from his use of his ability."}, {"id": "1v50rg2", "kind": "bullet", "sub": [], "text": "Blue eyes."}]}, {"dm": false, "heading": "Heritage & Bloodline", "id": "1k2n3le", "items": [{"id": "3n1zz0", "kind": "bullet", "sub": [], "text": "**Mother**: Millicent Watts, killed in the Night of Metal and Blood."}, {"id": "ogx7dp", "kind": "bullet", "sub": [], "text": "**Father**: Not known to him."}, {"id": "10gumav", "kind": "bullet", "sub": [], "text": "**Adoptive parents**: Reghen Nightlake and Livinna Watts (Millicent's sister), who head the Watts house."}, {"id": "1qr2tku", "kind": "bullet", "sub": [], "text": "**Elemental bond**: Stormcaller (Electric)."}, {"id": "1dubeix", "kind": "bullet", "sub": [], "text": "Cousin, by the Nightlake/Watts marriage, to **Tae'linna Graeven Nightlake**, with whom he grew up as if siblings."}]}, {"dm": false, "heading": "Background", "id": "oljxpo", "items": [{"id": "1xtemdy", "kind": "para", "sub": [], "text": "**Early life with Millicent**"}, {"id": "142gkrv", "kind": "bullet", "sub": [], "text": "He never knew his father, who left before Killian was even named."}, {"id": "1cshe0k", "kind": "para", "sub": [], "text": "**Orphaned and adopted**"}, {"id": "1xs2n71", "kind": "bullet", "sub": [], "text": "Orphaned after Millicent's death, he was adopted by Reghen and Livinna Watts out of kindness. He grew up at the Watts estate."}, {"id": "4yrl4n", "kind": "bullet", "sub": [], "text": "Most of the Watts family treat him as the black sheep, because of his father \"running off.\" He is not terribly close with them, so he spends a very large amount of time at the Nightlake Estate."}, {"id": "6wz4fp", "kind": "bullet", "sub": [], "text": "He is somewhat close with Sorel Nightlake, and mostly with Tae'linna, and with Soren while he was alive."}, {"id": "1c2o5nr", "kind": "bullet", "sub": [], "text": "Livinna made sure he had tutors to teach him to use his Stormcaller bond before he was enrolled in the military. One of his tutors was Reghen, who taught him martial arts, so he was already familiar with combat to some degree."}, {"id": "7apzqh", "kind": "para", "sub": [], "text": "**Boot camp**"}, {"id": "u95xry", "kind": "bullet", "sub": [], "text": "Killian volunteered for the military, roughly a year ago, at about 18 *(derived)*. Boot camp was the same as for other recruits. There he formed friendships with **Wynn Gunn** and **Vaxus**."}]}, {"dm": false, "heading": "Relationships", "id": "8rpg5r", "items": [{"id": "1v611ya", "kind": "bullet", "sub": [], "text": "**Millicent Watts (mother, deceased)**"}, {"id": "cuthbp", "kind": "bullet", "sub": [], "text": "**Reghen Nightlake (adoptive father)**: One of his tutors, who taught him martial arts. They are not particularly close."}, {"id": "1h9mkpz", "kind": "bullet", "sub": [], "text": "**Livinna Watts (adoptive mother, aunt)** She is warm to him and sees much of her sister in him."}, {"id": "1515xql", "kind": "bullet", "sub": [], "text": "**Tae'linna Graeven Nightlake**: Cousin, and the person he is mostly close with. They grew up as if siblings."}, {"id": "e62cyp", "kind": "bullet", "sub": [], "text": "**Sorel Nightlake**"}, {"id": "1jkpyg3", "kind": "bullet", "sub": [], "text": "**Soren Graeven Nightlake (deceased)**: Close while he was alive."}, {"id": "1o6i5ab", "kind": "bullet", "sub": [], "text": "**The rest of the Watts family**: They treat him as the black sheep. He is not close with them."}, {"id": "1ygf2np", "kind": "bullet", "sub": [], "text": "**Wynn Gunn and Vaxus**: Friends from boot camp."}]}, {"dm": false, "heading": "Skills & Abilities", "id": "1x7j7dh", "items": [{"id": "11lmdji", "kind": "bullet", "sub": [], "text": "**Class**: Monk"}, {"id": "14swt2c", "kind": "bullet", "sub": [], "text": "**Training**: Martial arts tutoring; Stormcaller bond tutoring arranged by Livinna; then standard boot-camp training."}, {"id": "15g9e8b", "kind": "bullet", "sub": [], "text": "**Bond**: Stormcaller (Electric)."}]}], "theme": "Stormcaller"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1xr0m8v", "label": "Species/Heritage", "text": "Human"}, {"id": "1ubeaj6", "label": "Current Residence/Affiliation", "text": "Team Van Saun"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Koquet Thanatos", "id": "koquet-thanatos", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "The Raven"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1j2hbtl", "label": "Age (current timeline, year 847)", "text": "Early 50s"}, {"id": "1ioir7g", "label": "Species/Heritage", "text": "Human — Windrider (Air) bond"}, {"id": "1pflde7", "label": "Nation/Culture of Origin", "text": "Vaylena"}, {"id": "18s28xz", "label": "Current Residence/Affiliation", "text": "Central, Valyon — Director of the Office of Central Intelligence (OCI), which she founded"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Krystal Van Saun", "id": "krystal-van-saun", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Heritage & Bloodline", "id": "12eqeyz", "items": [{"id": "1v9p511", "kind": "bullet", "sub": [], "text": "**Elemental bond**: Windrider (Air) — archer."}, {"id": "1ayn8x", "kind": "bullet", "sub": [], "text": "From a wealthy Central family"}]}, {"dm": false, "heading": "Background", "id": "7mult1", "items": [{"id": "1b83mix", "kind": "bullet", "sub": [], "text": "Enrolled at Central University for the Gifted and was assigned to **Team Veloce** alongside Corey, Jack Sycabel, Nylah Duglass, and Koquet Thanatos."}, {"id": "1i2z6u7", "kind": "bullet", "sub": [], "text": "Developed unspoken romantic feelings for Corey over their first year together on the team."}, {"id": "1w2iw5", "kind": "bullet", "sub": [], "text": "**The gala confession**"}, {"id": "3fuzlp", "kind": "bullet", "sub": [], "text": "Eventually became good friends with Chloe despite the circumstances of how they met."}, {"id": "ie6n2x", "kind": "bullet", "sub": [], "text": "Grew close to Thane Khavren after Team Veloce and Team Montaine began competing against each other; he recognized in her the same quiet hurt he'd once seen in Chloe, and a romance began forming between them."}, {"id": "1mpxvhz", "kind": "bullet", "sub": [], "text": "**Leadership of Team Van Saun**: When Corey took a year's medical leave following his shattered arm, leadership of the team passed to Krys, recognized for a sharp gift for coordination and tactics. The team was renamed Team Van Saun in her honor. She retained leadership even after Corey's return at full strength in his fourth year, with Corey taking up the role of frontline striker under her command instead of reclaiming leadership himself."}, {"id": "8lcrj8", "kind": "bullet", "sub": [], "text": "Married Thane Khavren; the two had four children: Calyx, Theo, Zephyrus, and Amerys."}, {"id": "3x3bag", "kind": "bullet", "sub": [], "text": "**The founding of the OCI**: In the roughly five-year power vacuum following the regency council's collapse (which Team Van Saun and Team Montaine's investigation had caused), Krys helped create and became the founding head of the **Office of Central Intelligence** — Valyon's municipal and information-gathering branch, known over the years as **Director Van Saun**."}, {"id": "aqolgr", "kind": "bullet", "sub": [], "text": "**The Frostlake Expedition**: Remained behind on leave during the fateful 24th Division expedition 9 years before the current timeline, as she was pregnant with Amerys at the time."}]}, {"dm": false, "heading": "Personality", "id": "yu6hi3", "items": [{"id": "z3dzq5", "kind": "bullet", "sub": [], "text": "Quiet-spoken, but possesses a sharp, natural gift for coordination and tactics that became apparent under pressure."}, {"id": "4w61yi", "kind": "bullet", "sub": [], "text": "Capable of real emotional resilience — moved past heartbreak over Corey to build both a genuine friendship with Chloe and a lasting relationship with Thane."}]}, {"dm": false, "heading": "Relationships", "id": "dzz42o", "items": [{"id": "7zh1px", "kind": "bullet", "sub": [], "text": "**Thane Khavren** — husband; grew close during their University years as their teams competed against each other."}, {"id": "19f0d2b", "kind": "bullet", "sub": [], "text": "**Corey Tyran Veloce** — former teammate and unrequited early feelings; the two remain on good terms, with Corey serving under her leadership after his return to the team."}, {"id": "1lpq0q", "kind": "bullet", "sub": [], "text": "**Chloe Graeven Ardynet (deceased)** — became a close friend despite the painful circumstances of their first meeting."}, {"id": "s0gl5k", "kind": "bullet", "sub": [], "text": "**Calyx, Theo, Zephyrus, and Amerys** — her four children with Thane."}, {"id": "15qe13g", "kind": "bullet", "sub": [], "text": "**Nylah Duglass, Koquet Thanatos** — former Team Veloce/Van Saun teammates."}]}, {"dm": false, "heading": "Skills & Abilities", "id": "am3krs", "items": [{"id": "f3tx2q", "kind": "bullet", "sub": [], "text": "Windrider (Air) bond; skilled archer."}, {"id": "1r3ny48", "kind": "bullet", "sub": [], "text": "Sharp tactical and coordination instincts; effective team leader."}, {"id": "4x2a8g", "kind": "bullet", "sub": [], "text": "Founding administrator of the Office of Central Intelligence."}]}, {"dm": false, "heading": "Current Status", "id": "e6raaf", "items": [{"id": "sd3pbt", "kind": "bullet", "sub": [], "text": "Current Director of the Office of Central Intelligence."}, {"id": "qdovwl", "kind": "bullet", "sub": [], "text": "Married to Thane Khavren, Knight-Commander of Vaylen Central Command; mother to four children."}]}], "theme": "Windrider"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "fpkgrp", "label": "Current Residence/Affiliation", "text": "Vaylen Central Command soldier; Anaria's Northern Front squadmate and later Vaxus's mentor (deceased)"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Leo Kristoff", "id": "leo-kristoff", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "q905pj", "label": "Species/Heritage", "text": "Human"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Leslie Montaine", "id": "leslie-montaine", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Jurn Brass"}, {"circle": false, "culture": "Beyond", "dmOnly": false, "facts": [{"id": "grpjt1", "label": "Type", "text": "Rare ability"}, {"id": "1twkwp", "label": "Domain", "text": "Light, as a form of energy"}], "fullBody": null, "fullName": null, "gallery": [], "group": "Other Powers", "headline": "Lightbearers", "houseGroup": null, "id": "lightbearers", "kind": "system", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "qhplp5", "items": [{"id": "z4it33", "kind": "bullet", "sub": [], "text": "A rare ability, entirely independent of elemental bonds, allowing the manipulation of light as a form of energy."}, {"id": "j6ae7", "kind": "bullet", "sub": [], "text": "It can manifest in anyone, bonded or unbonded, but rarely manifests strongly. When it does, it is the source of most healing ability in the world."}, {"id": "pkfzd6", "kind": "bullet", "sub": [], "text": "The Church teaches that Lightbearer ability, like elemental bonds, comes only from the Mother's bloodline descendants."}]}], "theme": "Radiance"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1rnt5iu", "label": "Current Residence/Affiliation", "text": "Healer of the Clerist Corps at Fort Galthis"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Lillian Eigress", "id": "lillian-eigress", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Radiance"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1aybxnd", "label": "Current Residence/Affiliation", "text": "Head of the Watts house"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Livinna Watts", "id": "livinna-watts", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Stormcaller"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "48wbm3", "label": "Current Residence/Affiliation", "text": "House Veloce"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Lorelei Veloce", "id": "lorelei-veloce", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Flameborn"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "sugfn6", "label": "Current Residence/Affiliation", "text": "Central University for the Gifted, 24th Division"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Macky Sarlo", "id": "macky-sarlo", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "861p3r", "items": [{"id": "1mbdnmo", "kind": "bullet", "sub": [], "text": "A student at Central University for the Gifted and a member of Team Everbright, one of the three dominant teams of the 24th Division."}, {"id": "1w2dzrf", "kind": "bullet", "sub": [], "text": "Fights with a warhammer."}, {"id": "1k4ze3p", "kind": "bullet", "sub": [], "text": "Often seen with his teammate Fella Telsan."}]}], "theme": "Cirtenos Silver"}, {"circle": false, "culture": "Ferran", "dmOnly": false, "facts": [{"id": "1q9ykon", "label": "Species/Heritage", "text": "Ferran — House Sarlei (Iron affinity)"}, {"id": "1i9shsg", "label": "Nation/Culture of Origin", "text": "Ferrena"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Makaen Sarlei", "id": "makaen-sarlei", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Appearance", "id": "1qqtxc6", "items": [{"id": "19qd6xo", "kind": "bullet", "sub": [], "text": "Left hand crushed and right hand severed by Corey Tyran Veloce's Fire bond during the Frostlake massacre; part of his face burned in the same encounter. Carries these injuries permanently."}]}, {"dm": false, "heading": "Heritage & Bloodline", "id": "1rcq66u", "items": [{"id": "1kp0abx", "kind": "bullet", "sub": [], "text": "Of House Sarlei, one of Ferrena's iron-affinity warrior houses, historically rivals of House Tyran (though not yet hostile at the time of his University-era operations)."}, {"id": "1fc4mw9", "kind": "bullet", "sub": [], "text": "From \"a generally more violent house\" by his own culture's reputation — a trait he displayed clearly during the Frostlake massacre."}]}, {"dm": false, "heading": "Background", "id": "rwj7zs", "items": [{"id": "9svthl", "kind": "bullet", "sub": [], "text": "Presumably recovered (to whatever extent possible) from his injuries and returned to service within House Sarlei, though the process and aftermath are undeveloped."}]}, {"dm": false, "heading": "Personality", "id": "b0ja0o", "items": [{"id": "1pfxlqg", "kind": "bullet", "sub": [], "text": "Ruthlessly pragmatic and quick to violence when he perceives a threat to Ferran secrecy"}, {"id": "1yb7aq8", "kind": "bullet", "sub": [], "text": "Openly contemptuous of what he sees as weakness, as demonstrated by his disgust at Corey's instinct to protect Chloe rather than fight."}]}, {"dm": false, "heading": "Relationships", "id": "2q7ymb", "items": [{"id": "cqhprv", "kind": "bullet", "sub": [], "text": "**Reaver**; she saved his life after Corey maimed him, at real cost to herself (crippled leg, later the Raven's punishment and curse)."}, {"id": "13cnujz", "kind": "bullet", "sub": [], "text": "**Chloe Graeven Ardynet (deceased)** — killed by his hand during the Frostlake massacre."}, {"id": "dj3kof", "kind": "bullet", "sub": [], "text": "**House Sarlei** — his own house, historically rivals of House Tyran."}]}, {"dm": false, "heading": "Skills & Abilities", "id": "hvn6vt", "items": [{"id": "19ebz04", "kind": "bullet", "sub": [], "text": "Ferran combat ability with a warhammer."}, {"id": "13nnecs", "kind": "bullet", "sub": [], "text": "Ferran physical abilities/steel affinity, demonstrated in his lethal efficiency during the Frostlake massacre."}]}, {"dm": false, "heading": "Current Status", "id": "18r0mhi", "items": [{"id": "kaehbr", "kind": "bullet", "sub": [], "text": "Returned to House Sarlei following his injuries"}]}], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "5oizij", "label": "Current Residence/Affiliation", "text": "Watts family (deceased)"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Millicent Watts", "id": "millicent-watts", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Stormcaller"}, {"circle": true, "culture": "Ancient", "dmOnly": false, "facts": [{"id": "1vlupzf", "label": "Aliases / Other Names Used", "text": "The Raven (Circle moniker)"}, {"id": "mk1xzo", "label": "Nation/Culture of Origin", "text": "A now-vanished elder-age world"}, {"id": "1ol751i", "label": "Current Residence/Affiliation", "text": "Ferrena's shadows"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Morrigan Toreshk", "id": "morrigan-toreshk", "names": [{"id": "r4ohdw", "label": "Also known as", "value": "The Raven"}], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Relationships", "id": "2zjq8f", "items": [{"id": "1q2x1v1", "kind": "bullet", "sub": [], "text": "**House Tyran** — the house she architected the total subjugation of."}]}, {"dm": false, "heading": "Skills & Abilities", "id": "8mpxg5", "items": [{"id": "182l06b", "kind": "bullet", "sub": [], "text": "Decades of covert political and shadow-operation expertise across Ferrena."}]}, {"dm": false, "heading": "Current Status", "id": "1rux8r6", "items": [{"id": "15ptbt9", "kind": "bullet", "sub": [], "text": "Operating within the Circle as The Raven, wielding immense hidden influence across Ferrena's seven Houses."}]}], "theme": "The Raven"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "eq6vxk", "label": "Current Residence/Affiliation", "text": "Wynn Chester Gunn's grandmother"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Nonna", "id": "nonna", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Nersi Copper"}, {"at": {"map": "valyon", "x": 1514, "y": 882}, "circle": false, "culture": "Valyon", "dmOnly": false, "facts":
