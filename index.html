<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Vaelena Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* VOICE: a DM's leather-bound codex, read at the table.
   IDEA: the parchment character sheets Tracy already prints, turned into pages you tap.
   PICTURE: each entry's framed crest and double-ruled headline name.
   COLOUR and TYPE: parchment, maroon, red rule; Cinzel over EB Garamond; per-character themes swap the palette.
   LAYOUT: one centred column, 640px max, sticky top bar. */
:root{color-scheme:light}
.t-parchment{--bg:#F3E9D2;--card:#FBF5E6;--ink:#2B1D14;--muted:#6B5644;--accent:#7A1F1F;--rule:#9B2226;--line:#C9B28A;--on:#FBF5E6}
.t-embershade{--bg:#1C1717;--card:#2A2222;--ink:#EDE3D1;--muted:#B8A99A;--accent:#E07A45;--rule:#B5532A;--line:#5A3A2C;--on:#1C1717}
.t-dawnwarden{--bg:#2B0A0E;--card:#3C1116;--ink:#F4E7C8;--muted:#D4B98A;--accent:#E0B04A;--rule:#C08A2E;--line:#6E2A22;--on:#2B0A0E}
.t-dawnwarden .crest{background:radial-gradient(circle at 50% 35%,#4A161B,#2B0A0E);box-shadow:0 0 0 1px #C08A2E,0 6px 24px rgba(224,176,74,.18)}
.t-the-raven{--bg:#120D17;--card:#1E1626;--ink:#ECE4F2;--muted:#B6A8C4;--accent:#A985D6;--rule:#6E4A9A;--line:#3A2C4A;--on:#120D17}
.t-the-raven .portrait,.t-the-raven .crest{box-shadow:0 0 0 1px #6E4A9A,0 8px 30px rgba(110,74,154,.35)}
.t-shadowsong{--bg:#0B1215;--card:#13202A;--ink:#E2EEF0;--muted:#9FB8BE;--accent:#4FC1C9;--rule:#2A7F8C;--line:#22414A;--on:#0B1215}
.t-shadowsong .portrait,.t-shadowsong .crest{box-shadow:0 0 0 1px #2A7F8C,0 8px 30px rgba(79,193,201,.22)}
.t-reaver{--bg:#090C0A;--card:#111712;--ink:#E4EEE6;--muted:#A3B5A8;--accent:#39FF6A;--rule:#1FB84A;--line:#21352A;--on:#090C0A}
.t-reaver .portrait,.t-reaver .crest{box-shadow:0 0 0 1px #39FF6A,0 0 26px rgba(57,255,106,.35)}
.t-reaver h1{text-shadow:0 0 18px rgba(57,255,106,.35)}
.t-steelforged{--bg:#20252B;--card:#2B3138;--ink:#E6E9EC;--muted:#A9B2BB;--accent:#9FC1DD;--rule:#7C93A8;--line:#47525E;--on:#20252B}
.t-radiance{--bg:#FFF6D6;--card:#FFFBEA;--ink:#3A2C08;--muted:#7A6420;--accent:#8A5E00;--rule:#F2BE1A;--line:#EED67A;--on:#FFFBEA}
.t-radiance .crest{background:radial-gradient(circle at 50% 35%,#FFFDF0,#FFE98A);color:#8A5E00;box-shadow:0 0 0 1px #F2BE1A,0 0 26px rgba(255,214,60,.55)}
.t-radiance .portrait{box-shadow:0 0 0 1px #F2BE1A,0 0 30px rgba(255,214,60,.45)}
.t-radiance .card{box-shadow:0 0 18px rgba(255,214,60,.18)}
.t-eclipse{--bg:#100D06;--card:#1B160A;--ink:#F1E4B4;--muted:#B8A46A;--accent:#E9B52A;--rule:#A87A10;--line:#3A3015;--on:#100D06}
.t-eclipse .crest{background:radial-gradient(circle at 50% 50%,#0A0803 52%,#3A2A06 64%,#100D06 78%);color:#E9B52A;box-shadow:0 0 0 1px #A87A10,0 0 28px rgba(233,181,42,.28)}
.t-eclipse .portrait{box-shadow:0 0 0 1px #A87A10,0 0 30px rgba(233,181,42,.22)}
.t-flameborn{--bg:#1C0A05;--card:#2A1009;--ink:#FBE6D4;--muted:#D9A688;--accent:#FF7A2F;--rule:#E4572E;--line:#4A1E12;--on:#1C0A05}
.t-flameborn .crest,.t-flameborn .portrait{box-shadow:0 0 0 1px #E4572E,0 0 26px rgba(255,122,47,.35)}
.t-tidewatcher{--bg:#071A26;--card:#0C2636;--ink:#DDF1F7;--muted:#8FB8C8;--accent:#3FB6D9;--rule:#1F8AB0;--line:#173B4E;--on:#071A26}
.t-tidewatcher .crest,.t-tidewatcher .portrait{box-shadow:0 0 0 1px #1F8AB0,0 0 26px rgba(63,182,217,.3)}
.t-windrider{--bg:#EEF5F4;--card:#F9FCFC;--ink:#1A2A2B;--muted:#55706F;--accent:#2C7A75;--rule:#7FBDB5;--line:#C5DCD9;--on:#F9FCFC}
.t-windrider .crest,.t-windrider .portrait{box-shadow:0 0 0 1px #7FBDB5,0 0 26px rgba(127,189,181,.45)}
.t-stonebreaker{--bg:#E4E1D6;--card:#F2F0E8;--ink:#23221C;--muted:#5F5B4C;--accent:#5C4A2C;--rule:#8A7448;--line:#C4BFAD;--on:#F2F0E8}
.t-stonebreaker .crest,.t-stonebreaker .portrait{box-shadow:0 0 0 1px #8A7448,0 0 26px rgba(138,116,72,.3)}
.t-stormcaller{--bg:#0D0F1F;--card:#161A33;--ink:#E8EAFF;--muted:#A3A8D6;--accent:#9AAAFF;--rule:#F2E15B;--line:#2A2F55;--on:#0D0F1F}
.t-stormcaller .crest,.t-stormcaller .portrait{box-shadow:0 0 0 1px #F2E15B,0 0 26px rgba(242,225,91,.3)}
.t-cirtenos-silver{--bg:#EDEFF2;--card:#F8F9FB;--ink:#1E232B;--muted:#5D6573;--accent:#4A5669;--rule:#A7B0BE;--line:#CDD2DA;--on:#F8F9FB}
.t-cirtenos-silver .crest,.t-cirtenos-silver .portrait{box-shadow:0 0 0 1px #A7B0BE,0 0 26px rgba(167,176,190,.55)}
.t-farlos-tin{--bg:#D7DAD6;--card:#E7E9E5;--ink:#202428;--muted:#525960;--accent:#46525D;--rule:#878F96;--line:#B5BBBE;--on:#E7E9E5}
.t-farlos-tin .crest,.t-farlos-tin .portrait{box-shadow:0 0 0 1px #878F96,0 0 26px rgba(135,143,150,.4)}
.t-jurn-brass{--bg:#F0E8CF;--card:#F9F4E3;--ink:#2D2512;--muted:#6B5C34;--accent:#7A611D;--rule:#B5953F;--line:#DACA97;--on:#F9F4E3}
.t-jurn-brass .crest,.t-jurn-brass .portrait{box-shadow:0 0 0 1px #B5953F,0 0 26px rgba(181,149,63,.4)}
.t-nersi-copper{--bg:#13201E;--card:#1B2C29;--ink:#F1E2D6;--muted:#B8A08E;--accent:#E08A52;--rule:#4FA38E;--line:#2C4440;--on:#13201E}
.t-nersi-copper .crest,.t-nersi-copper .portrait{box-shadow:0 0 0 1px #4FA38E,0 0 26px rgba(224,138,82,.3)}
.t-sarlei-iron{--bg:#161414;--card:#211D1C;--ink:#E9E2DE;--muted:#A8988F;--accent:#C4614A;--rule:#6B5F5A;--line:#3A3230;--on:#161414}
.t-sarlei-iron .crest,.t-sarlei-iron .portrait{box-shadow:0 0 0 1px #6B5F5A,0 0 26px rgba(196,97,74,.28)}
.t-vortan-gold{--bg:#0F1628;--card:#18213A;--ink:#F5ECD2;--muted:#C7B98F;--accent:#E6C15A;--rule:#C9A23A;--line:#2B3654;--on:#0F1628}
.t-vortan-gold .crest,.t-vortan-gold .portrait{box-shadow:0 0 0 1px #C9A23A,0 0 26px rgba(230,193,90,.3)}
.t-tidewater{--bg:#E7EEF0;--card:#F6FAFB;--ink:#14262E;--muted:#4C626B;--accent:#1F5A73;--rule:#2C7590;--line:#AFC4CB;--on:#F6FAFB}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "EB Garamond",Georgia,serif;overflow-x:clip}
#app{min-height:100vh;background:var(--bg);color:var(--ink)}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 64px;border-inline:6px double var(--accent);min-height:100vh}
@media(max-width:660px){.wrap{border-inline-width:0;padding:0 16px 64px}}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.cz{font-family:Cinzel,serif;letter-spacing:.06em}
a{color:var(--accent)}
.btn,.chip{font-family:Cinzel,serif;font-size:12px;letter-spacing:.06em;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:999px;min-height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-decoration:none}
.btn.solid{background:var(--accent);color:var(--on)}
.btn.plain{border-color:transparent;padding:0 6px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--rule);outline-offset:2px}
h1{font-family:Cinzel,serif;font-weight:700;color:var(--accent);font-size:clamp(28px,7vw,40px);line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:Cinzel,serif;font-size:14px;letter-spacing:.12em;color:var(--accent);margin:22px 0 8px}
.rule{height:4px;background:var(--rule);margin-top:10px}.rule+.rule2{height:1px;background:var(--rule);margin-top:2px}
.muted{color:var(--muted)}.small{font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--accent);border-radius:10px;padding:0 12px;height:48px;margin-top:16px}
.search input{border:0;background:transparent;font:inherit;font-size:17px;color:var(--ink);flex:1;outline:none}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;min-height:92px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none}
.tile b{font-family:Cinzel,serif;font-size:15px}.tile.off{opacity:.55}
.row{display:flex;align-items:center;gap:6px;min-height:52px;border-bottom:1px solid var(--line)}
.row a.name{flex:1;color:var(--ink);text-decoration:none;display:flex;flex-direction:column;padding:6px 0}
.row a.name b{font-weight:600;font-size:18px}
.dim{opacity:.58}
.chk{flex:0 0 40px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:0;cursor:pointer;padding:0;margin-left:-8px}
.chk span{width:21px;height:21px;border:2px solid var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center}
.chk[aria-checked=true] span{background:var(--accent)}
.chk svg{display:none}.chk[aria-checked=true] svg{display:block}
.lock{flex:0 0 32px;display:flex;justify-content:center;color:var(--muted)}
.crest{width:112px;height:136px;margin:18px auto 10px;border:3px solid var(--accent);outline:1px solid var(--accent);outline-offset:4px;background:var(--card);display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-size:52px;color:var(--accent)}
.center{text-align:center}
.deskonly{display:none}
/* Atlas: one pan-and-zoom map; pins are Place entries and follow the same reveals. */
.atlas{position:relative;height:min(68vh,760px);min-height:340px;margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#3d5560;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.atlas.drag{cursor:grabbing}
.atlas .layer{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.atlas .layer img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.pin{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;padding:0;border:0;background:none;cursor:pointer;transform:scale(calc(1/var(--s,1)));display:grid;place-items:center}
.pin i{width:16px;height:16px;transform:rotate(45deg);background:#7A1F1F;border:2px solid #F3E9D2;box-shadow:0 1px 4px rgba(0,0,0,.55)}
.pin.city i{width:20px;height:20px;background:#E0B04A;border-color:#2B1D14}
.pin.dim i{background:#6b6b6b;border-style:dashed;opacity:.85}.pin.dim b{opacity:.7;font-style:italic}
.pin.on i{background:#F3E9D2;border-color:#7A1F1F;outline:3px solid rgba(122,31,31,.55)}
.pin b{position:absolute;left:50%;top:27px;transform:translateX(-50%);white-space:nowrap;font:600 13px Cinzel,serif;color:#F3E9D2;text-shadow:0 0 3px #000,0 0 6px #000;pointer-events:none;display:none}
.atlas.names .pin b,.pin.on b{display:block}
.pin.small i{width:11px;height:11px}.pin.small b{font-size:11px;top:22px}.atlas[data-map=valyon].names:not(.near) .pin.small b{display:none}.atlas .pin.small.on b{display:block}
.zoomer{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoomer button{width:40px;height:40px;border-radius:999px;border:1px solid #2B1D14;background:#F3E9D2;color:#2B1D14;font:700 18px Cinzel,serif;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.mapbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.pincard{margin-top:10px}
.pincard h3{font-family:Cinzel,serif;font-size:18px;margin:0 0 2px}
.minimap{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:10px;aspect-ratio:900/520;background:#3d5560;display:block}
.minimap img{position:absolute;display:block;max-width:none;pointer-events:none}
.minimap .pin{pointer-events:none}
.side{display:none}
@media(min-width:1000px){
  .desk{display:grid;grid-template-columns:clamp(260px,18vw,340px) minmax(0,1fr);max-width:2200px;margin:0 auto;min-height:100vh}
  .side{display:block;position:sticky;top:0;height:100vh;overflow:auto;padding:22px 18px 40px;border-right:6px double var(--accent);background:var(--card)}
  .desk .wrap{max-width:none;margin:0;border-inline:0;padding:0 clamp(24px,3vw,72px) 80px}
  .brand{display:block;font-family:Cinzel,serif;font-weight:700;font-size:22px;line-height:1.1;color:var(--accent);text-decoration:none;padding-bottom:10px;border-bottom:4px solid var(--rule);box-shadow:0 3px 0 -2px var(--rule)}
  .search.side{display:flex;height:42px;margin:14px 0 6px}
  .sgroup{margin-top:14px}.slabel{font-size:11px;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
  .slink{display:block;padding:6px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:16px}
  .slink:hover{background:var(--bg)}.slink.on{background:var(--accent);color:var(--on)}
  .slink.set{margin-top:20px;border:1px solid var(--accent);color:var(--accent);font-family:Cinzel,serif;font-size:13px;text-align:center}
  .entry{display:grid;grid-template-columns:clamp(300px,30vw,560px) minmax(0,1fr);gap:clamp(28px,3vw,72px);align-items:start}
  .ent-a{padding-bottom:20px}
  .desk .portrait{width:min(100%,clamp(200px,16vw,300px))}
  .desk .fact .k{flex-basis:clamp(104px,9vw,160px)}
  .ent-b{padding-top:18px}.deskonly{display:block;margin-top:0}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .desk .top{padding:14px 0}
}
.portrait{width:min(52vw,200px);aspect-ratio:4/5;margin:18px auto 10px;padding:0;border:3px solid var(--accent);outline:1px solid var(--accent);outline-offset:5px;background:var(--card);overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.fullbody{margin:6px auto 14px;width:min(100%,340px);border:2px solid var(--accent);outline:1px solid var(--accent);outline-offset:4px;background:var(--card)}
.fullbody img{width:100%;height:auto;display:block}
.names{display:flex;flex-direction:column;align-items:center;margin-top:6px}
.names .line{display:flex;align-items:center;gap:2px;font-size:17px}
.tool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.fact{display:flex;align-items:flex-start;gap:4px;border-bottom:1px dashed var(--line)}
.fact:last-child{border-bottom:0}
.fact .k{flex:0 0 104px;color:var(--muted);padding:9px 8px 9px 0;font-size:15px;overflow-wrap:anywhere}
.fact .v{flex:1;padding:9px 0;font-size:16px}
.sec{border-bottom:1px solid var(--line)}
.sechead{display:flex;align-items:center;gap:2px}
.sechead .toggle{flex:1;display:flex;justify-content:space-between;align-items:center;min-height:50px;background:none;border:0;padding:0;cursor:pointer;font-family:Cinzel,serif;font-size:15px;letter-spacing:.08em;color:var(--accent);text-align:left}
.count{font-family:"EB Garamond",serif;font-size:14px;letter-spacing:0;color:var(--muted);margin-inline:8px}
.item{display:flex;align-items:flex-start;gap:4px;padding:2px 0}
.item .txt{flex:1;padding:8px 0}
.item.sub .txt{font-family:Cinzel,serif;font-size:14px;color:var(--accent)}
.item ul{margin:6px 0 0;padding-left:18px}
.bul{color:var(--accent);flex:0 0 18px;padding-top:9px}
.warn{display:inline-block;font-size:13px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 8px;margin-left:6px}
.dets{margin-top:6px;padding:2px 0 2px 8px;border-left:2px solid var(--line);font-size:15px;color:var(--muted)}
.det{display:flex;align-items:flex-start;gap:2px}
.det .chk{flex-basis:36px;width:36px;height:36px}
.det .chk span{width:18px;height:18px}
.detlab{font-size:10px;letter-spacing:.1em}
.det ul{margin:4px 0 0;padding-left:18px}
.pen{background:none;border:1px solid var(--line);border-radius:6px;color:var(--accent);min-width:32px;min-height:32px;cursor:pointer;font-size:15px}
.editbox textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--accent);border-radius:8px;padding:8px}
.secbar{display:flex;gap:8px;padding:4px 0 10px}
.badge{font-family:Cinzel,serif;font-size:11px;letter-spacing:.08em;padding:4px 10px;border-radius:999px;background:var(--accent);color:var(--on)}
.empty{padding:28px 0;text-align:center;font-style:italic;color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin-top:24px;border-top:1px solid var(--line);padding-top:10px}
select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:40px;padding:0 8px}
.seg{display:flex;border:1.5px solid var(--accent);border-radius:999px;overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;background:none;color:var(--accent);font-family:Cinzel,serif;font-size:13px;letter-spacing:.06em;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on)}
.side-tabs{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);border-radius:12px;gap:0}.side-tabs a{border-top:1px solid var(--line);border-left:1px solid var(--line);margin:-1px 0 0 -1px;text-align:center;padding:8px 2px;font-size:11px!important;letter-spacing:.02em!important;color:var(--accent);text-decoration:none;font-family:Cinzel,serif;font-size:12px;letter-spacing:.06em}.side-tabs a[aria-current=true]{background:var(--accent);color:var(--on)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--accent);color:var(--on);padding:8px 16px;border-radius:999px;font-size:15px;z-index:9}
</style>
</head>

<div id="app" class="t-parchment"><div class="wrap"><p class="empty">Opening the Codex…</p></div></div>
<script>window.CODEX_STATIC={"entries": [{"circle": false, "culture": "Beyond", "dmOnly": false, "facts": [{"id": "1ucqy9c", "label": "Type", "text": "Material"}], "fullBody": null, "fullName": null, "gallery": [], "group": "Other Powers", "headline": "Aether-Steel", "houseGroup": null, "id": "aether-steel", "kind": "system", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "1qc90ea", "items": [{"id": "1sz5alv", "kind": "bullet", "sub": [], "text": "Created when a person of Ferran blood forges steel while infusing it with Aether energy, the fuel source of elemental bonds."}, {"id": "1iyvugu", "kind": "bullet", "sub": [], "text": "The metal acts as a battery for that element's Aether energy, can be used only by the person who infused it, and is completely inert to Ferran senses and control."}]}], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1b01lc8", "label": "Current Residence/Affiliation", "text": "Vaylen soldier on the Northern Front; died of hypothermia on the way to Fort Galthis (deceased)"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Alfred \"Donny\" Donner", "id": "alfred-donny-donner", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1sa8ki7", "label": "Species/Heritage", "text": "Human — unbonded"}, {"id": "3o65r6", "label": "Current Residence/Affiliation", "text": "The Wardens — second recruit; tracker from Salenbrook"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Allison Vint", "id": "allison-vint", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Radiance"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "nbrlx3", "label": "War Title", "text": "Flame of the North"}, {"id": "1k3iboc", "label": "Current Title", "text": "The Dawnwarden"}, {"id": "1jfzfm3", "label": "Age (current timeline)", "text": "25"}, {"id": "10bhgya", "label": "Species/Heritage", "text": "Human — Flameborn (Sherridan holy lineage)"}, {"id": "87xx3p", "label": "Nation/Culture of Origin", "text": "Vaylena (Valyon)"}, {"id": "1sw7wed", "label": "Current Residence/Affiliation", "text": "Keep Al'geth — headquarters of the Dawnwarden and her Wardens"}], "fullBody": {"alt": "Anaria in her full Dawnwarden uniform", "h": 999, "src": "img/10ybgtm-full.jpg", "w": 600}, "fullName": null, "gallery": [], "headline": "Anaria Kresanthe Sherridan", "id": "anaria-kresanthe-sherridan", "names": [{"id": "lf3zfn", "label": "Also known as", "value": "The Dawnwarden"}], "pc": false, "portrait": {"alt": "Anaria, head and shoulders, in her Dawnwarden uniform", "h": 600, "src": "img/10ybgtm-head.jpg", "w": 480}, "sections": [{"dm": false, "heading": "Appearance", "id": "pijped", "items": [{"id": "lv2kqp", "kind": "bullet", "sub": [], "text": "Tall, approximately 6'5\". Red hair, green/teal eyes. Wields a greatsword in the field. Formal white-and-red attire befitting a leader and mentor."}]}, {"dm": false, "heading": "Heritage & Bloodline", "id": "accmo5", "items": [{"id": "3oyghl", "kind": "bullet", "sub": [], "text": "**Mother**: Ashalia Sherridan (\"Embershade\") — direct descendant of the Sherridan branch of Vallesari's holy line, one of Vaylena's oldest Flameborn bloodlines"}, {"id": "7sfkno", "kind": "bullet", "sub": [], "text": "**Father**: Einor Kresanthe"}, {"id": "6ehyhy", "kind": "bullet", "sub": [], "text": "Heritages — Sherridan fire lineage"}]}, {"dm": false, "heading": "Background", "id": "nut4b7", "items": [{"id": "s9u9ir", "kind": "bullet", "sub": [], "text": "As a child, her fire ability was unremarkable — a cultural disappointment given the Sherridan name's prestige. Enlisted as close to a common soldier as possible at 16, when the war instituted a draft for elemental-bonded individuals."}, {"id": "a89xhr", "kind": "bullet", "sub": [], "text": "Served reliably on the Northern Front for the war's first ~3.5 years, alongside squadmates **Leo Kristoff** and **Alfred \"Donny\" Donner**."}, {"id": "1ipbazz", "kind": "bullet", "sub": [], "text": "**Lost in the tundra**: Separated from her squad during a massive blizzard on a long-range patrol."}, {"id": "1kpv9dp", "kind": "bullet", "sub": [], "text": "**Return to Galthis**: Walked into the Central Command tent at Fort Galthis, road-weary in a fur cloak with Fen at her side, as the Knight-Commander ruled on what to do with a young Vaxus."}, {"id": "1ijalmt", "kind": "bullet", "sub": [], "text": "**The Flame of the North**: Returned to the front transformed Earned the highest recorded Ferran kill count of any Vaylen soldier. **Fen was killed** by Ferran warrior **Eldaenia Sarlei** during this period"}, {"id": "1rgsogl", "kind": "bullet", "sub": [], "text": "The Northern Front ended when Ferrena withdrew and redirected south, coinciding with the Raven's completion of House Tyran's subjugation."}, {"id": "17rmhkx", "kind": "bullet", "sub": [], "text": "**Building the Wardens**: While still fighting the Northern Front, Anaria recruited her first two followers: **Frederic \"Fred\" Donner** (younger brother of the late Alfred \"Donny\" Donner, recruited for his swordsmanship and genuine desire to help others) and **Allison Vint** (an unbonded tracker from Salenbrook, hired initially by her local hunters' lodge). For most of the remaining front, the two served alongside her within regular Central Command ranks; only in the war's final two years on that front did she get the three of them formed into their own standalone unit — simply called **the Wardens** at the time."}, {"id": "xuriwm", "kind": "bullet", "sub": [], "text": "After the Northern Front closed, she brought her team to Central to recoup, train, and plan"}, {"id": "b1k3im", "kind": "bullet", "sub": [], "text": "**The capture of Keep Al'geth**: With her core team assembled (Fred, Allison, Cibilla, Dovah), Anaria led a tense infiltration that routed House Vortan from Keep Al'geth, securing Vaylena's first real foothold on the western front at the hard-won river delta. It was at this point she formally adopted the **Dawnwarden** title."}]}, {"dm": false, "heading": "Personality", "id": "gg6e41", "items": [{"id": "hclvfx", "kind": "bullet", "sub": [], "text": "Presents as calm, collected, and mentor-like"}, {"id": "18u2hyn", "kind": "bullet", "sub": [], "text": "**A deliberate, self-aware public image** — a conscious separation between the legend and the woman."}, {"id": "1fu1hr6", "kind": "bullet", "sub": [], "text": "Actively resists the Circle's influence where she can, working to bar it from operating freely"}]}, {"dm": false, "heading": "Relationships", "id": "1hcbjia", "items": [{"id": "1yz8e63", "kind": "bullet", "sub": [], "text": "**Ashalia Sherridan** — mother"}, {"id": "6y6424", "kind": "bullet", "sub": [], "text": "**Einor Kresanthe** — father"}, {"id": "5wjkpq", "kind": "bullet", "sub": [], "text": "**Vaxus Vulcano**"}, {"id": "cb107b", "kind": "bullet", "sub": [], "text": "**Eldaenia Sarlei** — killed her wolf companion Fen"}, {"id": "1mglhla", "kind": "bullet", "sub": [], "text": "**Frederic \"Fred\" Donner** — first Warden recruit; younger brother of the late Alfred \"Donny\" Donner."}, {"id": "1fnrq0x", "kind": "bullet", "sub": [], "text": "**Allison Vint** — second Warden recruit"}, {"id": "1ic253m", "kind": "bullet", "sub": [], "text": "**Cibilla Mothbourn** — the Wardens' main healer"}, {"id": "m382c3", "kind": "bullet", "sub": [], "text": "**Dovah Ikelos** — the Wardens' spellcaster"}]}, {"dm": false, "heading": "Current Status", "id": "4vwkdt", "items": [{"id": "1vqmv1f", "kind": "bullet", "sub": [], "text": "Headquartered at Keep Al'geth as the Dawnwarden, having recently invited Central Command to migrate operations there."}, {"id": "ye83bo", "kind": "bullet", "sub": [], "text": "Serves in a mentor/advisor role, relying on her Wardens for field operations, and coordinates with Knight-Commander Thane Khavren as an equal power rather than as part of Central Command's own structure."}, {"id": "wbzrv3", "kind": "bullet", "sub": [], "text": "The Church of the Mother finds her activities troubling and regards her as a genuine potential threat, but — uncertain how to act against Vaylena's most celebrated war hero"}, {"id": "6y7dyp", "kind": "bullet", "sub": [], "text": "An only child; sole head of House Sherridan following her mother's death."}]}], "theme": "Dawnwarden"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "z0d7ws", "label": "Current Residence/Affiliation", "text": "House Veloce; Veloce Industries"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Andrei Veloce", "id": "andrei-veloce", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1wfteep", "label": "Aliases / Other Names Used", "text": "\"Embershade\""}, {"id": "cbx1uo", "label": "Age (current timeline)", "text": "Mother to Anaria Sherridan"}, {"id": "y02vnl", "label": "Species/Heritage", "text": "Human; Shadowtouched"}, {"id": "q7473m", "label": "Nation/Culture of Origin", "text": "Vaylena"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Ashalia Sherridan", "id": "ashalia-sherridan", "names": [{"id": "rse87i", "label": "Also known as", "value": "Embershade"}], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Appearance", "id": "6q18xc", "items": [{"id": "if7kyh", "kind": "bullet", "sub": [], "text": "Fire burns visibly dark in color rather than the typical hue — the outward sign of her Shadowtouched nature."}]}, {"dm": false, "heading": "Heritage & Bloodline", "id": "1r3nijo", "items": [{"id": "fisz7c", "kind": "bullet", "sub": [], "text": "**Elemental bond**: Flameborn (Fire), visibly altered — burns dark rather than the typical color."}, {"id": "1f17zih", "kind": "bullet", "sub": [], "text": "**Shadowtouched**: An early known example of individuals touched by ambient Veil-leakage. Her exposure came during her youth, ambient rather than from any specific incident — simply time spent in an affected area seeping into her ability palette and taking hold. This does not alter the nature or function of her Fire bond, only its visual appearance."}]}, {"dm": false, "heading": "Background", "id": "17alvze", "items": [{"id": "vg4pmt", "kind": "bullet", "sub": [], "text": "Enrolled at Central University for the Gifted as part of the 23rd Division (one year ahead of Corey's cohort), a member of **Team Spearhead** alongside Magnolia \"Mags\" Darsahm, Judd Preshen, and Douglas Staerborn."}, {"id": "14r7nij", "kind": "bullet", "sub": [], "text": "Her prestige and lineage made her a very public face for the Shadowtouched phenomenon; the Church of the Mother attempted to ostracize her for it at the time, an experience that bred her generally rebellious nature."}, {"id": "cqwc50", "kind": "bullet", "sub": [], "text": "Became friends and rivals with Corey Tyran Veloce despite being in different Divisions — both Flameborn swordfighters of similar martial practice, drawn to measuring themselves against one another."}, {"id": "bzcfr7", "kind": "bullet", "sub": [], "text": "Their rivalry culminated in Corey's fourth-year solo tournament final, a historic Flameborn-versus-Flameborn match which Corey won, claiming the University's Champion title (a purely social sporting honor, unconnected to the true Elemental Crowns)."}, {"id": "1g1ocrx", "kind": "bullet", "sub": [], "text": "Later in life, met and married **Einor Kresanthe**"}]}, {"dm": false, "heading": "Personality", "id": "opt7uy", "items": [{"id": "1q1tgl6", "kind": "bullet", "sub": [], "text": "Rebellious, having been shaped by the Church's attempts to ostracize her for something she never chose and couldn't hide."}, {"id": "bzzxbe", "kind": "bullet", "sub": [], "text": "Reclaims rather than conceals her difference — the self-given name \"Embershade\" reflects this directly."}]}, {"dm": false, "heading": "Relationships", "id": "1pmka6x", "items": [{"id": "2a59pv", "kind": "bullet", "sub": [], "text": "**Einor Kresanthe** — husband"}, {"id": "1bca4xx", "kind": "bullet", "sub": [], "text": "**Anaria Kresanthe Sherridan** — daughter"}, {"id": "wnsc72", "kind": "bullet", "sub": [], "text": "**Corey Tyran Veloce** — old University friend and rival"}, {"id": "zv3e33", "kind": "bullet", "sub": [], "text": "**Taelan Valdis** — her apprentice at the time of Anaria's return to Fort Galthis"}]}, {"dm": false, "heading": "Skills & Abilities", "id": "1r1wbrn", "items": [{"id": "b8mg3y", "kind": "bullet", "sub": [], "text": "Flameborn (Fire) bond, visibly Shadowtouched; skilled swordswoman."}]}, {"dm": false, "heading": "Current Status", "id": "foca64", "items": []}], "theme": "Embershade"}, {"circle": false, "culture": "Elemental", "dmOnly": false, "facts": [{"id": "1jf2tl", "label": "Type", "text": "Companion entity"}], "fullBody": null, "fullName": null, "gallery": [], "group": "How Bonds Work", "headline": "Bond Spirits", "houseGroup": null, "id": "bond-spirits", "kind": "system", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "1g7uskt", "items": [{"id": "17wijlu", "kind": "bullet", "sub": [], "text": "An entity that forms and deepens alongside a person's elemental bond over time, drawing on the bearer's memories and relationships to develop its own personality."}, {"id": "1hnk2gd", "kind": "bullet", "sub": [], "text": "Commonly experienced as a companionable voice in the bonded person's mind; eventually able to manifest as a visible elemental sprite."}, {"id": "vumbhn", "kind": "bullet", "sub": [], "text": "Often bases its form and personality on someone important to the bearer."}]}], "theme": "Parchment"}, {"circle": false, "culture": "Elemental", "dmOnly": false, "facts": [{"id": "1s4nnw2", "label": "Type", "text": "Rare act"}], "fullBody": null, "fullName": null, "gallery": [], "group": "How Bonds Work", "headline": "Bond Transfer", "houseGroup": null, "id": "bond-transfer", "kind": "system", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "7vfmag", "items": [{"id": "fobc8s", "kind": "bullet", "sub": [], "text": "A bond can be consciously given to another person, a rare act possible only for those deeply attuned to their bond."}, {"id": "1dndd5e", "kind": "bullet", "sub": [], "text": "A bond cannot be forced out of a person; it can only be given willingly."}, {"id": "1ospi3n", "kind": "bullet", "sub": [], "text": "A transferred bond arrives already developed, but can be hard for the new bearer to control without the gradual discipline normally built alongside a bond from childhood."}, {"id": "14vpop7", "kind": "bullet", "sub": [], "text": "Losing a bond this way ordinarily kills its bearer."}]}, {"dm": false, "heading": "Known Transfers", "id": "1wu34fv", "items": [{"id": "1jjbvla", "kind": "bullet", "sub": [], "text": "**Toran Veloce to Corey Tyran Veloce** — given in Toran's final moments: \"brothers to the end.\""}]}], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "rnqbvw", "label": "Current Residence/Affiliation", "text": "Hunter from Salenbrook; mother of Allison Vint"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Briar Vint", "id": "briar-vint", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "x2ojq5", "label": "Current Residence/Affiliation", "text": "Office of Central Intelligence — \"Curator of War\""}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Calyx Van Saun", "id": "calyx-van-saun", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Windrider"}, {"at": {"map": "central", "x": 1354, "y": 1359}, "circle": false, "culture": "Valyon", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "group": "Landmarks of Central", "headline": "Central Command Headquarters", "houseGroup": null, "id": "central-command-headquarters", "kind": "place", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"at": {"map": "central", "x": 1531, "y": 1292}, "circle": false, "culture": "Valyon", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "group": "Landmarks of Central", "headline": "Central University Campus", "houseGroup": null, "id": "central-university-campus", "kind": "place", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "7ewpb2", "label": "Type", "text": "University"}, {"id": "y48vbn", "label": "Seat", "text": "Central, Valyon"}], "fullBody": null, "fullName": null, "gallery": [], "group": "Institutions & Faith", "headline": "Central University for the Gifted", "houseGroup": null, "id": "central-university-for-the-gifted", "kind": "faction", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "1e89i2s", "items": [{"id": "wvd9uj", "kind": "bullet", "sub": [], "text": "Central's primary institution for educating bonded individuals, and talented unbonded ones, who are housed on campus under a formal exception to Central's bonded-only entry rule."}, {"id": "1ui6lwq", "kind": "bullet", "sub": [], "text": "Trains student teams in combat, survival and exploration. New students spend roughly the first half of their first year on individual skill and solo tournaments, then join five-person teams that compete across the year."}, {"id": "ntj7jg", "kind": "bullet", "sub": [], "text": "Each incoming cohort is tracked as a numbered **Division**."}, {"id": "1792vyg", "kind": "bullet", "sub": [], "text": "Graduates of the expeditions program can join the **Vanguard Initiative** and continue performing expeditions and duties after graduation."}, {"id": "1mvcx18", "kind": "bullet", "sub": [], "text": "When the old regency council collapsed, University governance stepped in to keep Valyon running. After the council's fall, attendance grew exponentially."}]}, {"dm": false, "heading": "Members", "id": "hoy6dq", "items": [{"id": "1i0j7xs", "kind": "bullet", "sub": [], "text": "**Rehvala Di Aersina** — Grand Master of Elemental Studies, holding the seat since Elise Veloce's student years."}, {"id": "12lz690", "kind": "bullet", "sub": [], "text": "**Elise Veloce** — Flameborn instructor; sits on the Order of Masters."}, {"id": "1dlsydw", "kind": "bullet", "sub": [], "text": "**Garret Forge** — instructor who led the 24th Division's High Water expedition."}, {"id": "lsvn3i", "kind": "bullet", "sub": [], "text": "**Lionel Kilven** — master of invention and artificery, and an instructor."}]}], "theme": "Parchment"}, {"at": {"map": "valyon", "x": 1475, "y": 1365}, "circle": false, "culture": "Valyon", "dmOnly": false, "facts": [{"id": "1s657og", "label": "Type", "text": "District"}], "fullBody": null, "fullName": null, "gallery": [], "group": "Districts", "headline": "Central", "houseGroup": null, "id": "central", "kind": "place", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "123xriq", "items": [{"id": "1ryoe8n", "kind": "bullet", "sub": [], "text": "The walled heart of Valyon, on the river."}, {"id": "1u0ylcc", "kind": "bullet", "sub": [], "text": "Entry was once restricted by law to those with an elemental bond. Central University for the Gifted houses talented unbonded students under a formal exception."}, {"id": "aijfne", "kind": "bullet", "sub": [], "text": "Home of Central University for the Gifted and the seat of the three civic branches."}]}], "theme": "Parchment"}, {"circle": false, "culture": "Elemental", "dmOnly": false, "facts": [{"id": "zf52n9", "label": "Type", "text": "Elemental title"}], "fullBody": null, "fullName": null, "gallery": [], "group": "Champions & Crowns", "headline": "Champions", "houseGroup": null, "id": "champions", "kind": "system", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "83ow8p", "items": [{"id": "18l3pkp", "kind": "bullet", "sub": [], "text": "A Champion is an individual chosen by the ancient force of an element as the most fitting embodiment of that element."}, {"id": "u2hdyc", "kind": "bullet", "sub": [], "text": "A Champion has a trace connection with everyone who carries their bond. Strongly bonded people can sense something different when near their associated Champion."}]}], "theme": "Dawnwarden"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "h3kd7y", "label": "Aliases / Other Names Used", "text": "Chloe Beljean (chosen name during her time in Valyon's outer districts and her period on the road)"}, {"id": "16nl2ry", "label": "Species/Heritage", "text": "Human"}, {"id": "n9c0i9", "label": "Nation/Culture of Origin", "text": "Vaylena — outer districts of Valyon"}, {"id": "1kirwvw", "label": "Vanguard Registry", "text": "C-068"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Chloe Graeven Ardynet", "id": "chloe-graeven-ardynet", "names": [{"id": "1ywtpim", "label": "Born", "value": "Beljean"}], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Heritage & Bloodline", "id": "jwswcp", "items": [{"id": "1ncukia", "kind": "bullet", "sub": [], "text": "**True lineage**: Daughter of Cloever Graeven, heiress to the Graeven line"}, {"id": "1y3gpfe", "kind": "bullet", "sub": [], "text": "**Royal descent**: Great-granddaughter (or similar remove) of **Queen Vanya Graeven**, the last queen of Valyon, who disappeared roughly 80 years before the current timeline. Vanya was the last confirmed **crown-bearer** — a true Champion of Water, bearer of the Crown of Taurien — and the last of the Graeven line to hold the throne."}, {"id": "1xsgb7f", "kind": "bullet", "sub": [], "text": "**Elemental bond**: Water (Tidewatcher)"}, {"id": "ua9hvw", "kind": "bullet", "sub": [], "text": "**The family truth**: Her mother Cloever died by suicide when Chloe was very young, after being unable to cope with hearing voices and memories not her own — the true phenomenon of Til'auriel reaching out to individuals of her direct bloodline from within the Veil. Chloe did not learn this truth until a falling-out with her father years later, well into adulthood."}, {"id": "1x9r33i", "kind": "bullet", "sub": [], "text": "**Living family**: Her uncle by marriage, **Ardynet Graeven**, took her in and became a supplanted father figure. Ardynet was not born a Graeven himself — he took the name in memoriam of his late wife (a granddaughter of Vanya Graeven), who showed some resilience to the family's affliction (occasional whispered voices) but died in her 40s of unrelated natural causes. Ardynet possesses partial knowledge of the line's true nature and has actively educated Chloe on her abilities, her lineage's history, and Central customs, rather than shielding her from the truth."}]}, {"dm": false, "heading": "Background", "id": "51h827", "items": [{"id": "ms3cpe", "kind": "bullet", "sub": [], "text": "Daughter of a lab researcher employed at Veloce Industries; grew up alongside Toran Veloce and Corey Tyran through company circles, forming an inseparable trio and eventually a band together."}, {"id": "6k2xj1", "kind": "bullet", "sub": [], "text": "Established as the group's \"spitfire\" — magnetic, envied, enjoyed being the center of attention."}, {"id": "15rau3a", "kind": "bullet", "sub": [], "text": "Developed a genuine attraction to Corey but enjoyed drawing out the tension between them rather than acting on it directly; publicly presented as Toran's girlfriend for years, though the relationship was never sincere on either side."}, {"id": "5om2jh", "kind": "bullet", "sub": [], "text": "The night of Toran's death and Corey's disappearance into Central left her without any way to follow or reach either of them — Vaylen law at the time restricted entry into Central to those with an elemental bond, and she did not learn what happened for several weeks."}, {"id": "rpwxew", "kind": "bullet", "sub": [], "text": "Fell into a period of depression, resentment, and repeated failed attempts to reach Central, eventually taking to the road and surviving by playing original music — born from her grief — in dive bars and dingy halls."}, {"id": "ccv1l6", "kind": "bullet", "sub": [], "text": "During this period, a falling-out with her father revealed the truth of her mother Cloever's Graeven heritage and the true cause of her death."}, {"id": "i5lv2e", "kind": "bullet", "sub": [], "text": "Stranded roadside outside Westallum after running out of gas following a heartfelt acoustic set, she was found by Thane Khavren, who took her in and helped her begin rebuilding her life — including securing her work on the farm where he was employed."}, {"id": "1f2n1vj", "kind": "bullet", "sub": [], "text": "She and Thane searched out her uncle, **Ardynet Graeven**, who resides in an estate in the hills of northern Westallum. A chance connection with siblings **Walker and Leslie Montaine** — locals with ties to an emerging rival firearms family to House Veloce in Central — helped lead them to him. Ardynet welcomed Chloe hesitantly at first, having lost touch with his late wife's family, but took her in and became a steady, honest father figure — teaching her about her bond, her lineage's true history, and Central's customs, rather than shielding her from any of it."}, {"id": "1uz19ml", "kind": "bullet", "sub": [], "text": "Over roughly nine months under Ardynet's guidance, Chloe's Water (Tidewatcher) bond fully manifested, and she trained it alongside martial arts. She adopted the name **Chloe Graeven Ardynet**, fully claiming her mother's lineage and her found family, and dropping all association with her biological father's name."}, {"id": "1qy5oym", "kind": "bullet", "sub": [], "text": "Ardynet identified a legitimate path into Central: **Central University for the Gifted**, an institution training bonded and talented unbonded individuals alike in combat, survival, and exploration — preparing teams to venture into the still largely unknown world beyond Valyon's walls. Chloe, Thane, the Montaine twins, and an acquaintance of Walker's, **Glenn Holbrook**, enrolled together and were formed into **Team Montaine**, led by Walker."}, {"id": "cry7b7", "kind": "bullet", "sub": [], "text": "During Team Montaine's second year, an expedition accident left Corey — who Chloe learned had also enrolled at the University a year ahead of her — with a severely broken arm, following a confrontation between Corey and Thane over Chloe's unresolved feelings. After learning the true circumstances from a guilt-ridden Thane, and explaining to him what had really happened between Corey and Toran, Chloe went to visit Corey during his hospital recovery. The conversation was tense but became a full reconciliation — Corey finally confessed his lingering feelings for her, and after a long pause, she shared her own side of everything since they'd been separated. The two fully reconciled, recognizing the same unspoken longing in each other."}, {"id": "1n8bxk", "kind": "bullet", "sub": [], "text": "Over the remainder of that year, Chloe visited Corey regularly during his medical leave, and the two quietly began a real relationship — never formally announced, simply understood over time by those close to them. Thane, who often accompanied her, grew close to Corey during this same period, and the three of them became a tight, genuinely brotherly trio of friends."}, {"id": "g1j2nu", "kind": "bullet", "sub": [], "text": "In Corey's fourth year, Team Montaine was brought in to assist Team Van Saun's ongoing off-the-books investigation into corruption within Valyon's regency council. By year's end, the two teams' efforts brought down a number of corrupt council members and caused the entire regency council to collapse, triggering a roughly five-year transitional period in which University-trained graduates founded Valyon's modern governing institutions — Vaylen Central Command (Corey, founding Knight-Commander), the Office of Central Intelligence (Krys Van Saun, founding Director), and the New Regency Council of Valyon (eventually headed by Elise Veloce as Grand Councilor)."}]}, {"dm": false, "heading": "Personality", "id": "1of9vut", "items": [{"id": "164hhl1", "kind": "bullet", "sub": [], "text": "Magnetic, spirited, and enjoys being the center of attention — the group's \"hot shot spitfire.\""}, {"id": "zvhfx", "kind": "bullet", "sub": [], "text": "Uses teasing, deflection, and the thrill of the chase as a way of avoiding real vulnerability, particularly with Corey."}, {"id": "1nwfenw", "kind": "bullet", "sub": [], "text": "Carries deep, only recently faced grief and resentment from being left behind after the crash."}, {"id": "1upfg3o", "kind": "bullet", "sub": [], "text": "Currently in a period of genuine growth — the darkest chapter of her life so far, but one she and those around her recognize as formative."}]}, {"dm": false, "heading": "Relationships", "id": "18t2eti", "items": [{"id": "1g1jhfh", "kind": "bullet", "sub": [], "text": "**Corey Tyran Veloce** — childhood best friend, now her partner; the two reconciled and quietly began a relationship during his recovery from a shattered arm in their University years."}, {"id": "171a6fn", "kind": "bullet", "sub": [], "text": "**Toran Veloce (deceased)** — presented publicly as her boyfriend for years, though the relationship was insincere on both sides."}, {"id": "yknrgr", "kind": "bullet", "sub": [], "text": "**Cloever Graeven (deceased, mother)** — died by suicide when Chloe was young"}, {"id": "1t1j9qm", "kind": "bullet", "sub": [], "text": "**Chloe's father** — relationship fractured by the revelation of the Graeven truth; Chloe has since dropped his name entirely."}, {"id": "18yxjfv", "kind": "bullet", "sub": [], "text": "**Thane Khavren**; remains her closest friend throughout; has since grown into one of Corey's closest friends as well, forming a tight, brotherly trio with the two of them."}, {"id": "147xtbg", "kind": "bullet", "sub": [], "text": "**Ardynet Graeven (uncle by marriage)** — took her in, became a supplanted father figure; educated her on her bond, lineage, and Central customs."}, {"id": "10zu6z5", "kind": "bullet", "sub": [], "text": "**Walker Montaine** — Team Montaine's leader"}, {"id": "1srs6n9", "kind": "bullet", "sub": [], "text": "**Leslie Montaine** — Walker's sister; fast friend to Chloe and Thane."}, {"id": "refjqc", "kind": "bullet", "sub": [], "text": "**Glenn Holbrook** — acquaintance of Walker's, invited onto the team"}]}, {"dm": false, "heading": "Skills & Abilities", "id": "6fmfe", "items": [{"id": "1ttew1k", "kind": "bullet", "sub": [], "text": "Musician and songwriter (guitar/vocals); writes from personal grief and experience."}, {"id": "hquwbh", "kind": "bullet", "sub": [], "text": "Skilled driver; owned and maintained a set of cars including semi-sci-fi fantasy equivalents of a 1970 Chevrolet K20 and a 1971 Chevelle SS."}, {"id": "b7qcm7", "kind": "bullet", "sub": [], "text": "Water (Tidewatcher) bond — now manifested and actively trained, integrated with martial arts combat style."}]}, {"dm": false, "heading": "Current-era Addendum (Year 847)", "id": "1ht6wv2", "items": [{"id": "1qaarvz", "kind": "bullet", "sub": [], "text": "Married Corey; had two children, **Alisa Tyran Veloce** and **Daeon Graeven Ardynet**."}, {"id": "1m0lbvi", "kind": "bullet", "sub": [], "text": "**Deceased.** Killed roughly 9 years before the present timeline during a Vanguard expedition north of High Water, ambushed by covert Ferran agents"}]}], "theme": "Tidewatcher"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "qbibkv", "label": "Current Residence/Affiliation", "text": "The Wardens — main healer; recruited in Central"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Cibilla Mothbourn", "id": "cibilla-mothbourn", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "The Raven"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1uqyrxh", "label": "Current Residence/Affiliation", "text": "The Gunslingers — team leader"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Colter Montaine", "id": "colter-montaine", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Jurn Brass"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "dh6zmz", "label": "Aliases / Other Names Used", "text": "Corey Tyran (prior to adoption into House Veloce)"}, {"id": "r86jff", "label": "Species/Heritage", "text": "Human"}, {"id": "jm4nxi", "label": "Current Residence/Affiliation", "text": "Central, Valyon — adopted member of House Veloce; student at Central University for the Gifted, formerly of Team Veloce (now Team Van Saun)"}, {"id": "3gekyj", "label": "Vanguard Registry", "text": "C-024 (first generation)"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Corey Tyran Veloce", "id": "corey-tyran-veloce", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Heritage & Bloodline", "id": "yqqtoy", "items": [{"id": "15xcftq", "kind": "bullet", "sub": [], "text": "**Elemental bond**: Fire (Flameborn) — **not originally his own.** Received via a rare, consciously performed bond transfer from Toran Veloce in the moments before Toran's death. Inherited already well-developed (trained under Toran for years) but difficult for Corey to control, particularly under emotional strain, due to lacking the gradual personal discipline normally built alongside a bond from childhood."}, {"id": "1epowg7", "kind": "bullet", "sub": [], "text": "**Adoptive lineage**: Formally adopted into House Veloce by Andrei Veloce following Toran's death; raised as sibling to Elise Veloce."}]}, {"dm": false, "heading": "Background", "id": "yczvf0", "items": [{"id": "1l2he5r", "kind": "bullet", "sub": [], "text": "Raised by his mother Alicia in Valyon believing his father died when he was very young"}, {"id": "ib0cp0", "kind": "bullet", "sub": [], "text": "Became close friends with Toran Veloce as a teenager through his mother's position as Andrei Veloce's personal assistant; the two, along with Chloe Beljean, formed an inseparable trio and later a band."}, {"id": "ob69z2", "kind": "bullet", "sub": [], "text": "Developed a deep, unacted-upon romantic interest in Chloe from early on, believing (incorrectly) that she was interested in Toran instead."}, {"id": "se68ox", "kind": "bullet", "sub": [], "text": "Became known on the streets as a skilled racer and mechanic, fully restoring a semi-sci-fi fantasy equivalent of a 1970 Dodge Challenger R/T."}, {"id": "m93ugu", "kind": "bullet", "sub": [], "text": "**The night of Toran's death**: A heated, secret-fueled confrontation with Toran escalated into an angry street race in the rain. Toran crashed fatally; Corey pulled him from the wreckage. In his final moments, Toran consciously transferred his Flameborn bond to Corey, telling him they were \"brothers to the end.\" Corey, himself critically injured, was rushed to Central for care."}, {"id": "cmm1ku", "kind": "bullet", "sub": [], "text": "Adopted into House Veloce by Andrei in the aftermath; spent roughly a year being privately tutored in bond control by his new sister, Elise, while also working alongside Andrei on Veloce Industries projects Also became a subject of Central social/tabloid interest as a young, eligible bachelor."}, {"id": "17szo5b", "kind": "bullet", "sub": [], "text": "By the end of that year, achieved moderate control over his Fire bond, though it remains unstable under strong emotion — leading him to cultivate a deliberately controlled, guarded emotional presence that many find cold or detached until they get to know him well."}, {"id": "1or1pzw", "kind": "bullet", "sub": [], "text": "**Enrollment at Central University for the Gifted**: At Elise's advice (she had already been enrolled a year), Corey enrolled individually as a swordsman — hand-and-a-half European longsword style primarily, occasionally mixing in other forms — deliberately choosing not to use his Flameborn bond at all in competition. His personal philosophy/public statement: *\"Even the common person can rise to the top with practice.\"* He ranked highly in his first-year solo tournament, building a strong independent reputation before being assigned a team."}, {"id": "nuujsb", "kind": "bullet", "sub": [], "text": "**Team Veloce**: Assigned at the season's midpoint to a five-person team, informally named after him despite his preference to act independently at first: Corey (longsword/hidden Flameborn), **Krystal \"Krys\" Van Saun** (quiet Windrider archer, wealthy family), **Jack Sycabel** (semi-arcane gravity-magic polearm user), **Nylah Duglass** (twin swordswoman/healer), and **Koquet Thanatos** (unbonded, high injury tolerance/self-healing — secretly a young Deathless, unrelated to the Songbird's later interest in her; Koquet herself only knows she cannot die, nothing more). The team suffered significant first-year friction from Corey's reluctance to open up or lead; he eventually grew into a leadership role after learning to let his teammates in. Jack left the team between years one and two to pursue unrelated interests. Corey and Koquet developed an easy, comfortable rapport and casual banter."}, {"id": "y7zdg6", "kind": "bullet", "sub": [], "text": "**The Gala and Chloe's return**: At the start of his second year, Central University's new-year gala — hosted that year at Veloce Estates — became the site of a collision of storylines. Krys, having developed unspoken feelings for Corey over the first year, chose the gala to confess to him privately on an upper balcony. Corey, internally already leaning toward gently declining her, was interrupted when Chloe — walked in. Overwhelmed, Corey left without a word to either woman. Chloe, unaware of what she'd interrupted, introduced herself to Krys, who realized mid-conversation exactly who Chloe was (having previously heard about her from Corey) and fell into several months of quiet depression and emotional distance from Corey as a result. Corey did not learn what actually happened on that balcony until years later, from Chloe herself."}, {"id": "iwuf2t", "kind": "bullet", "sub": [], "text": "**Second year**: Krys and Chloe eventually became good friends despite the circumstances of their meeting. Corey and Chloe spent most of the year cautiously rebuilding a connection — largely platonic, though highly charged. Krys, meanwhile, grew close to Thane Khavren (who recognized in her the same hurt he'd once seen in Chloe) after their teams began competing against each other; a romance began forming between them. Team Veloce, Team Montaine, and a transfer team, **Team Everbright** (from Norcereth), emerged as the three dominant teams of the 24th Division's tournament circuit — rivalries remained largely good-natured."}, {"id": "1gumhuw", "kind": "bullet", "sub": [], "text": "**The High Water expedition (end of second year)**: The 24th Division's end-of-year practical exam sent all its teams, under instructor **Garret Forge**, into the mountains north of Norcereth to clear a collapsed rail tunnel and explore the high-altitude valley beyond. There, the team discovered an abandoned pre-Sundering research facility The University had no idea the facility existed and treated the expedition as a simple salvage run; the encrypted documents and data drives recovered stayed with the University, eventually yielding only partial insight into bond inheritance, the possibility of consciously transferring a bond, and the nature of Bond Spirits."}, {"id": "x5l39b", "kind": "bullet", "sub": [], "text": "**The confrontation with Thane**: During the expedition, Thane privately confronted Corey over his continued emotional distance from Chloe, having grown unhappy watching her carry unrequited feelings. The confrontation escalated into a fight, echoing painfully for Corey the night Toran died. Mid-fight, a structural support gave way; Corey shoved Thane clear and took the full brunt of the collapse himself, shattering the bones in his left arm. He lied to instructor Forge afterward, claiming it was simply bad luck, hiding that a fight had caused it — a lie Thane noticed but didn't challenge."}, {"id": "16iqt9i", "kind": "bullet", "sub": [], "text": "**Recovery and Aether-steel**: The injury was severe enough that even after healing magic, Corey could barely use the arm. He took a full year's leave from the University, turning to Valyon's emerging cybernetics tech to build a replacement brace/arm His rebuilt arm functions at or beyond his original organic capability — drastically stronger, and able to channel his Fire bond exactly as his real arm once could."}, {"id": "q5w6a2", "kind": "bullet", "sub": [], "text": "**Leadership transition**: With Corey on leave, leadership of his old team passed to **Krys Van Saun**, who had shown a sharp gift for coordination and tactics through the second year and the expedition. The team was renamed **Team Van Saun** in her honor."}, {"id": "2syrv4", "kind": "bullet", "sub": [], "text": "**The reunion with Chloe**: During his hospital recovery, Chloe — having learned the true circumstances of the fight from a guilt-ridden Thane, and having explained to him what really happened between Corey and Toran — came to visit. The conversation was tense at first, but Corey, worn down by everything Thane's confrontation had dredged up, broke down and told her everything that had happened since Toran's death, including his lingering, unresolved feelings for her. After a long, quiet pause, Chloe shared her own side of everything she'd been through since they were separated. The two finally, fully reconciled — recognizing in each other's grief the same unspoken longing neither had let themselves act on."}, {"id": "18is13a", "kind": "bullet", "sub": [], "text": "**A quiet relationship, a new brotherhood**: Over the rest of that year, Chloe visited Corey regularly during his recovery, and the two began a real relationship — never formally announced, simply understood in public over time. Thane, who often came with her, grew into one of Corey's closest friends during this same period; by year's end, the three of them had formed a tight, genuinely brotherly friendship, built on honesty rather than the unspoken tension that defined Corey's original trio with Toran and Chloe."}, {"id": "3l50ox", "kind": "bullet", "sub": [], "text": "**Team Van Saun's third year**: Without Corey, Team Van Saun struggled to hold its former standing, regularly falling behind Team Montaine and Team Everbright and being folded into their missions as support rather than running independent assignments. The team's remaining members rarely crossed paths with Corey at all during this period, hearing news of him only through Thane or Chloe. The University's third-year curriculum shifted toward real fieldwork within Valyon's own outer districts, giving teams hands-on experience with local problems — which increasingly surfaced a citywide issue: growing corruption within the regency council itself. The year concluded with Team Van Saun, on a rare solo assignment, guarding a social event where they uncovered solid evidence against a corrupt council member — an event Corey happened to be attending. Delighted to see his old teammates again, he ended up present when they made the discovery, and it prompted him to decide it was finally time to return to the University and his team."}, {"id": "1xtq53o", "kind": "bullet", "sub": [], "text": "**Return at full strength (fourth year)**: Corey announced his return at that year's gala, hosted by the **Nightlake family** (another wealthy Central business house). Rather than reclaiming team leadership, he let Krys remain leader and took up the role of frontline striker — a shift that let the team's dynamic finally click into place: Nylah settled back into her natural role as healer/support (having been filling in as striker in his absence), Krys directed from ranged support, and Koquet operated as the team's wildcard. With Corey's arm, bond, and swordsmanship all finally working in concert, Team Van Saun swept the team tournament standings that year, and Corey himself won the solo tournament, defeating **Ashalia Sherridan** in the finals in what became a historic Flameborn-versus-Flameborn match (a purely social University title — \"Champion\" here carries no connection to the true Elemental Crowns)."}, {"id": "1o75a7g", "kind": "bullet", "sub": [], "text": "**The fall of the regency council**: Behind the scenes of his triumphant fourth year, Team Van Saun continued its off-the-books investigation into the regency council's corruption, eventually bringing in Team Montaine to help. By year's end, the two teams had brought down a number of corrupt council members, ultimately causing the entire regency council to collapse."}, {"id": "1oig5mf", "kind": "bullet", "sub": [], "text": "**The founding of Central Command**: In the roughly five-year power vacuum that followed, University governance stepped in to keep Valyon running, giving rise to three new civic branches — built largely from the same generation of students who caused the council's fall. The first was **Vaylen Central Command**, formed from the University's **Vanguard Initiative** (a program automatically enrolling all graduates of the expeditions program, numbered chronologically 1–1000, who continue performing expeditions and duties after graduation). Central Command turned the Vanguard into a formal officer corps, opened admission to common people, and became a semi-militant institution with the founding mission to **Protect and Explore**. Its head position, **Knight-Commander**, was first held by **Corey Tyran Veloce** — its founding leader, though he no longer holds the title by the modern era (reasons not yet detailed)."}]}, {"dm": false, "heading": "Personality", "id": "jfox78", "items": [{"id": "1sqcn19", "kind": "bullet", "sub": [], "text": "Down-to-earth rationalist; the grounded counterbalance to Toran's outgoing energy within their friend group."}, {"id": "1ha8zs0", "kind": "bullet", "sub": [], "text": "Loves adventure and tinkering; finds meaning in restoring and understanding machines."}, {"id": "7j2yxu", "kind": "bullet", "sub": [], "text": "Carries guilt over Toran's death and the years of suppressed feelings for Chloe."}]}, {"dm": false, "heading": "Relationships", "id": "1q40vsf", "items": [{"id": "1cggq6f", "kind": "bullet", "sub": [], "text": "**Alicia Tyran** — mother"}, {"id": "gmp4h6", "kind": "bullet", "sub": [], "text": "**Toran Veloce (deceased)** — best friend, effectively a brother; source of Corey's Fire bond and his Bond Spirit, Kira."}, {"id": "1tg81a7", "kind": "bullet", "sub": [], "text": "**Elise Veloce** — adoptive sister"}, {"id": "1rup9uq", "kind": "bullet", "sub": [], "text": "**Andrei Veloce** — adoptive father; the man who chose to bring Corey into the family after Toran's death"}, {"id": "1r8nvrb", "kind": "bullet", "sub": [], "text": "**Chloe Graeven Ardynet (formerly Beljean)** — Wife."}, {"id": "14wbgm", "kind": "bullet", "sub": [], "text": "**Thane Khavren** — one of his closest friends, regarded as a brother, despite (and partly because of) the confrontation between them that led to Corey's injury"}, {"id": "18f3xnw", "kind": "bullet", "sub": [], "text": "**Krystal \"Krys\" Van Saun**"}, {"id": "3ymnrk", "kind": "bullet", "sub": [], "text": "**Koquet Thanatos** — Team Van Saun's wildcard; comfortable, easy friendship/banter"}, {"id": "v7ovo1", "kind": "bullet", "sub": [], "text": "**Jack Sycabel** — former Team Veloce member; developed a rivalry with Corey before leaving the team to pursue his own path."}, {"id": "rsnsga", "kind": "bullet", "sub": [], "text": "**Nylah Duglass** — Team Van Saun's healer/support; filled in as striker during Corey's absence, glad to return to her natural role once he came back."}, {"id": "a4dt97", "kind": "bullet", "sub": [], "text": "**Ashalia \"Embershade\" Sherridan** — a year ahead (23rd Division, Team Spearhead); friend and rival, both Flameborn swordfighters of similar martial practice"}]}, {"dm": false, "heading": "Skills & Abilities", "id": "1m4uktx", "items": [{"id": "kbvj9o", "kind": "bullet", "sub": [], "text": "Skilled mechanic, inventor, and driver"}, {"id": "1too9c9", "kind": "bullet", "sub": [], "text": "Fire (Flameborn) bond — inherited, now fully controlled following his emotional stabilization."}, {"id": "1jcdxkd", "kind": "bullet", "sub": [], "text": "Cybernetically enhanced left arm/brace of his own design; functions at or beyond his original organic capability and channels his Fire bond."}, {"id": "hn7jhs", "kind": "bullet", "sub": [], "text": "Highly skilled swordsman — primarily hand-and-a-half European longsword style, occasionally mixing other forms; won Central University's solo tournament Champion title in his fourth year, defeating Ashalia Sherridan."}, {"id": "1ndgzg8", "kind": "bullet", "sub": [], "text": "Musician (guitar/band, alongside Toran and Chloe, in his earlier years)."}]}, {"dm": false, "heading": "Current-era Addendum (Year 847)", "id": "phlsdr", "items": [{"id": "1jmhbx2", "kind": "bullet", "sub": [], "text": "Married Chloe; they had two children, **Alisa Tyran Veloce** and **Daeon Graeven Ardynet**."}, {"id": "25bg35", "kind": "bullet", "sub": [], "text": "Held the Knight-Commander seat until year 838 (age 43), roughly 9 years before the present timeline."}]}], "theme": "Flameborn"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1qefus6", "label": "Current Residence/Affiliation", "text": "Captain of the Crownsguard (later refocused into the Crownseekers)"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Daeon Graeven Ardynet", "id": "daeon-graeven-ardynet", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Tidewatcher"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "7zf2vg", "label": "Current Residence/Affiliation", "text": "Head of a hunters' lodge in Salenbrook; father of Allison Vint"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Derren Hestre", "id": "derren-hestre", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1u52zig", "label": "Current Residence/Affiliation", "text": "The Wardens — spellcaster"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Dovah Ikelos", "id": "dovah-ikelos", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Vortan Gold"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1dto2r1", "label": "Current Residence/Affiliation", "text": "Valyon — renowned master blacksmith"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Einor Kresanthe", "id": "einor-kresanthe", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Heritage & Bloodline", "id": "1hv0sn1", "items": [{"id": "uu21oh", "kind": "bullet", "sub": [], "text": "Married **Ashalia Sherridan**, of Vaylena's Sherridan Flameborn holy lineage; father to **Anaria Kresanthe Sherridan**"}]}, {"dm": false, "heading": "Background", "id": "l4i157", "items": [{"id": "1cfhrjv", "kind": "bullet", "sub": [], "text": "Met **Ashalia Sherridan** when she visited his forge for weapons and equipment"}]}, {"dm": false, "heading": "Relationships", "id": "1j3lflm", "items": [{"id": "189dngz", "kind": "bullet", "sub": [], "text": "**Ashalia Sherridan**"}, {"id": "1womv2e", "kind": "bullet", "sub": [], "text": "**Anaria Kresanthe Sherridan (The Dawnwarden)**"}]}, {"dm": false, "heading": "Skills & Abilities", "id": "u9779q", "items": [{"id": "6wb2nu", "kind": "bullet", "sub": [], "text": "Master blacksmith"}]}], "theme": "Steelforged"}, {"circle": false, "culture": "Ferran", "dmOnly": false, "facts": [{"id": "q6c8p9", "label": "Species/Heritage", "text": "Ferran — House Sarlei"}, {"id": "1hj6f7s", "label": "Current Residence/Affiliation", "text": "Ferran warrior"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Eldaenia Sarlei", "id": "eldaenia-sarlei", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Sarlei Iron"}, {"circle": false, "culture": "Elemental", "dmOnly": false, "facts": [{"id": "10btabb", "label": "Type", "text": "Hereditary elemental power"}, {"id": "5t4zz9", "label": "Lineages", "text": "Flameborn, Tidewatchers, Windriders, Stonebreakers, Stormcallers"}], "fullBody": null, "fullName": null, "gallery": [], "group": "How Bonds Work", "headline": "Elemental Bonds", "houseGroup": null, "id": "elemental-bonds", "kind": "system", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "1j6tmmn", "items": [{"id": "5dqi4v", "kind": "bullet", "sub": [], "text": "Vaylena holds a system of hereditary elemental bloodlines, taught by the Church as granted originally by the Mother. Elemental ability is tied to lineage and regarded as prestigious; poor ability in a bloodline heir is a cultural disappointment."}, {"id": "dmuqce", "kind": "bullet", "sub": [], "text": "In Church doctrine, the five holy lineages descend from the Primarchs, believed to be the Mother's immediate children."}, {"id": "4qcixo", "kind": "bullet", "sub": [], "text": "Family names in Vaylena are typically carried by whichever spouse holds the bond, regardless of gender."}, {"id": "1y6me3g", "kind": "bullet", "sub": [], "text": "At the start of the war, a draft was instituted for element-bound people aged 16 and up."}, {"id": "1fxwdm4", "kind": "bullet", "sub": [], "text": "Many Ferrans regard Vaylen elemental bonds as an insult to the natural order."}]}], "theme": "Parchment"}, {"circle": false, "culture": "Elemental", "dmOnly": false, "facts": [{"id": "1vqq0a7", "label": "Type", "text": "Relic"}], "fullBody": null, "fullName": null, "gallery": [], "group": "Champions & Crowns", "headline": "Elemental Crowns", "houseGroup": null, "id": "elemental-crowns", "kind": "system", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Overview", "id": "l8x0nr", "items": [{"id": "1a3hxgt", "kind": "bullet", "sub": [], "text": "Valyon's royal succession once required a crown-bearer. Queen Vanya Graeven, bearer of the Crown of Taurien, was the last; with her disappearance, no one could take the throne."}, {"id": "10gm996", "kind": "bullet", "sub": [], "text": "The Crownseekers are tasked with searching for the Elemental Crowns."}, {"id": "xrcf4p", "kind": "bullet", "sub": [], "text": "The Circle seeks seven relics: the five Elemental Crowns, plus two others."}]}], "theme": "Dawnwarden"}, {"at": {"map": "world", "x": 2261, "y": 1683}, "circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "group": "Cities & Towns", "headline": "Elethmoor", "houseGroup": null, "id": "elethmoor", "kind": "place", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1bg7uer", "label": "Age (current timeline, year 847)", "text": "Mid-50s"}, {"id": "1s46j6u", "label": "Species/Heritage", "text": "Human — Flameborn"}, {"id": "1pzb2e1", "label": "Nation/Culture of Origin", "text": "Vaylena — Central, Valyon"}, {"id": "15hfd8h", "label": "Current Residence/Affiliation", "text": "Central, Valyon — Grand Councilor of the New Regency Council of Valyon; instructor at Central University for the Gifted"}], "fullBody": null, "fullName": null, "gallery": [], "headline": "Elise Veloce", "id": "elise-veloce", "names": [], "pc": false, "portrait": null, "sections": [{"dm": false, "heading": "Heritage & Bloodline", "id": "1p2vuoh", "items": [{"id": "1ij45cq", "kind": "bullet", "sub": [], "text": "**True lineage**: Elder daughter of Andrei and Lorelei Veloce"}, {"id": "18nmcyb", "kind": "bullet", "sub": [], "text": "**Elemental bond**: Flameborn (Fire) — naturally gifted, unlike her adoptive brother Corey, whose Fire bond was inherited via transfer rather than birth."}]}, {"dm": false, "heading": "Background", "id": "whoffb", "items": [{"id": "1q5s3m2", "kind": "bullet", "sub": [], "text": "Became a pop culture icon and celebrity musician in her teenage years, alongside her younger brother Toran (who preferred smaller venues and close friends over her level of fame)."}, {"id": "a6bkco", "kind": "bullet", "sub": [], "text": "Enrolled at Central University for the Gifted one year ahead of Corey's cohort, as part of the 23rd Division. Member of **Team Silentium**, an all-girls team that became \"insanely popular\" as emerging pop icons in Central's social sphere, led by Ceilia Ordeneau."}, {"id": "1hlo9dv", "kind": "bullet", "sub": [], "text": "After Toran's death and Corey's adoption into House Veloce, took on the role of mentor and older sister to Corey despite her own grief — privately tutoring him in Fire bond control for roughly a year, with warmth and teasing, working to make him feel welcome in the family."}, {"id": "1ntyprl", "kind": "bullet", "sub": [], "text": "**Rise to Grand Councilor**: In the roughly five-year transitional period following the collapse of the old regency council (which Corey and Chloe's teams caused), Elise succeeded her father Andrei onto the New Regency Council of Valyon and, in time, rose to the seat of **Grand Councilor** — the council's head, responsible for overseeing and arbitrating its members and serving as its voice to the people. She still holds this position in the modern era."}, {"id": "6j6ba5", "kind": "bullet", "sub": [], "text": "Married a man from a middle-class family (name not yet established) and has since become known as **Grand Councilor Elise Veloce Le'Senthe**. They have one son, roughly 6 years old, who is also Flameborn."}, {"id": "19dr5gi", "kind": "bullet", "sub": [], "text": "Alongside her civic duties, continues to serve as a Flameborn instructor at Central University and sits on the University's **Order of Masters**, under Grand Master of Elemental Studies Rehvala Di Aersina — who has held that seat since Elise's own student years."}]}, {"dm": false, "heading": "Personality", "id": "yfxk7x", "items": [{"id": "1j9rry1", "kind": "bullet", "sub": [], "text": "Strong-hearted even in grief; took to being an older sister and mentor to Corey with real warmth despite her own loss."}, {"id": "z7dr1h", "kind": "bullet", "sub": [], "text": "A public figure by nature, comfortable in the spotlight — both as a teenage pop icon and later as Grand Councilor."}]}, {"dm": false, "heading": "Relationships", "id": "300nwu", "items": [{"id": "h7f33b", "kind": "bullet", "sub": [], "text": "**Andrei Veloce (father)** and **Lorelei Veloce (mother, deceased)** — her parents; succeeded her father onto the New Regency Council."}, {"id": "s0phtg", "kind": "bullet", "sub": [], "text": "**Toran Veloce (deceased, brother)** — younger brother, killed in a street racing accident."}, {"id": "1b011qr", "kind": "bullet", "sub": [], "text": "**Corey Tyran Veloce (adoptive brother)** — became his mentor and older sister after his adoption into House Veloce"}, {"id": "19rq0qg", "kind": "bullet", "sub": [], "text": "**Chloe Graeven Ardynet (deceased)** — knew Chloe from their younger years, before Chloe's estrangement from Corey"}, {"id": "j2oowf", "kind": "bullet", "sub": [], "text": "**Unnamed husband** — middle-class background."}, {"id": "1u0th0w", "kind": "bullet", "sub": [], "text": "**Unnamed son** — approximately 6 years old, Flameborn."}, {"id": "1rr13g0", "kind": "bullet", "sub": [], "text": "**Rehvala Di Aersina** — Grand Master of Elemental Studies at Central University; Elise's superior on the Order of Masters."}]}, {"dm": false, "heading": "Skills & Abilities", "id": "f1ridu", "items": [{"id": "mwxtbh", "kind": "bullet", "sub": [], "text": "Flameborn (Fire) bond, naturally gifted and fully trained."}, {"id": "17rn3wo", "kind": "bullet", "sub": [], "text": "Skilled musician and public performer."}, {"id": "1n6w2jb", "kind": "bullet", "sub": [], "text": "Civic leadership — Grand Councilor of the New Regency Council of Valyon."}, {"id": "cjbi72", "kind": "bullet", "sub": [], "text": "Instructor in elemental studies at Central University."}]}, {"dm": false, "heading": "Current Status", "id": "1pxrs31", "items": [{"id": "18tm6k7", "kind": "bullet", "sub": [], "text": "Serving as Grand Councilor of the New Regency Council of Valyon, a position she has held since some point after its founding roughly 9+ years ago."}, {"id": "10cztrk", "kind": "bullet", "sub": [], "text": "Married with one young Flameborn son; continues to instruct at Central University alongside her civic role."}]}], "theme": "Flameborn"}, {"at": {"map": "valyon", "x": 2070, "y": 1415}, "circle": false, "culture": "Valyon", "dmOnly": false, "facts": [], "fullBody": null, "fullName": null, "gallery": [], "group": "Districts", "headline": "Esteren", "houseGroup": null, "id": "esteren", "kind": "place", "names": [], "pc": false, "portrait": null, "sections": [], "theme": "Parchment"}, {"circle": false, "culture": "Vaylen", "dmOnly": false, "facts": [{"id": "1tucvxb", "label": "Current Residence/Affiliation", "text": "Central University for the Gifted, 24th Division — Team Everbright"}], "fullBody": {"alt": "Fella Telsan, full length", "h": 800, "src": "img/18frb2w-full.jpg", "w": 600}, "fullName": null, "gallery": [], "headline":
